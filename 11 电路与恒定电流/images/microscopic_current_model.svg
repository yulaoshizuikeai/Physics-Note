<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="360">
  <defs>
    <marker id="e-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">电流的微观柱体模型推导 (I = n e S v)</text>

  <!-- Cylindrical conductor -->
  <g transform="translate(100, 70)">
    <!-- Main body -->
    <path d="M 60 40 L 460 40 A 20 80 0 0 1 460 200 L 60 200 A 20 80 0 0 1 60 40 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <!-- Back ellipse for 3D look -->
    <ellipse cx="60" cy="120" rx="20" ry="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <ellipse cx="460" cy="120" rx="20" ry="80" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="460" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">横截面 S</text>

    <!-- Moving electrons -->
    <circle cx="160" cy="90" r="7" fill="#dc2626"/>
    <line x1="160" y1="90" x2="220" y2="90" stroke="#dc2626" stroke-width="2" marker-end="url(#e-arr)"/>
    
    <circle cx="260" cy="140" r="7" fill="#dc2626"/>
    <line x1="260" y1="140" x2="320" y2="140" stroke="#dc2626" stroke-width="2" marker-end="url(#e-arr)"/>

    <circle cx="340" cy="85" r="7" fill="#dc2626"/>
    <line x1="340" y1="85" x2="400" y2="85" stroke="#dc2626" stroke-width="2" marker-end="url(#e-arr)"/>

    <!-- Dimension Delta l = v * Delta t -->
    <line x1="60" y1="220" x2="460" y2="220" stroke="#475569" stroke-width="1.5"/>
    <text x="260" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">柱体长度 Δl = v · Δt</text>
  </g>

  <!-- Formula derivation card -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="640" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="320" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">微观表达式三级推导链：</text>
    <text x="320" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#14532d">柱体内电子总数 N = n·V = n·S·(v·Δt) ──> 总电荷量 Δq = N·e = n·e·S·v·Δt ──> 电流 I = Δq / Δt = n e S v</text>
  </g>
</svg>