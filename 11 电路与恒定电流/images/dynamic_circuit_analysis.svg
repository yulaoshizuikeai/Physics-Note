<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_dyn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg_dyn)" rx="12" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="32" fill="#f8fafc" font-size="17" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">闭合电路动态分析双核心方法论：程序法与“串反并同”</text>

  <!-- 左侧：程序分析法（因果链） -->
  <g transform="translate(30, 55)">
    <rect width="335" height="250" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="167" y="26" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">严格因果演绎：程序法 (局 → 全 → 局)</text>

    <!-- Step 1 -->
    <rect x="25" y="45" width="285" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="35" y="66" fill="#fbbf24" font-size="12" font-weight="bold">第 1 步 (局部)：</text>
    <text x="125" y="66" fill="#e2e8f0" font-size="12">滑动变阻器阻值变化 R_变 ↑ (或 ↓)</text>

    <!-- Arrow -->
    <line x1="167" y1="77" x2="167" y2="92" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr_blue)"/>

    <!-- Step 2 -->
    <rect x="25" y="94" width="285" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="35" y="115" fill="#fbbf24" font-size="12" font-weight="bold">第 2 步 (整体)：</text>
    <text x="125" y="115" fill="#e2e8f0" font-size="12">外电阻 R_外 ↑ ⇒ 总电流 I_总 ↓</text>

    <!-- Arrow -->
    <line x1="167" y1="126" x2="167" y2="141" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr_blue)"/>

    <!-- Step 3 -->
    <rect x="25" y="143" width="285" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="35" y="164" fill="#fbbf24" font-size="12" font-weight="bold">第 3 步 (电源)：</text>
    <text x="125" y="164" fill="#e2e8f0" font-size="12">内电压 U_内=Ir ↓ ⇒ 端电压 U_端 ↑</text>

    <!-- Arrow -->
    <line x1="167" y1="175" x2="167" y2="190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr_blue)"/>

    <!-- Step 4 -->
    <rect x="25" y="192" width="285" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="35" y="210" fill="#fbbf24" font-size="12" font-weight="bold">第 4 步 (定值支路)：</text>
    <text x="145" y="210" fill="#e2e8f0" font-size="11">分析定值电阻 U、I</text>
    <text x="35" y="226" fill="#fbbf24" font-size="12" font-weight="bold">第 5 步 (变化支路)：</text>
    <text x="145" y="226" fill="#e2e8f0" font-size="11">由干路减支路推导变阻支路</text>
  </g>

  <!-- 右侧：“串反并同”口诀法则 -->
  <g transform="translate(395, 55)">
    <rect width="335" height="250" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="167" y="26" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">高考秒杀法宝：“串反并同”定理</text>

    <!-- 串反 -->
    <rect x="20" y="45" width="295" height="85" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.5"/>
    <text x="35" y="70" fill="#f87171" font-size="15" font-weight="bold">「串反」：与可变电阻呈串联关系</text>
    <text x="35" y="93" fill="#cbd5e1" font-size="12">• 元件电学量（I, U, P）变化趋势与 R_变 <tspan fill="#f87171" font-weight="bold">相反</tspan></text>
    <text x="35" y="113" fill="#94a3b8" font-size="11.5">即：R_变 ↑ ⇒ I_串 ↓、U_串 ↓、P_串 ↓</text>

    <!-- 并同 -->
    <rect x="20" y="145" width="295" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="170" fill="#38bdf8" font-size="15" font-weight="bold">「并同」：与可变电阻呈并联关系</text>
    <text x="35" y="193" fill="#cbd5e1" font-size="12">• 元件电学量（I, U, P）变化趋势与 R_变 <tspan fill="#38bdf8" font-weight="bold">相同</tspan></text>
    <text x="35" y="213" fill="#94a3b8" font-size="11.5">即：R_变 ↑ ⇒ I_并 ↑、U_并 ↑、P_并 ↑</text>
  </g>
</svg>