<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Glass Drop Shadow -->
    <filter id="glass-shadow" x="-15%" y="-15%" width="135%" height="140%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#090d16" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <!-- Neon Glow Filter for Atom Orbits -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Nucleus Glow -->
    <filter id="nucleus-glow" x="-60%" y="-60%" width="220%" height="220%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Edge Blur -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>

    <!-- Translucent Liquid Glass Fill Gradient -->
    <linearGradient id="liquid-surface" x1="24" y1="24" x2="296" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="28%" stop-color="#f0f9ff" stop-opacity="0.24" />
      <stop offset="68%" stop-color="#e0e7ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.32" />
    </linearGradient>

    <!-- Chromatic Dispersion Edge (Prism Liquid Rim) -->
    <linearGradient id="chromatic-rim" x1="24" y1="24" x2="296" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="18%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="42%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="88%" stop-color="#f472b6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Inner Refraction Stroke -->
    <linearGradient id="inner-rim" x1="27" y1="27" x2="293" y2="293" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Curved Specular Lens Sheen -->
    <linearGradient id="specular-lens" x1="35" y1="35" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Orbit Gradients -->
    <linearGradient id="orbit-grad-1" x1="74" y1="130" x2="246" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="orbit-grad-2" x1="80" y1="110" x2="240" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbit-grad-3" x1="240" y1="110" x2="80" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Nucleus Radial Gradients -->
    <radialGradient id="nucleus-body" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </radialGradient>

    <radialGradient id="nucleus-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Continuous animations */
    .glass-squircle {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.5s ease;
      transform-origin: 160px 160px;
    }

    .orbit-1 {
      transform-origin: 160px 160px;
      animation: spin-1 18s linear infinite;
    }
    .orbit-2 {
      transform-origin: 160px 160px;
      animation: spin-2 24s linear infinite reverse;
    }
    .orbit-3 {
      transform-origin: 160px 160px;
      animation: spin-3 20s linear infinite;
    }

    .atom-core {
      transform-origin: 160px 160px;
      animation: pulse-core 3.6s ease-in-out infinite;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .specular-glide {
      transform-origin: 160px 160px;
      animation: sweep-glide 6s ease-in-out infinite;
    }

    @keyframes spin-1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-2 {
      from { transform: rotate(60deg); }
      to { transform: rotate(420deg); }
    }
    @keyframes spin-3 {
      from { transform: rotate(120deg); }
      to { transform: rotate(480deg); }
    }

    @keyframes pulse-core {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
      }
      50% {
        transform: scale(1.14);
        filter: drop-shadow(0 0 18px rgba(129, 140, 248, 0.9));
      }
    }

    @keyframes sweep-glide {
      0%, 100% {
        opacity: 0.75;
        transform: translate(0, 0);
      }
      50% {
        opacity: 0.95;
        transform: translate(3px, 3px);
      }
    }

    /* Interactive hover styling */
    svg:hover .glass-squircle {
      filter: url(#glass-shadow) drop-shadow(0 0 24px rgba(56, 189, 248, 0.5));
      transform: scale(1.03);
    }

    svg:hover .orbit-1 {
      animation-duration: 5s;
    }
    svg:hover .orbit-2 {
      animation-duration: 6s;
    }
    svg:hover .orbit-3 {
      animation-duration: 5.5s;
    }

    svg:hover .atom-core {
      transform: scale(1.22);
    }

    svg:hover .electron-glow {
      filter: drop-shadow(0 0 10px #ffffff);
    }
  </style>

  <!-- ================= BASE: CLEAN LIQUID GLASS CONTAINER ================= -->
  <g class="glass-squircle" filter="url(#glass-shadow)">
    <!-- Frosted Translucent Glass Body -->
    <rect x="24" y="24" width="272" height="272" rx="64" fill="url(#liquid-surface)" />

    <!-- Chromatic Prism Edge Refraction Rim -->
    <rect x="24" y="24" width="272" height="272" rx="64" fill="none" stroke="url(#chromatic-rim)" stroke-width="2.5" />

    <!-- Inner Glass Depth Rim -->
    <rect x="27" y="27" width="266" height="266" rx="61" fill="none" stroke="url(#inner-rim)" stroke-width="1.2" />

    <!-- Top-Left Organic Specular Lens Sheen -->
    <path class="specular-glide" d="M 48 110 C 48 60 68 40 110 40 C 170 40 210 65 145 110 C 90 148 48 140 48 110 Z" fill="url(#specular-lens)" />

    <!-- Crisp Glass Glint Line Along Top Curve -->
    <path d="M 80 26 C 120 25 200 25 240 26" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.95" filter="url(#soft-blur)" />

    <!-- ================= FOREGROUND: LUMINOUS QUANTUM ATOM ================= -->
    <!-- Ambient Core Halo -->
    <circle cx="160" cy="160" r="70" fill="url(#nucleus-ambient)" />

    <!-- Orbit 1: Dynamic revolving ellipse -->
    <g class="orbit-1">
      <ellipse cx="160" cy="160" rx="86" ry="30" fill="none" stroke="url(#orbit-grad-1)" stroke-width="6.5" stroke-opacity="0.65" filter="url(#neon-glow)" />
      <ellipse cx="160" cy="160" rx="86" ry="30" fill="none" stroke="#f0f9ff" stroke-width="2" stroke-opacity="0.95" />
      <g class="electron-glow" filter="url(#neon-glow)">
        <circle cx="246" cy="160" r="6.5" fill="#00f0ff" />
        <circle cx="246" cy="160" r="2.5" fill="#ffffff" />
      </g>
    </g>

    <!-- Orbit 2: Dynamic revolving ellipse -->
    <g class="orbit-2">
      <ellipse cx="160" cy="160" rx="86" ry="30" fill="none" stroke="url(#orbit-grad-2)" stroke-width="6.5" stroke-opacity="0.65" filter="url(#neon-glow)" />
      <ellipse cx="160" cy="160" rx="86" ry="30" fill="none" stroke="#f5f3ff" stroke-width="2" stroke-opacity="0.95" />
      <g class="electron-glow" filter="url(#neon-glow)">
        <circle cx="246" cy="160" r="6.5" fill="#c084fc" />
        <circle cx="246" cy="160" r="2.5" fill="#ffffff" />
      </g>
    </g>

    <!-- Orbit 3: Dynamic revolving ellipse -->
    <g class="orbit-3">
      <ellipse cx="160" cy="160" rx="86" ry="30" fill="none" stroke="url(#orbit-grad-3)" stroke-width="6.5" stroke-opacity="0.65" filter="url(#neon-glow)" />
      <ellipse cx="160" cy="160" rx="86" ry="30" fill="none" stroke="#eff6ff" stroke-width="2" stroke-opacity="0.95" />
      <g class="electron-glow" filter="url(#neon-glow)">
        <circle cx="246" cy="160" r="6.5" fill="#38bdf8" />
        <circle cx="246" cy="160" r="2.5" fill="#ffffff" />
      </g>
    </g>

    <!-- Central Nucleus: Iridescent Crystal Core -->
    <g class="atom-core">
      <!-- Chromatic outer ring -->
      <circle cx="160" cy="160" r="20" fill="none" stroke="url(#chromatic-rim)" stroke-width="1.8" stroke-opacity="0.85" filter="url(#nucleus-glow)" />
      <!-- Glowing inner sphere -->
      <circle cx="160" cy="160" r="14" fill="url(#nucleus-body)" filter="url(#nucleus-glow)" />
      <!-- Specular Highlight -->
      <ellipse cx="155.5" cy="155" rx="4.5" ry="2.5" transform="rotate(-30 155.5 155)" fill="#ffffff" opacity="0.95" />
    </g>
  </g>
</svg>
