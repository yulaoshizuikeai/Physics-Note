<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Center Nucleus -->
  <circle cx="100" cy="100" r="14" fill="url(#grad1)" />
  <circle cx="100" cy="100" r="18" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Orbit 1 -->
  <ellipse cx="100" cy="100" rx="80" ry="28" fill="none" stroke="url(#grad2)" stroke-width="4" stroke-dasharray="8 4" transform="rotate(0 100 100)" />
  <circle cx="180" cy="100" r="6" fill="#06b6d4" />

  <!-- Orbit 2 -->
  <ellipse cx="100" cy="100" rx="80" ry="28" fill="none" stroke="url(#grad1)" stroke-width="4" transform="rotate(60 100 100)" />
  <circle cx="140" cy="169" r="6" fill="#8b5cf6" />

  <!-- Orbit 3 -->
  <ellipse cx="100" cy="100" rx="80" ry="28" fill="none" stroke="url(#grad2)" stroke-width="4" transform="rotate(120 100 100)" />
  <circle cx="60" cy="169" r="6" fill="#3b82f6" />
</svg>
