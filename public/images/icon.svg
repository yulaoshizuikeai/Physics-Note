<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Static icon for navbar / favicon (no animation) -->
  <!-- Orbit 1: 0° -->
  <ellipse cx="100" cy="100" rx="65" ry="22" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Orbit 2: 60° -->
  <ellipse cx="100" cy="100" rx="65" ry="22" transform="rotate(60 100 100)" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Orbit 3: 120° -->
  <ellipse cx="100" cy="100" rx="65" ry="22" transform="rotate(120 100 100)" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Electron 1 -->
  <circle cx="165" cy="100" r="3.5" fill="#60a5fa"/>
  <!-- Electron 2 -->
  <circle cx="67.5" cy="56.3" r="3.5" fill="#a78bfa"/>
  <!-- Electron 3 -->
  <circle cx="67.5" cy="143.7" r="3.5" fill="#38bdf8"/>
  <!-- Nucleus -->
  <circle cx="100" cy="100" r="7" fill="#3b82f6"/>
  <circle cx="98" cy="98" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>
