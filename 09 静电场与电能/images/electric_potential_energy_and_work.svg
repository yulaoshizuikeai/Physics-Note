<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-ep" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r-ep" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    静电场电势能、电势与静电力做功定量转换机制
  </text>

  <!-- ==================== 左侧：顺电场线做功与电势能 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 顺着电场线电势降落与正负电荷做功
    </text>

    <!-- 电场线与等势面示意 -->
    <g transform="translate(25, 34)">
      <!-- 电场线 (向右) -->
      <line x1="10" y1="35" x2="290" y2="35" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b-ep)"/>
      <line x1="10" y1="80" x2="290" y2="80" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b-ep)"/>
      <text x="295" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3b82f6">E</text>

      <!-- 等势面 A 与 B (竖直虚线) -->
      <line x1="80" y1="15" x2="80" y2="105" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="75" y="12" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">φ_A</text>
      <line x1="220" y1="15" x2="220" y2="105" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="215" y="12" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">φ_B</text>

      <!-- 正电荷移动 (高电势 A -> 低电势 B) -->
      <circle cx="80" cy="35" r="7" fill="#ef4444"/>
      <text x="80" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">+q</text>
      <line x1="90" y1="35" x2="210" y2="35" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-r-ep)"/>
      <text x="135" y="27" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">静电力做正功 W &gt; 0</text>

      <!-- 负电荷移动 (A -> B) -->
      <circle cx="80" cy="80" r="7" fill="#2563eb"/>
      <text x="80" y="84" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">-q</text>
      <line x1="90" y1="80" x2="210" y2="80" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-b-ep)"/>
      <text x="135" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">静电力做负功 W &lt; 0</text>
    </g>

    <!-- 卡片说明 -->
    <rect x="12" y="150" width="336" height="106" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">✦ 核心公理：顺着电场线方向，电势必降落（φ_A &gt; φ_B）</text>
    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="bold" fill="#dc2626">正电荷</tspan>：顺电场线移，电场力做正功，电势能减少</text>
    <text x="20" y="210" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="bold" fill="#2563eb">负电荷</tspan>：顺电场线移，电场力做负功，电势能增加</text>
    <text x="20" y="230" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">✦ 做功与势能增减恒定：W_AB = - ΔE_p = E_pA - E_pB</text>
    <text x="20" y="246" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">（不论正负电荷，做正功势能必减少，做负功势能必增加！）</text>
  </g>

  <!-- ==================== 右侧：电势差与能的性质 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 电势定义与电势差绝对性
    </text>

    <!-- 概念定义卡片组 -->
    <g transform="translate(15, 34)">
      <!-- 电势定义 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="330" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">✦ 电势 φ：描述电场能的性质（比值定义法）</text>
        <text x="10" y="40" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">φ = E_p / q  （标量，数值依赖零电势参考点的选择）</text>
      </g>

      <!-- 电势差定义 -->
      <g transform="translate(0, 58)">
        <rect x="0" y="0" width="330" height="58" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="10" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">✦ 电势差 U_AB：空间两点间电势之差</text>
        <text x="10" y="37" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">U_AB = φ_A - φ_B = W_AB / q</text>
        <text x="10" y="52" font-family="system-ui, sans-serif" font-size="9.5" fill="#059669">⚠️ 绝对确定性：与零电势面的选取完全无关！</text>
      </g>

      <!-- 静电力做功万能公式 -->
      <g transform="translate(0, 122)">
        <rect x="0" y="0" width="330" height="98" rx="4" fill="#fef2f2" stroke="#fecaca"/>
        <text x="10" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">✦ 静电力做功三大万能等价列式：</text>
        <text x="15" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">W_AB = q · U_AB = q (φ_A - φ_B)</text>
        <text x="15" y="58" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 代入公式时，q 与 U_AB 均必须带正负号参与计算！</text>
        <text x="15" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">• 若 W &gt; 0 则电场力做正功；若 W &lt; 0 则克服电场力做功</text>
        <text x="15" y="91" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">• 静电力做功与重力相同，亦为保守力，与路径无关！</text>
      </g>
    </g>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    电场能口诀：顺着场强电势降，做功看两头与路径无干；正顺降负顺增，做正功势能必缩减！
  </text>
</svg>
