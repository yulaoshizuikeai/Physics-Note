<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="380">
  <defs>
    <marker id="f-arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">等量异种电荷 vs 等量同种电荷 电场线与等势面拓扑结构</text>

  <!-- Left: Equal Opposite Charges (+Q and -Q) -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="300" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="150" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">等量异种电荷 (+Q 与 -Q)</text>

    <!-- Charges -->
    <circle cx="70" cy="130" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">+</text>
    
    <circle cx="230" cy="130" r="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="230" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">-</text>

    <!-- Field line connecting them -->
    <line x1="84" y1="130" x2="216" y2="130" stroke="#dc2626" stroke-width="2" marker-end="url(#f-arr-b)"/>
    <path d="M 70 116 Q 150 70 230 116" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 70 144 Q 150 190 230 144" fill="none" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Equipotential line: Perpendicular bisector is a straight plane! -->
    <line x1="150" y1="40" x2="150" y2="220" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="150" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">中垂线为零势能等势线 (φ=0)</text>

    <text x="150" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">连线上中心场强最小；中垂线上中心场强最大</text>
  </g>

  <!-- Right: Equal Same Charges (+Q and +Q) -->
  <g transform="translate(400, 45)">
    <rect x="0" y="0" width="300" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="150" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">等量同种电荷 (+Q 与 +Q)</text>

    <!-- Charges -->
    <circle cx="70" cy="130" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">+</text>

    <circle cx="230" cy="130" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="230" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">+</text>

    <!-- Repelling field lines -->
    <path d="M 84 125 Q 120 110 135 50" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 84 135 Q 120 150 135 210" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 216 125 Q 180 110 165 50" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 216 135 Q 180 150 165 210" fill="none" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Center point O -->
    <circle cx="150" cy="130" r="4" fill="#0f172a"/>
    <text x="150" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">O点 (E=0)</text>

    <line x1="150" y1="40" x2="150" y2="220" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="150" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">中垂线并非等势面！</text>
    <text x="150" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">连线中心电势最低；中垂线从中心向两端电势降低</text>
  </g>

  <!-- Bottom rule -->
  <rect x="50" y="325" width="660" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="65" y="349" font-family="system-ui, sans-serif" font-size="12.5" fill="#1e40af">电场线与等势面核心定理：① 电场线处处与等势面正交；② 电场线永远指向电势降低最快的方向。</text>
</svg>