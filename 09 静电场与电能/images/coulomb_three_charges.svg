<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="360">
  <defs>
    <marker id="q-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="r-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">三点电荷同一直线平衡口诀与力学模型 (“两同夹一异、两大夹一小、近小远大”)</text>

  <!-- Baseline -->
  <line x1="60" y1="180" x2="700" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Charge A (Positive, Large) -->
  <g transform="translate(140, 180)">
    <circle cx="0" cy="0" r="28" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#dc2626">+Q_A</text>
    <text x="0" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">点电荷 A (正)</text>
    <text x="0" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">电荷量大</text>
  </g>

  <!-- Charge C (Negative, Small, in middle closer to B) -->
  <g transform="translate(440, 180)">
    <circle cx="0" cy="0" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">-q_C</text>
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">点电荷 C (负)</text>
    <text x="0" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">电荷量最小</text>
  </g>

  <!-- Charge B (Positive, Medium) -->
  <g transform="translate(620, 180)">
    <circle cx="0" cy="0" r="24" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="bold" fill="#dc2626">+Q_B</text>
    <text x="0" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">点电荷 B (正)</text>
    <text x="0" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Q_A &gt; Q_B</text>
  </g>

  <!-- Distances r1 and r2 -->
  <line x1="140" y1="120" x2="440" y2="120" stroke="#475569" stroke-width="1.5"/>
  <text x="290" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569">距离 r_AC (远大)</text>

  <line x1="440" y1="120" x2="620" y2="120" stroke="#475569" stroke-width="1.5"/>
  <text x="530" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569">距离 r_CB (近小)</text>

  <!-- Rule Box -->
  <rect x="50" y="270" width="660" height="65" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="65" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">三大平衡铁律：</text>
  <text x="65" y="318" font-family="system-ui, sans-serif" font-size="12.5" fill="#14532d">① 两同夹一异：中间电荷符号必与两端电荷相反； ② 两大夹一小：中间电荷量必须最小； ③ 近小远大：中间电荷必靠近电量较小的一端。</text>
</svg>