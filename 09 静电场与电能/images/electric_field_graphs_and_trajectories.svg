<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 背景底板 -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    静电场微积分图像物理意义与粒子弯曲轨迹破题判据
  </text>

  <!-- ==================== 左列：微积分图像 (φ-x 与 E-x) ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. φ-x 图像与 E-x 图像微积分互逆对偶
    </text>

    <!-- φ-x 坐标系 -->
    <g transform="translate(25, 35)">
      <!-- 坐标轴 -->
      <line x1="15" y1="75" x2="310" y2="75" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b)"/>
      <line x1="25" y1="80" x2="25" y2="5" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b)"/>
      <text x="315" y="79" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">x</text>
      <text x="15" y="10" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">φ</text>

      <!-- φ 曲线 (先平后陡然后极小值) -->
      <path d="M 25,20 C 70,22 100,55 150,65 C 190,72 230,35 285,45" fill="none" stroke="#2563eb" stroke-width="2.5"/>

      <!-- 切线 1：陡峭处 -->
      <line x1="80" y1="20" x2="135" y2="75" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="107" cy="48" r="3" fill="#dc2626"/>
      <text x="85" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">斜率陡 ⇒ 场强 E 大</text>

      <!-- 切线 2：极值点 (平缓处斜率为零) -->
      <line x1="140" y1="68" x2="185" y2="68" stroke="#059669" stroke-width="1.8"/>
      <circle cx="163" cy="68" r="3" fill="#059669"/>
      <text x="170" y="83" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669">斜率=0 ⇒ E=0</text>
    </g>

    <!-- E-x 坐标系与面积积分 -->
    <g transform="translate(25, 130)">
      <line x1="15" y1="65" x2="310" y2="65" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b)"/>
      <line x1="25" y1="75" x2="25" y2="10" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b)"/>
      <text x="315" y="69" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">x</text>
      <text x="15" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">E</text>

      <!-- 积分面积填充阴影 -->
      <path d="M 60,65 L 60,25 C 100,20 140,45 170,65 Z" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <text x="110" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">面积 = U₁₂</text>

      <!-- E(x) 曲线 -->
      <path d="M 25,35 C 50,25 90,20 170,65 C 210,88 250,75 290,65" fill="none" stroke="#dc2626" stroke-width="2.2"/>
      <text x="50" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">x₁</text>
      <text x="165" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">x₂</text>
    </g>

    <!-- 底部结论总结卡片 -->
    <rect x="10" y="215" width="340" height="45" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="232" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">
      • φ-x 曲线切线斜率：|k_切| = |dφ/dx| = E（极值点 E = 0）
    </text>
    <text x="18" y="249" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">
      • E-x 曲线包围面积：U₁₂ = ∫ E(x)dx = Area(E-x)
    </text>
  </g>

  <!-- ==================== 右列：粒子弯曲轨迹判据 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 带电粒子弯曲轨迹破题标准四步走
    </text>

    <!-- 轨迹图解区 -->
    <g transform="translate(20, 32)">
      <!-- 电场线 (背景虚线带箭头，向右) -->
      <line x1="10" y1="25" x2="310" y2="25" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
      <line x1="10" y1="65" x2="310" y2="65" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
      <line x1="10" y1="105" x2="310" y2="105" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
      <text x="315" y="69" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748b">E</text>

      <!-- 粒子弯曲轨迹 (从左下向右上弯曲，内凹向右) -->
      <path d="M 30,115 C 90,85 140,55 250,30" fill="none" stroke="#2563eb" stroke-width="3"/>
      <text x="25" y="130" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb">运动轨迹</text>

      <!-- 质点 P 位置 (130, 68) -->
      <circle cx="130" cy="68" r="5.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
      <text x="120" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">+q</text>

      <!-- 瞬时速度 v (沿轨迹切线方向) -->
      <line x1="130" y1="68" x2="190" y2="46" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-g)"/>
      <text x="195" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">v</text>

      <!-- 静电力 F (指向轨迹内凹侧，向右偏) -->
      <line x1="130" y1="68" x2="205" y2="78" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-rd)"/>
      <text x="210" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">F_电</text>

      <!-- 夹角标注: 锐角做正功 -->
      <path d="M 155,59 A 30,30 0 0,1 160,72" fill="none" stroke="#ea580c" stroke-width="1.5"/>
      <text x="165" y="65" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ea580c">锐角 θ</text>
    </g>

    <!-- 四步口诀梳理卡片 -->
    <rect x="10" y="162" width="340" height="98" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="180" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
      <tspan font-weight="bold" fill="#b91c1c">Step 1 定受力指向</tspan>：合外力 F_电 严格指向轨迹<tspan font-weight="bold" fill="#dc2626">内凹侧</tspan>
    </text>
    <text x="18" y="200" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
      <tspan font-weight="bold" fill="#1d4ed8">Step 2 定电荷正负</tspan>：F 与 E 同向 ⇒ 正电荷；反向 ⇒ 负电荷
    </text>
    <text x="18" y="220" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
      <tspan font-weight="bold" fill="#15803d">Step 3 定做功能量</tspan>：F 与 v 夹锐角做正功（E_k 增加，E_p 减少）
    </text>
    <text x="18" y="240" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
      <tspan font-weight="bold" fill="#d97706">Step 4 定加速度值</tspan>：电场线密集处 E 大 ⇒ 加速度 a = qE/m 大
    </text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    电场图像与轨迹黄金口诀：斜率表场强，面积表电势差；曲线向凹折，电场做功正负看速度夹角！
  </text>
</svg>
