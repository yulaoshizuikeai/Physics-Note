<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="360">
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">平行板电容器两大动态分析范式 (C = ε_r S / 4πkd)</text>

  <!-- Case 1: Voltage constant (Connected to battery) -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">类型一：始终与电源相连 (电压 U 恒定)</text>

    <!-- Plates -->
    <rect x="50" y="60" width="12" height="100" fill="#dc2626" rx="2"/>
    <rect x="130" y="60" width="12" height="100" fill="#2563eb" rx="2"/>
    <text x="56" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#dc2626">+Q</text>
    <text x="136" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">-Q</text>

    <!-- Battery -->
    <path d="M 56 160 L 56 190 L 85 190 M 105 190 L 136 190 L 136 160" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="85" y1="180" x2="85" y2="200" stroke="#dc2626" stroke-width="3"/>
    <line x1="105" y1="183" x2="105" y2="197" stroke="#2563eb" stroke-width="2"/>
    <text x="95" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">U 恒定</text>

    <!-- Rules -->
    <text x="170" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#334155">① d 增大 ──> C 减小</text>
    <text x="170" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#334155">② Q = C·U ──> Q 减小</text>
    <text x="170" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">③ E = U/d ──> E 减小</text>
  </g>

  <!-- Case 2: Charge constant (Disconnected from battery) -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">类型二：充电后断开电源 (电量 Q 恒定)</text>

    <!-- Plates -->
    <rect x="50" y="60" width="12" height="100" fill="#dc2626" rx="2"/>
    <rect x="130" y="60" width="12" height="100" fill="#2563eb" rx="2"/>
    <text x="56" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#dc2626">+Q (定值)</text>
    <text x="136" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">-Q (定值)</text>

    <!-- Cut wires -->
    <line x1="56" y1="160" x2="56" y2="190" stroke="#475569" stroke-width="2"/>
    <line x1="136" y1="160" x2="136" y2="190" stroke="#475569" stroke-width="2"/>
    <text x="96" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">开关断开 Q 恒定</text>

    <!-- Rules -->
    <text x="170" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#334155">① d 增大 ──> C 减小</text>
    <text x="170" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#334155">② U = Q/C ──> U 增大</text>
    <text x="170" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">③ E = 4πkQ / εr S 恒定！</text>
  </g>

  <rect x="60" y="310" width="640" height="35" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="75" y="333" font-family="system-ui, sans-serif" font-size="12.5" fill="#b91c1c">黄金结论：电量 Q 恒定时，仅改变极板间距 d，板间场强 E 恒定不变！油滴所受电场力不变！</text>
</svg>