<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>

  <!-- 作用点 O -->
  <circle cx="100" cy="180" r="7" fill="#1e293b"/>
  <text x="80" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">O</text>

  <!-- 分力 F1 -->
  <line x1="100" y1="180" x2="320" y2="180" stroke="#2563eb" stroke-width="4" marker-end="url(#arr-b)"/>
  <text x="210" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">分力 F₁</text>

  <!-- 分力 F2 -->
  <line x1="100" y1="180" x2="220" y2="70" stroke="#2563eb" stroke-width="4" marker-end="url(#arr-b)"/>
  <text x="130" y="115" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">分力 F₂</text>

  <!-- 虚线边 -->
  <line x1="320" y1="180" x2="440" y2="70" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="2"/>
  <line x1="220" y1="70" x2="440" y2="70" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="2"/>

  <!-- 合力对角线 F -->
  <line x1="100" y1="180" x2="432" y2="73" stroke="#dc2626" stroke-width="5" marker-end="url(#arr-r)"/>
  <text x="260" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">合力 F (对角线)</text>

  <!-- 说明框 -->
  <rect x="360" y="140" width="220" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="375" y="165" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">平行四边形定则：</text>
  <text x="375" y="185" font-family="sans-serif" font-size="12" fill="#475569">以共点分力为邻边作平行四边形，</text>
  <text x="375" y="202" font-family="sans-serif" font-size="12" fill="#475569">对角线即代表合力的大小和方向。</text>
</svg>