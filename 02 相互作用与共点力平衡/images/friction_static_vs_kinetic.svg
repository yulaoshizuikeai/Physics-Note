<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>
  <!-- 坐标轴 -->
  <line x1="70" y1="200" x2="550" y2="200" stroke="#475569" stroke-width="2"/>
  <text x="525" y="225" font-family="sans-serif" font-size="14" fill="#334155">拉力 F</text>
  <line x1="70" y1="200" x2="70" y2="40" stroke="#475569" stroke-width="2"/>
  <text x="35" y="55" font-family="sans-serif" font-size="14" fill="#334155">摩擦力 f</text>

  <!-- 静摩擦阶段 (45度斜线) -->
  <line x1="70" y1="200" x2="260" y2="80" stroke="#2563eb" stroke-width="3.5"/>
  <text x="110" y="130" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">静摩擦阶段 (f = F)</text>

  <!-- 最大静摩擦点突变 -->
  <circle cx="260" cy="80" r="6" fill="#ef4444"/>
  <text x="210" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">最大静摩擦力 f_max</text>
  <line x1="260" y1="80" x2="280" y2="95" stroke="#dc2626" stroke-width="2"/>

  <!-- 滑动摩擦阶段 (水平线) -->
  <line x1="280" y1="95" x2="520" y2="95" stroke="#16a34a" stroke-width="3.5"/>
  <text x="340" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">滑动摩擦力阶段 (f = μ F_N)</text>

  <!-- 虚线与标注 -->
  <line x1="70" y1="95" x2="280" y2="95" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="25" y="100" font-family="sans-serif" font-size="12" fill="#15803d">f_滑</text>

  <!-- 总结框 -->
  <rect x="300" y="135" width="260" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="315" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">重要特征：</text>
  <text x="315" y="175" font-family="sans-serif" font-size="12" fill="#475569">f_max 略大于 f_滑，通常高中计算近似 f_max ≈ f_滑</text>
</svg>