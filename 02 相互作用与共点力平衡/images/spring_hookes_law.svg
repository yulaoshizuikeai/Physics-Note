<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>
  <!-- 天花板 -->
  <line x1="40" y1="40" x2="260" y2="40" stroke="#334155" stroke-width="4"/>
  <line x1="40" y1="40" x2="30" y2="30" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="40" x2="70" y2="30" stroke="#64748b" stroke-width="2"/>
  <line x1="120" y1="40" x2="110" y2="30" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="40" x2="150" y2="30" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="40" x2="190" y2="30" stroke="#64748b" stroke-width="2"/>
  <line x1="240" y1="40" x2="230" y2="30" stroke="#64748b" stroke-width="2"/>

  <!-- 原长弹簧 -->
  <path d="M 90 40 L 90 60 L 105 68 L 75 84 L 105 100 L 75 116 L 105 132 L 90 140 L 90 150" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="90" cy="155" r="5" fill="#2563eb"/>
  <text x="50" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">原长 L₀</text>

  <!-- 拉伸弹簧 -->
  <path d="M 210 40 L 210 60 L 230 75 L 190 100 L 230 125 L 190 150 L 230 175 L 210 190 L 210 200" fill="none" stroke="#dc2626" stroke-width="3"/>
  <!-- 挂钩与砝码 -->
  <rect x="195" y="200" width="30" height="25" rx="4" fill="#64748b"/>
  <text x="200" y="218" font-family="sans-serif" font-size="12" fill="#ffffff">mg</text>

  <!-- 形变量 Δx 标注 -->
  <line x1="110" y1="155" x2="185" y2="155" stroke="#64748b" stroke-dasharray="3 3"/>
  <line x1="110" y1="200" x2="185" y2="200" stroke="#64748b" stroke-dasharray="3 3"/>
  <line x1="150" y1="155" x2="150" y2="200" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">形变量 x</text>

  <!-- 右侧 F-x 图像 -->
  <line x1="330" y1="200" x2="560" y2="200" stroke="#475569" stroke-width="2"/>
  <text x="545" y="220" font-family="sans-serif" font-size="13" fill="#334155">形变量 x</text>
  <line x1="330" y1="200" x2="330" y2="50" stroke="#475569" stroke-width="2"/>
  <text x="310" y="60" font-family="sans-serif" font-size="13" fill="#334155">弹力 F</text>
  <!-- 斜线 -->
  <line x1="330" y1="200" x2="520" y2="70" stroke="#2563eb" stroke-width="3.5"/>
  <text x="440" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">斜率 k = F / x</text>

  <!-- 公式框 -->
  <rect x="350" y="10" width="220" height="35" rx="6" fill="#1e293b"/>
  <text x="370" y="33" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">胡克定律：F = k·x</text>
</svg>