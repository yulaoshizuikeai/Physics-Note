<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">爱因斯坦光电效应方程与 E_km - ν 特征图线</text>

  <!-- 左侧：Ekm - ν 坐标图 -->
  <g transform="translate(30, 48)">
    <rect width="335" height="215" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="167" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">光电子最大初动能 E_km - ν 图像</text>

    <!-- 坐标轴 -->
    <line x1="35" y1="130" x2="315" y2="130" stroke="#64748b" stroke-width="1.5"/>
    <text x="315" y="145" fill="#94a3b8" font-size="11">ν</text>
    <line x1="70" y1="205" x2="70" y2="35" stroke="#64748b" stroke-width="1.5"/>
    <text x="45" y="42" fill="#94a3b8" font-size="11">E_km</text>

    <!-- 直线 Ekm = hν - W0 -->
    <line x1="70" y1="180" x2="270" y2="55" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="70" y1="180" x2="130" y2="130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>

    <circle cx="130" cy="130" r="4" fill="#4ade80"/>
    <text x="130" y="148" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">ν₀ (极限频率)</text>

    <circle cx="70" y="180" r="4" fill="#f43f5e"/>
    <text x="35" y="183" fill="#f43f5e" font-size="11" font-weight="bold">-W₀</text>

    <text x="210" y="70" fill="#38bdf8" font-size="12" font-weight="bold">斜率 k = h (普朗克常量)</text>
  </g>

  <!-- 右侧：核心物理规律 -->
  <g transform="translate(395, 48)">
    <rect width="335" height="215" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="167" y="24" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">光电效应核心公式与四大铁律</text>

    <rect x="15" y="38" width="305" height="52" rx="5" fill="#0f172a"/>
    <text x="25" y="58" fill="#4ade80" font-size="13" font-weight="bold">光电效应方程：E_km = hν - W₀ = e · U_c</text>
    <text x="25" y="76" fill="#cbd5e1" font-size="11">逸出功 W₀ = h · ν₀（由金属自身材质唯一决定）</text>

    <rect x="15" y="98" width="305" height="100" rx="5" fill="#0f172a"/>
    <text x="25" y="118" fill="#fbbf24" font-size="11.5">• 瞬时性：光电效应发生时间不超过 10⁻⁹ s！</text>
    <text x="25" y="138" fill="#38bdf8" font-size="11.5">• 极限频率：只有入射光频率 ν ≥ ν₀ 才能发生！</text>
    <text x="25" y="158" fill="#f472b6" font-size="11.5">• 遏止电压：e·U_c = E_km，U_c 只由光频率决定！</text>
    <text x="25" y="178" fill="#cbd5e1" font-size="11.5">• 饱和电流：饱和电流强度与<tspan fill="#fbbf24" font-weight="bold">入射光强</tspan>严格成正比！</text>
  </g>
</svg>