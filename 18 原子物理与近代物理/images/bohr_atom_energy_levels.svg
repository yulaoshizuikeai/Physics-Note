<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">玻尔氢原子定态轨道量子化与能级跃迁光子辐射矩阵</text>

  <!-- 左侧：氢原子能级线 -->
  <g transform="translate(30, 48)">
    <rect width="360" height="215" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">氢原子能级图 (E_n = E₁ / n²)</text>

    <!-- 能级线 -->
    <!-- n=inf -->
    <line x1="50" y1="45" x2="310" y2="45" stroke="#94a3b8" stroke-width="1"/>
    <text x="320" y="48" fill="#94a3b8" font-size="10">n=∞</text><text x="20" y="48" fill="#94a3b8" font-size="10">0 eV</text>
    <!-- n=4 -->
    <line x1="50" y1="65" x2="310" y2="65" stroke="#64748b" stroke-width="1.2"/>
    <text x="320" y="68" fill="#cbd5e1" font-size="10">n=4</text><text x="10" y="68" fill="#cbd5e1" font-size="10">-0.85 eV</text>
    <!-- n=3 -->
    <line x1="50" y1="85" x2="310" y2="85" stroke="#64748b" stroke-width="1.5"/>
    <text x="320" y="88" fill="#cbd5e1" font-size="10">n=3</text><text x="10" y="88" fill="#cbd5e1" font-size="10">-1.51 eV</text>
    <!-- n=2 -->
    <line x1="50" y1="120" x2="310" y2="120" stroke="#38bdf8" stroke-width="2"/>
    <text x="320" y="123" fill="#38bdf8" font-size="10" font-weight="bold">n=2</text><text x="10" y="123" fill="#38bdf8" font-size="10">-3.40 eV</text>
    <!-- n=1 (基态) -->
    <line x1="50" y1="185" x2="310" y2="185" stroke="#4ade80" stroke-width="3"/>
    <text x="320" y="188" fill="#4ade80" font-size="11" font-weight="bold">n=1 (基态)</text><text x="0" y="188" fill="#4ade80" font-size="10">-13.6 eV</text>

    <!-- 跃迁箭头 (巴耳末系与赖曼系) -->
    <line x1="120" y1="65" x2="120" y2="185" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="160" y1="85" x2="160" y2="185" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="200" y1="120" x2="200" y2="185" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="160" y="208" fill="#f43f5e" font-size="10" text-anchor="middle">赖曼系 (紫外)</text>

    <line x1="240" y1="65" x2="240" y2="120" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="270" y1="85" x2="270" y2="120" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="255" y="140" fill="#fbbf24" font-size="10" text-anchor="middle">巴耳末 (可见光)</text>
  </g>

  <!-- 右侧：量子化公式 -->
  <g transform="translate(410, 48)">
    <rect width="320" height="215" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="160" y="24" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">量子化假设与光子跃迁法则</text>

    <rect x="15" y="38" width="290" height="42" rx="5" fill="#0f172a"/>
    <text x="25" y="58" fill="#38bdf8" font-size="12" font-weight="bold">轨道半径：r_n = n² · r₁   (r₁ = 0.53 Å)</text>
    <text x="25" y="74" fill="#cbd5e1" font-size="10.5">能量量子化：E_n = E₁ / n²  (E₁ = -13.6 eV)</text>

    <rect x="15" y="88" width="290" height="42" rx="5" fill="#0f172a"/>
    <text x="25" y="108" fill="#4ade80" font-size="12" font-weight="bold">光子辐射条件：hν = |E_m - E_n|</text>
    <text x="25" y="124" fill="#cbd5e1" font-size="10.5">高能级跳到低能级辐射光子；低到高吸收光子</text>

    <rect x="15" y="138" width="290" height="48" rx="5" fill="#0f172a"/>
    <text x="25" y="158" fill="#fbbf24" font-size="12" font-weight="bold">群体跃迁光谱线条数：N = C_n²</text>
    <text x="25" y="174" fill="#f8fafc" font-size="13" font-weight="bold">N = n(n - 1) / 2   (如 n=4 ⇒ N=6 条)</text>
  </g>
</svg>