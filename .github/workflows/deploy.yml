name: Deploy and Build PDF

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        run: npm run docs:build

      - name: Install CJK fonts & PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra poppler-utils ghostscript zip
          sudo fc-cache -fv

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Export PDFs
        run: |
          node scripts/export-pdf.js --concurrency 6

      - name: Package PDFs (Merge Complete Book & Zip)
        run: |
          node scripts/package-pdf.js

      - name: Create or Update GitHub Release with PDFs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest-pdf
          name: "Latest Physics Note PDF (高中物理知识库最新版)"
          body: |
            ## 📚 高中物理知识库 - 自动化编译 PDF 成果物

            - 📕 **单文件完整版全书**: `Physics-Note-Complete.pdf` (包含全书 19 个大专题、78 幅矢量图解与全部考点模型)
            - 📦 **全套分册 ZIP 归档包**: `Physics-Note-All-PDFs.zip` (包含按章节排版归档的 99 篇独立矢量 PDF)
            - ⏱️ **编译时间**: ${{ github.event.head_commit.timestamp || 'Latest' }}
            - 🔗 **对应 Commit**: `${{ github.sha }}`
          draft: false
          prerelease: false
          files: |
            pdf-repo/Physics-Note-Complete.pdf
            pdf-repo/Physics-Note-All-PDFs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 可选：Cloudflare Pages 边缘加速（大陆提速主项）
  # 生效条件：仓库 Secrets 配好 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID 后自动直发，
  # 未配置时自动跳过，不影响现有 GitHub Pages 链路（回滚兜底）。
  # 首次使用需在 Cloudflare Dashboard 建 Pages 项目（构建命令 npm run docs:build，输出 .vitepress/dist），
  # 并把 physics.yunet.cfd 的 DNS 切到 Pages 域名；public/_headers 会自动生效（长缓存 assets + HTML 回源）。
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        run: npm run docs:build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vitepress/dist --project-name=physics-note --commit-dirty=true
