<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-n2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r-n2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    牛顿第二定律瞬时性分析（轻绳突变 vs 弹簧滞后）与力学单位制
  </text>

  <!-- ==================== 左侧：瞬时性突变对比 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="460" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="460" height="26" rx="6" fill="#eff6ff"/>
    <text x="230" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 剪断细绳瞬间：绳拉力突变 vs 弹簧弹力不突变
    </text>

    <!-- 子对比 1: 绳-绳模型 (两段细绳) -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="200" height="155" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="100" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">
        情境 A：绳 + 绳 系统
      </text>

      <!-- 天花板 -->
      <line x1="60" y1="28" x2="140" y2="28" stroke="#334155" stroke-width="2"/>
      <!-- 上绳剪断标记 (红色剪刀叉) -->
      <line x1="100" y1="28" x2="100" y2="50" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="110" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">✂ 剪断</text>

      <!-- 球 A -->
      <circle cx="100" cy="62" r="10" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
      <text x="100" y="66" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">A</text>

      <!-- 下绳 -->
      <line x1="100" y1="72" x2="100" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="110" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626">拉力突变为0</text>

      <!-- 球 B -->
      <circle cx="100" cy="110" r="10" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
      <text x="100" y="114" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">B</text>

      <!-- 加速度标注 -->
      <text x="100" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">
        a_A = g ↓ ， a_B = g ↓
      </text>
      <text x="100" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">
        轻绳无形变累积，拉力瞬间消失
      </text>
    </g>

    <!-- 子对比 2: 绳-弹簧模型 -->
    <g transform="translate(240, 36)">
      <rect x="0" y="0" width="200" height="155" rx="5" fill="#fef2f2" stroke="#fecaca"/>
      <text x="100" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">
        情境 B：绳 + 弹簧 系统
      </text>

      <!-- 天花板 -->
      <line x1="60" y1="28" x2="140" y2="28" stroke="#334155" stroke-width="2"/>
      <line x1="100" y1="28" x2="100" y2="50" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="110" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">✂ 剪断</text>

      <!-- 球 A -->
      <circle cx="100" cy="62" r="10" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="100" y="66" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9a3412" text-anchor="middle">A</text>

      <!-- 中间轻弹簧 (形变来不及突变) -->
      <path d="M 100,72 L 100,76 L 94,80 L 106,84 L 94,88 L 106,92 L 100,96 L 100,100" fill="none" stroke="#ea580c" stroke-width="1.8"/>
      <text x="115" y="90" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ea580c">弹力保持 mg</text>

      <!-- 球 B -->
      <circle cx="100" cy="110" r="10" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="100" y="114" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9a3412" text-anchor="middle">B</text>

      <!-- 加速度标注 -->
      <text x="100" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
        a_A = 2g ↓ ， a_B = 0 ！
      </text>
      <text x="100" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">
        弹簧形变量不能瞬间突变！
      </text>
    </g>

    <!-- 底部总结便签 -->
    <rect x="15" y="202" width="430" height="55" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="222" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">
      ✦ 动力学瞬时对应公理：a = F_合 / m，合外力决定瞬时加速度
    </text>
    <text x="25" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#334155">
      轻绳、接触面弹力可发生<tspan font-weight="bold" fill="#dc2626">突变</tspan>；弹簧、橡皮筋形变需时间恢复，弹力<tspan font-weight="bold" fill="#059669">不能突变</tspan>！
    </text>
  </g>

  <!-- ==================== 右侧：力学单位制与量纲 ==================== -->
  <g transform="translate(500, 54)">
    <rect x="0" y="0" width="260" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="260" height="26" rx="6" fill="#f0fdf4"/>
    <text x="130" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">
      2. 国际力学单位制与量纲推导
    </text>

    <!-- 基本单位 -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="230" height="65" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#166534">三大力学基本物理量与基本单位：</text>
      <text x="10" y="36" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">• 长度：米（m）</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">• 质量：千克（kg）  |  时间：秒（s）</text>
    </g>

    <!-- 导出单位链条 -->
    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="230" height="145" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">常用力学导出量纲关系：</text>
      <text x="10" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#334155">✦ 力：F = ma</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#dc2626">1 N = 1 kg·m/s²</text>

      <text x="10" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#334155">✦ 功与能量：W = Fs</text>
      <text x="18" y="94" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb">1 J = 1 N·m = 1 kg·m²/s²</text>

      <text x="10" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#334155">✦ 功率：P = W/t</text>
      <text x="18" y="132" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#059669">1 W = 1 J/s = 1 kg·m²/s³</text>
    </g>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    牛二瞬时性真诀：剪绳瞬间绳力归零弹簧留，受力突变加速度立转，量纲检验保推导无偏！
  </text>
</svg>
