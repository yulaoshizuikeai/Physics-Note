<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-nl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r-nl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g-nl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 背景底板 -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    牛顿运动定律两大经典动力学模型（斜面动力学 · 竖直平面等时圆）
  </text>

  <!-- ==================== 左列：斜面动力学正交分解 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 斜面滑块正交分解与加速度对比
    </text>

    <!-- 斜面与滑块几何 (斜角约 30 度) -->
    <g transform="translate(25, 28)">
      <!-- 斜面底座 -->
      <polygon points="10,140 250,30 250,140" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="0" y1="140" x2="260" y2="140" stroke="#334155" stroke-width="2"/>
      <!-- 倾角 θ -->
      <path d="M 50,140 A 40,40 0 0,0 44,124" fill="none" stroke="#d97706" stroke-width="1.5"/>
      <text x="55" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">θ</text>

      <!-- 滑块 m (旋转 -24.6 度放置在斜面上) -->
      <g transform="translate(130, 85) rotate(-24.6)">
        <rect x="-22" y="-18" width="44" height="22" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
        <text x="0" y="-3" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">m</text>
      </g>

      <!-- 质心受力分析点 (130, 80) -->
      <circle cx="130" cy="80" r="3" fill="#1e293b"/>
      <!-- 重力 mg 竖直向下 -->
      <line x1="130" y1="80" x2="130" y2="130" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r-nl)"/>
      <text x="135" y="125" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">mg</text>

      <!-- 支持力 FN (垂直斜面向上偏左) -->
      <line x1="130" y1="80" x2="110" y2="32" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b-nl)"/>
      <text x="95" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">F_N</text>

      <!-- 下滑力分量 mg sin θ -->
      <line x1="130" y1="80" x2="80" y2="103" stroke="#059669" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arr-g-nl)"/>
      <text x="70" y="118" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#059669">mg sin θ</text>
    </g>

    <!-- 下滑/上滑对比卡片 -->
    <rect x="10" y="180" width="340" height="80" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="198" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
      • <tspan font-weight="bold" fill="#059669">下滑加速度</tspan>：a_下 = g(sin θ - μ cos θ)（阻力阻碍下滑）
    </text>
    <text x="18" y="218" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">
      • <tspan font-weight="bold" fill="#dc2626">上滑加速度</tspan>：a_上 = g(sin θ + μ cos θ)（重力与摩擦力共同减速）
    </text>
    <text x="18" y="238" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">
      ✦ 定量结论：a_上 &gt; a_下  ⇒  减速上滑时间 t_上 &lt; 重新滑回时间 t_下
    </text>
    <text x="18" y="253" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">
      临界状态：当 tan θ = μ 时，a_下 = 0（匀速或静止）
    </text>
  </g>

  <!-- ==================== 右列：竖直平面等时圆 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 竖直平面等时圆（Tautochrone Circle）
    </text>

    <!-- 等时圆大圆 (圆心 180, 110, 半径 75) -->
    <circle cx="180" cy="110" r="75" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <!-- 竖直直径 AB (最高点 A: 180, 35; 最低点 B: 180, 185) -->
    <line x1="180" y1="35" x2="180" y2="185" stroke="#334155" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="180" cy="35" r="4" fill="#2563eb"/>
    <circle cx="180" cy="185" r="4" fill="#dc2626"/>
    <text x="180" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">最高点 A</text>
    <text x="180" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">最低点 B</text>

    <!-- 弦 AP (从最高点 A 出发下滑) -->
    <!-- 点 P 设在 (245, 147) -->
    <line x1="180" y1="35" x2="245" y2="147" stroke="#059669" stroke-width="2.5"/>
    <circle cx="245" cy="147" r="3.5" fill="#059669"/>
    <text x="252" y="152" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#059669">P</text>
    <!-- 夹角 α 弧度 -->
    <path d="M 180,65 A 30,30 0 0,0 195,61" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <text x="188" y="73" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309">α</text>

    <!-- 弦 QB (从圆周 Q 点滑向最低点 B) -->
    <!-- 点 Q 设在 (110, 80) -->
    <line x1="110" y1="80" x2="180" y2="185" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="110" cy="80" r="3.5" fill="#7c3aed"/>
    <text x="98" y="80" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#7c3aed">Q</text>

    <!-- 等时证明公式框 -->
    <rect x="10" y="202" width="340" height="58" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="220" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">
      ✦ 弦长几何：L = 2R cos α  |  沿弦加速度：a = g cos α
    </text>
    <text x="18" y="238" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#059669">
      ✦ 时间推导：L = ½ a t²  ⇒  2R cos α = ½(g cos α) t²  ⇒  <tspan font-size="11" fill="#dc2626">t = 2√(R / g)</tspan>
    </text>
    <text x="18" y="252" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">
      角度 cos α 严格相消！最高点出发或滑向最低点各光滑弦下滑时间完全相等！
    </text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    动力学建模纲领：受力分解力而不分加速度；等时圆弦长与加速度按余弦同比例衰减相消，时间恒为 2√(R/g)！
  </text>
</svg>
