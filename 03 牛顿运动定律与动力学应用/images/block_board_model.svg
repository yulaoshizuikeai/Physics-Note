<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <marker id="arr-pull" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>

  <!-- 地面 -->
  <line x1="40" y1="190" x2="560" y2="190" stroke="#334155" stroke-width="3"/>
  <line x1="40" y1="190" x2="30" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="190" x2="70" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="190" x2="110" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="190" x2="150" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="190" x2="190" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="190" x2="230" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="190" x2="270" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="190" x2="310" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="190" x2="350" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="190" x2="390" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="440" y1="190" x2="430" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="190" x2="470" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="520" y1="190" x2="510" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- 长木板 M (黄色) -->
  <rect x="100" y="140" width="360" height="50" rx="4" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
  <text x="120" y="170" font-family="sans-serif" font-size="16" font-weight="bold" fill="#854d0e">长木板 M</text>
  <text x="180" y="215" font-family="sans-serif" font-size="13" fill="#64748b">木板与地面摩擦因数 μ₂</text>

  <!-- 滑块 m (蓝色) -->
  <rect x="140" y="80" width="100" height="60" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="115" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af">滑块 m</text>
  <text x="255" y="115" font-family="sans-serif" font-size="13" fill="#475569">板面摩擦因数 μ₁</text>

  <!-- 外拉力 F 作用在木板上 -->
  <line x1="460" y1="165" x2="540" y2="165" stroke="#2563eb" stroke-width="5" marker-end="url(#arr-pull)"/>
  <text x="500" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">拉力 F</text>

  <!-- 临界判定框 -->
  <rect x="260" y="20" width="310" height="50" rx="6" fill="#1e293b"/>
  <text x="275" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">相对滑动临界加速度：a_临界 = μ₁ g</text>
  <text x="275" y="60" font-family="sans-serif" font-size="12" fill="#94a3b8">F ≤ F_临界：整体一起加速；F &gt; F_临界：发生相对滑动</text>
</svg>