<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <marker id="arr-acc-up" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-acc-down" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>

  <!-- 左侧：超重 (a 向上) -->
  <rect x="30" y="20" width="250" height="200" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="50" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#166534">1. 超重状态 (a 向上 ↑)</text>
  <!-- 电梯人与秤 -->
  <rect x="90" y="170" width="80" height="15" fill="#64748b" rx="2"/>
  <circle cx="130" cy="115" r="14" fill="#3b82f6"/>
  <line x1="130" y1="129" x2="130" y2="170" stroke="#3b82f6" stroke-width="4"/>
  <!-- 加速度箭头 -->
  <line x1="200" y1="160" x2="200" y2="90" stroke="#16a34a" stroke-width="5" marker-end="url(#arr-acc-up)"/>
  <text x="215" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#16a34a">a ↑</text>
  <!-- 视重公式 -->
  <text x="50" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">视重 F_N = m(g + a) &gt; mg</text>

  <!-- 右侧：失重 (a 向下) -->
  <rect x="320" y="20" width="250" height="200" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="340" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#991b1b">2. 失重状态 (a 向下 ↓)</text>
  <!-- 电梯人与秤 -->
  <rect x="380" y="170" width="80" height="15" fill="#64748b" rx="2"/>
  <circle cx="420" cy="115" r="14" fill="#3b82f6"/>
  <line x1="420" y1="129" x2="420" y2="170" stroke="#3b82f6" stroke-width="4"/>
  <!-- 加速度箭头 -->
  <line x1="490" y1="100" x2="490" y2="170" stroke="#dc2626" stroke-width="5" marker-end="url(#arr-acc-down)"/>
  <text x="505" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">a ↓</text>
  <!-- 视重公式 -->
  <text x="335" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">视重 F_N = m(g - a) &lt; mg</text>
</svg>