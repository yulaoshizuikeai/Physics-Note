<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">单摆小角度微积分模型与受迫振动共振曲线</text>

  <!-- 左侧：单摆受力模型 -->
  <g transform="translate(30, 48)">
    <rect width="320" height="215" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="160" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">单摆微小角度模型 (θ ≤ 5°)</text>

    <!-- 悬挂与摆线 -->
    <line x1="120" y1="40" x2="200" y2="40" stroke="#64748b" stroke-width="3"/>
    <line x1="160" y1="40" x2="210" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="210" cy="140" r="10" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <line x1="160" y1="40" x2="160" y2="150" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="175" y="75" fill="#38bdf8" font-size="11">摆长 L</text>
    <text x="170" y="60" fill="#cbd5e1" font-size="10">θ</text>

    <!-- 惠更斯公式框 -->
    <rect x="15" y="155" width="290" height="48" rx="5" fill="#0f172a"/>
    <text x="160" y="176" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">惠更斯周期公式：T = 2π√(L / g)</text>
    <text x="160" y="194" fill="#cbd5e1" font-size="10.5" text-anchor="middle">等时性：周期与振幅 A 及摆球质量 m 完全无关！</text>
  </g>

  <!-- 右侧：受迫振动共振曲线 -->
  <g transform="translate(370, 48)">
    <rect width="360" height="215" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="180" y="24" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">受迫振动与共振 (Resonance) 曲线</text>

    <!-- 坐标轴 -->
    <line x1="40" y1="160" x2="320" y2="160" stroke="#64748b" stroke-width="1.5"/>
    <text x="325" y="165" fill="#94a3b8" font-size="10">f_驱</text>
    <line x1="40" y1="160" x2="40" y2="45" stroke="#64748b" stroke-width="1.5"/>
    <text x="30" y="42" fill="#94a3b8" font-size="10">A</text>

    <!-- 共振峰曲线 -->
    <path d="M 50 155 Q 140 140 170 65 Q 200 140 300 155" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
    <line x1="170" y1="65" x2="170" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="170" y="175" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">f_驱 = f_固 (共振点)</text>
    <text x="170" y="55" fill="#f43f5e" font-size="12" font-weight="bold" text-anchor="middle">A_max</text>

    <text x="180" y="200" fill="#cbd5e1" font-size="11" text-anchor="middle">共振条件：驱动力频率等于系统固有频率时，振幅达到峰值！</text>
  </g>
</svg>