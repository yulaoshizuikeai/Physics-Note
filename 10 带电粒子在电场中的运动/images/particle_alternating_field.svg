<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="360">
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">交变电场中带电粒子运动状态分析 (方波交变电场与 v-t 图像法)</text>

  <!-- Left: E-t square wave -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">极板间方波交变电场 E-t 图</text>

    <!-- Axes -->
    <line x1="30" y1="120" x2="260" y2="120" stroke="#334155" stroke-width="1.5"/>
    <text x="265" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#334155">t</text>
    <line x1="30" y1="190" x2="30" y2="50" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#334155">E</text>

    <!-- Square wave -->
    <line x1="30" y1="80" x2="85" y2="80" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="85" y1="80" x2="85" y2="160" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="85" y1="160" x2="140" y2="160" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="140" y1="160" x2="140" y2="80" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="140" y1="80" x2="195" y2="80" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="195" y1="80" x2="195" y2="160" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="195" y1="160" x2="250" y2="160" stroke="#2563eb" stroke-width="2.5"/>

    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">+E_0</text>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">-E_0</text>
    <text x="85" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">T/2</text>
    <text x="140" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">T</text>
  </g>

  <!-- Right: Corresponding v-t graph -->
  <g transform="translate(410, 55)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">粒子响应速度 v-t 图 (对称往复运动)</text>

    <!-- Axes -->
    <line x1="30" y1="170" x2="260" y2="170" stroke="#334155" stroke-width="1.5"/>
    <text x="265" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#334155">t</text>
    <line x1="30" y1="190" x2="30" y2="50" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#334155">v</text>

    <!-- Triangular velocity wave (accelerate up to T/2, decelerate to T) -->
    <line x1="30" y1="170" x2="85" y2="80" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="85" y1="80" x2="140" y2="170" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="140" y1="170" x2="195" y2="80" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="195" y1="80" x2="250" y2="170" stroke="#dc2626" stroke-width="2.5"/>

    <text x="85" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">v_max</text>
    <text x="85" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">T/2</text>
    <text x="140" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">T</text>
    
    <text x="145" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">速度恒正：单向脉动前进，位移只增不减！</text>
  </g>

  <rect x="50" y="305" width="660" height="40" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="65" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#c2410c">解题杀手锏：利用 v-t 图像分析交变电场！面积即位移，斜率即加速度，转折时刻一目了然。</text>
</svg>