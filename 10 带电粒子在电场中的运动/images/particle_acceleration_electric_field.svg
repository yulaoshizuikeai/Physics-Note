<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-pa" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r-pa" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    带电粒子在电场中的加速模型与多级直线加速器物理机制
  </text>

  <!-- ==================== 左侧：平行板静电加速 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 静电平行板单级加速模型
    </text>

    <!-- 加速极板图解 -->
    <g transform="translate(25, 36)">
      <!-- 正极板 (左) -->
      <rect x="40" y="15" width="8" height="110" rx="2" fill="#ef4444"/>
      <text x="30" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">+</text>

      <!-- 负极板 (右，带中心小孔) -->
      <rect x="220" y="15" width="8" height="45" rx="2" fill="#3b82f6"/>
      <rect x="220" y="80" width="8" height="45" rx="2" fill="#3b82f6"/>
      <text x="235" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">-</text>

      <!-- 板间匀强电场 (向右) -->
      <line x1="55" y1="40" x2="210" y2="40" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arr-b-pa)"/>
      <line x1="55" y1="100" x2="210" y2="100" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arr-b-pa)"/>
      <text x="130" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">匀强电场 E = U/d</text>

      <!-- 粒子轨迹 -->
      <circle cx="55" cy="70" r="6" fill="#f59e0b"/>
      <text x="55" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309">+q, m</text>
      <!-- 加速直线 -->
      <line x1="55" y1="70" x2="260" y2="70" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#arr-r-pa)"/>
      <text x="270" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">射出速度 v</text>
    </g>

    <!-- 方程卡片 -->
    <rect x="12" y="165" width="336" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">✦ 动能定理严格推导：q U = ½ m v² - ½ m v₀²</text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">✦ 射出末速度公式：v = √(2qU / m)  （初速为0）</text>
    <text x="20" y="225" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="bold">普适性法则</tspan>：无论极板间电场是否匀强，qU = ΔE_k 严格成立！</text>
    <text x="20" y="243" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">• 末速度仅由加速电压 U 与比荷 q/m 决定，与板间距无关！</text>
  </g>

  <!-- ==================== 右侧：多级交变直线加速器 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 多级交变直线加速器原理（漂移管）
    </text>

    <!-- 漂移管示意 -->
    <g transform="translate(20, 36)">
      <!-- 离子源 -->
      <circle cx="20" cy="50" r="8" fill="#f59e0b"/>
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">源</text>

      <!-- 漂移管 1 (短) -->
      <rect x="45" y="38" width="40" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="65" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#334155" text-anchor="middle">L₁</text>

      <!-- 漂移管 2 (中) -->
      <rect x="105" y="38" width="60" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="135" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#334155" text-anchor="middle">L₂</text>

      <!-- 漂移管 3 (长) -->
      <rect x="185" y="38" width="85" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <text x="227" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#334155" text-anchor="middle">L₃</text>

      <!-- 加速缝隙电场箭头 -->
      <line x1="86" y1="50" x2="104" y2="50" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r-pa)"/>
      <line x1="166" y1="50" x2="184" y2="50" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r-pa)"/>

      <!-- 粒子穿行动画轨迹 -->
      <line x1="28" y1="50" x2="310" y2="50" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3 3"/>

      <!-- 交变高频电源连接示意 -->
      <path d="M 65,62 L 65,95 L 140,95" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 135,62 L 135,110 L 160,110" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <path d="M 227,62 L 227,95 L 170,95" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="155" cy="100" r="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="155" y="104" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ea580c" text-anchor="middle">~U</text>
    </g>

    <!-- 卡片说明 -->
    <rect x="12" y="165" width="336" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">✦ 等时同步加速物理机制：</text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="bold">管内静电屏蔽</tspan>：管内场强为零，粒子在管内匀速运动</text>
    <text x="20" y="223" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="bold">缝隙交变加速</tspan>：飞过缝隙耗时可忽略，电压刚好翻转半周期 T/2</text>
    <text x="20" y="243" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669">✦ 长度递增比：L_n = v_n · (T/2)  ⇒  L₁ : L₂ : L₃ = 1 : √2 : √3</text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    电场加速口诀：单级末速看比荷与电压，曲折电场总功亦唯 U 是瞻；直线加速漂移管，长度按根号 n 递增！
  </text>
</svg>
