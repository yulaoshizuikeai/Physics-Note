<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="380">
  <defs>
    <marker id="d-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="r-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">带电粒子“加速+偏转”全流程模型 (tanθ = U2·L / 2d·U1)</text>

  <!-- Acceleration stage -->
  <g transform="translate(40, 70)">
    <line x1="20" y1="50" x2="20" y2="190" stroke="#475569" stroke-width="3"/>
    <line x1="80" y1="50" x2="80" y2="190" stroke="#475569" stroke-width="3"/>
    <text x="20" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">-</text>
    <text x="80" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">+</text>
    <text x="50" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">加速电压 U_1</text>

    <!-- Particle accelerated -->
    <circle cx="20" cy="120" r="5" fill="#dc2626"/>
    <line x1="20" y1="120" x2="80" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#r-arr)"/>
    <text x="50" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#dc2626">q, m</text>
  </g>

  <!-- Deflection plates -->
  <g transform="translate(180, 70)">
    <!-- Top plate (+) -->
    <rect x="0" y="30" width="220" height="8" fill="#ef4444" rx="2"/>
    <text x="230" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">+ (U_2)</text>
    <!-- Bottom plate (-) -->
    <rect x="0" y="200" width="220" height="8" fill="#3b82f6" rx="2"/>
    <text x="230" y="208" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">-</text>

    <!-- Plate length L and gap d -->
    <line x1="0" y1="220" x2="220" y2="220" stroke="#64748b" stroke-width="1.5"/>
    <text x="110" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">极板长度 L</text>
    <line x1="-15" y1="30" x2="-15" y2="200" stroke="#64748b" stroke-width="1.5"/>
    <text x="-30" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">间距 d</text>

    <!-- Center axis line -->
    <line x1="-60" y1="120" x2="520" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Parabolic trajectory inside deflection plates: y_offset = 45 at x=220 -->
    <path d="M 0 120 Q 110 120 220 75" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Straight trajectory after leaving plates -->
    <line x1="220" y1="75" x2="480" y2="-22" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Tangent backwards: intersects axis at L/2 = 110 -->
    <line x1="220" y1="75" x2="110" y2="120" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="110" cy="120" r="4" fill="#e11d48"/>
    <text x="110" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#e11d48">L/2 (极板中心)</text>

    <!-- Deflection distance y -->
    <line x1="220" y1="120" x2="220" y2="75" stroke="#16a34a" stroke-width="2"/>
    <text x="210" y="98" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">y</text>
  </g>

  <!-- Screen -->
  <g transform="translate(660, 40)">
    <line x1="0" y1="0" x2="0" y2="260" stroke="#0f172a" stroke-width="4"/>
    <text x="12" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">荧光屏</text>
    <circle cx="0" cy="8" r="5" fill="#16a34a"/>
    <text x="12" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">打点 P</text>
    <!-- Screen total deflection Y -->
    <line x1="-10" y1="150" x2="-10" y2="8" stroke="#16a34a" stroke-width="2"/>
    <text x="-25" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Y</text>
  </g>

  <!-- Bottom Core Theorem -->
  <rect x="40" y="325" width="680" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="55" y="351" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">独立性奇迹：y = U2·L² / (4d·U1)，偏转角 tanθ = U2·L / (2d·U1)，与粒子的比荷 q/m 完全无关！</text>
</svg>