<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">封闭气体压强求解三大力学平衡与 U 形管经典模型</text>

  <!-- 1. 竖直气缸向上 -->
  <g transform="translate(30, 48)">
    <rect width="215" height="215" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="107" y="22" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">竖直向上开口气缸</text>
    <!-- 气缸壁 -->
    <rect x="55" y="45" width="105" height="100" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- 活塞 -->
    <rect x="57" y="70" width="101" height="18" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <text x="107" y="83" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">活塞(m, S)</text>
    <text x="107" y="120" fill="#38bdf8" font-size="11" text-anchor="middle">封闭气体 p</text>
    <!-- 大气压与重力向下 -->
    <text x="107" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">大气压 p₀S ↓</text>
    <!-- 平衡方程 -->
    <rect x="15" y="155" width="185" height="48" rx="4" fill="#0f172a"/>
    <text x="107" y="174" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">pS = p₀S + mg</text>
    <text x="107" y="193" fill="#cbd5e1" font-size="11" text-anchor="middle">p = p₀ + mg / S</text>
  </g>

  <!-- 2. 竖直倒扣开口向下 -->
  <g transform="translate(270, 48)">
    <rect width="220" height="215" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.2"/>
    <text x="110" y="22" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">倒置悬挂气缸 (开口向下)</text>
    <!-- 气缸壁 -->
    <rect x="58" y="45" width="105" height="100" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <!-- 封闭气体在上 -->
    <text x="110" y="75" fill="#4ade80" font-size="11" text-anchor="middle">封闭气体 p</text>
    <!-- 活塞在下 -->
    <rect x="60" y="95" width="101" height="18" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <text x="110" y="108" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">活塞(m, S)</text>
    <text x="110" y="135" fill="#94a3b8" font-size="10" text-anchor="middle">大气压 p₀S ↑</text>
    <!-- 平衡方程 -->
    <rect x="15" y="155" width="190" height="48" rx="4" fill="#0f172a"/>
    <text x="110" y="174" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">pS + mg = p₀S</text>
    <text x="110" y="193" fill="#cbd5e1" font-size="11" text-anchor="middle">p = p₀ - mg / S</text>
  </g>

  <!-- 3. 水银液柱 U 型管 -->
  <g transform="translate(515, 48)">
    <rect width="215" height="215" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
    <text x="107" y="22" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle">液体水银柱等高液面法</text>
    <!-- U型管示意 -->
    <path d="M 60 45 L 60 135 A 25 25 0 0 0 110 135 L 110 45" fill="none" stroke="#64748b" stroke-width="16"/>
    <path d="M 60 45 L 60 135 A 25 25 0 0 0 110 135 L 110 45" fill="none" stroke="#0f172a" stroke-width="10"/>
    <!-- 水银柱差高度 h -->
    <rect x="15" y="155" width="185" height="48" rx="4" fill="#0f172a"/>
    <text x="107" y="174" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">连通器等高液面压强相等：</text>
    <text x="107" y="193" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle">p = p₀ ± ρgh  (或 p₀ ± h cmHg)</text>
  </g>
</svg>