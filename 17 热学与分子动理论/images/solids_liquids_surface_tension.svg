<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-st" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    液体表面张力微观本质与晶体非晶体熔化物理机制
  </text>

  <!-- ==================== 左侧：表面张力微观机制 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 表面张力微观分子力起源
    </text>

    <!-- 液体分子示意 -->
    <g transform="translate(25, 34)">
      <!-- 液体底色 -->
      <rect x="15" y="30" width="280" height="85" fill="#f0f9ff" stroke="#bae6fd"/>
      <!-- 表面层 (粉色阴影) -->
      <rect x="15" y="30" width="280" height="20" fill="#fef2f2" stroke="#fecaca"/>
      <text x="22" y="44" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626">表面层 (r &gt; r₀ 稀疏)</text>
      <text x="22" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#0284c7">内部 (平衡)</text>

      <!-- 表面层分子 (受向内和切向拉力) -->
      <circle cx="150" cy="40" r="6" fill="#ef4444"/>
      <!-- 切向张力箭头 (相互吸引) -->
      <line x1="144" y1="40" x2="115" y2="40" stroke="#dc2626" stroke-width="2"/>
      <line x1="156" y1="40" x2="185" y2="40" stroke="#dc2626" stroke-width="2"/>
      <line x1="150" y1="46" x2="150" y2="65" stroke="#dc2626" stroke-width="2"/>
      <text x="150" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">宏观表现为表面张力</text>

      <!-- 内部水分子 (四周对称吸引，合力为0) -->
      <circle cx="150" cy="85" r="6" fill="#3b82f6"/>
      <line x1="150" y1="79" x2="150" y2="70" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="150" y1="91" x2="150" y2="100" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="144" y1="85" x2="135" y2="85" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="156" y1="85" x2="165" y2="85" stroke="#3b82f6" stroke-width="1.5"/>
    </g>

    <!-- 说明卡片 -->
    <rect x="12" y="150" width="336" height="106" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">✦ 表面张力微观本质：</text>
    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 表面层分子由于蒸发稀疏，分子间距 <tspan font-weight="bold" fill="#dc2626">r &gt; r₀</tspan></text>
    <text x="20" y="208" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 分子间作用力表现为<tspan font-weight="bold" fill="#dc2626">相互吸引力</tspan></text>
    <text x="20" y="226" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 宏观使液体表面收缩，同体积下呈表面积最小的<tspan font-weight="bold">球形</tspan></text>
    <text x="20" y="244" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">毛细现象：附着层浸润液面上升呈凹形；不浸润下降呈凸形</text>
  </g>

  <!-- ==================== 右侧：晶体与非晶体熔化曲线 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 晶体与非晶体熔化温度曲线对比
    </text>

    <!-- T-t 坐标系 -->
    <g transform="translate(30, 36)">
      <line x1="20" y1="95" x2="280" y2="95" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b-st)"/>
      <line x1="30" y1="105" x2="30" y2="15" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b-st)"/>
      <text x="285" y="99" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">时间 t</text>
      <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">温度 T</text>

      <!-- 晶体曲线 (带水平平台 T_m，绿色) -->
      <path d="M 30,85 L 80,50 L 170,50 L 230,20" fill="none" stroke="#059669" stroke-width="2.5"/>
      <text x="125" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#059669" text-anchor="middle">晶体：确定熔点 T_m</text>
      <line x1="30" y1="50" x2="80" y2="50" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669">T_m</text>

      <!-- 非晶体曲线 (单调上升无水平段，橙色) -->
      <path d="M 30,90 Q 120,65 230,35" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="4 3"/>
      <text x="190" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ea580c">非晶体：无固定熔点</text>
    </g>

    <!-- 卡片说明 -->
    <rect x="12" y="150" width="336" height="106" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">✦ 晶体核心标志：</text>
    <text x="20" y="188" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="bold">固定熔点</tspan>：熔化过程吸收热量，内能增加，但温度保持不变</text>
    <text x="20" y="206" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 单晶体具有规则几何外形，物理性质具有<tspan font-weight="bold">各向异性</tspan></text>
    <text x="20" y="226" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ea580c">✦ 非晶体核心标志：</text>
    <text x="20" y="244" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">无固定熔点，加热温度持续上升逐渐软化；物理性质各向同性</text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    热学固液口诀：表面层稀疏引力显，液滴收缩成球形；晶体吸热熔点恒，非晶软化温升不停！
  </text>
</svg>
