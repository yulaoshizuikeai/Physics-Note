<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">理想气体实验三定律与状态参量 p-V, p-T, V-T 图像矩阵</text>

  <!-- 1. p-V 图 (等温线) -->
  <g transform="translate(30, 48)">
    <rect width="215" height="215" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="107" y="22" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">玻意耳定律 (等温 p-V)</text>
    <!-- 坐标轴 -->
    <line x1="30" y1="180" x2="195" y2="180" stroke="#64748b" stroke-width="1"/><text x="195" y="195" fill="#94a3b8" font-size="10">V</text>
    <line x1="30" y1="180" x2="30" y2="35" stroke="#64748b" stroke-width="1"/><text x="20" y="35" fill="#94a3b8" font-size="10">p</text>
    <!-- 双曲线 -->
    <path d="M 45 60 Q 65 140 180 165" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <text x="140" y="110" fill="#38bdf8" font-size="11">T₁ 恒定</text>
    <path d="M 65 45 Q 95 110 190 145" fill="none" stroke="#fb923c" stroke-width="2.2"/>
    <text x="175" y="90" fill="#fb923c" font-size="11">T₂ &gt; T₁</text>
    <text x="107" y="202" fill="#cbd5e1" font-size="11" text-anchor="middle">p · V = C (双曲线)</text>
  </g>

  <!-- 2. p-T 图 (等容线) -->
  <g transform="translate(270, 48)">
    <rect width="220" height="215" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.2"/>
    <text x="110" y="22" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">查理定律 (等容 p-T)</text>
    <!-- 坐标轴 -->
    <line x1="30" y1="180" x2="200" y2="180" stroke="#64748b" stroke-width="1"/><text x="200" y="195" fill="#94a3b8" font-size="10">T(K)</text>
    <line x1="30" y1="180" x2="30" y2="35" stroke="#64748b" stroke-width="1"/><text x="20" y="35" fill="#94a3b8" font-size="10">p</text>
    <!-- 射线过原点 -->
    <line x1="30" y1="180" x2="190" y2="60" stroke="#4ade80" stroke-width="2.2"/>
    <text x="135" y="95" fill="#4ade80" font-size="11">V₁ 恒定</text>
    <line x1="30" y1="180" x2="190" y2="100" stroke="#fbbf24" stroke-width="2.2"/>
    <text x="155" y="125" fill="#fbbf24" font-size="11">V₂ &gt; V₁</text>
    <text x="110" y="202" fill="#cbd5e1" font-size="11" text-anchor="middle">p / T = C (斜率越大 V 越小)</text>
  </g>

  <!-- 3. V-T 图 (等压线) -->
  <g transform="translate(515, 48)">
    <rect width="215" height="215" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
    <text x="107" y="22" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle">盖-吕萨克定律 (等压 V-T)</text>
    <!-- 坐标轴 -->
    <line x1="30" y1="180" x2="195" y2="180" stroke="#64748b" stroke-width="1"/><text x="195" y="195" fill="#94a3b8" font-size="10">T(K)</text>
    <line x1="30" y1="180" x2="30" y2="35" stroke="#64748b" stroke-width="1"/><text x="20" y="35" fill="#94a3b8" font-size="10">V</text>
    <!-- 射线过原点 -->
    <line x1="30" y1="180" x2="185" y2="60" stroke="#f472b6" stroke-width="2.2"/>
    <text x="135" y="95" fill="#f472b6" font-size="11">p₁ 恒定</text>
    <line x1="30" y1="180" x2="185" y2="100" stroke="#38bdf8" stroke-width="2.2"/>
    <text x="155" y="125" fill="#38bdf8" font-size="11">p₂ &gt; p₁</text>
    <text x="107" y="202" fill="#cbd5e1" font-size="11" text-anchor="middle">V / T = C (斜率越大 p 越小)</text>
  </g>
</svg>