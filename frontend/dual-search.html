<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库双轨检索与流式 AI 问答</title>
  <!-- KaTeX 数学公式渲染引擎 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <style>
    :root {
      --bg: #FAF9F5;
      --card-bg: #FFFFFF;
      --card-bg-soft: #F3F1EC;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover-border: #4C67B9;
      --text-main: #1F2328;
      --text-muted: #57606A;
      --text-faint: #6E7781;
      --accent-blue: #4C67B9;
      --accent-blue-soft: rgba(76, 103, 185, 0.1);
      --accent-purple: #7C3AED;
      --accent-green: #10B981;
      --accent-amber: #C27803;
      --accent-red: #B9423B;
      --input-bg: #F3F1EC;
      --shadow-lg: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151718;
        --card-bg: #1C1F21;
        --card-bg-soft: #23272A;
        --card-border: rgba(255, 255, 255, 0.09);
        --card-hover-border: #758EE6;
        --text-main: #E3E5E8;
        --text-muted: #9BA1A6;
        --text-faint: #687076;
        --accent-blue: #758EE6;
        --accent-blue-soft: rgba(117, 142, 230, 0.16);
        --input-bg: #1C1F21;
        --shadow-lg: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 36px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* 头部 */
    header {
      text-align: center;
      margin-bottom: 4px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-blue);
      background: var(--accent-blue-soft);
      border: 1px solid color-mix(in srgb, var(--accent-blue) 30%, transparent);
      padding: 3px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
      font-family: ui-monospace, monospace;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* 设置与端点配置 */
    .config-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px 16px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .config-toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .config-status-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .config-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
      font-family: ui-monospace, monospace;
    }

    .config-arrow {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .config-content {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .config-content.is-open {
      display: flex;
    }

    .config-presets {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
    }

    .config-preset-btn {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .config-preset-btn:hover,
    .config-preset-btn.active {
      background: var(--accent-blue-soft);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .config-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-field label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .config-field input,
    .config-field select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }

    .config-field input:focus,
    .config-field select:focus {
      border-color: var(--accent-blue);
    }

    /* 搜索框区域 */
    .search-box {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 6px 8px 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-blue-soft), var(--shadow-lg);
    }

    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      padding: 8px 0;
    }

    .search-input::placeholder {
      color: var(--text-faint);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background-color 0.15s;
    }

    .btn-action:hover {
      color: var(--text-main);
      background: var(--card-bg-soft);
    }

    .btn-submit {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-submit:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent-blue) 85%, #000);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 快捷推荐提问标签 */
    .preset-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
    }

    .preset-label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .preset-btn {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      background: var(--accent-blue-soft);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* 主视区：双轨看板 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 800px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 卡片通用样式 */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .panel-title {
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-ready {
      background: var(--card-bg-soft);
      color: var(--text-muted);
    }

    .status-searching {
      background: rgba(194, 120, 3, 0.1);
      color: var(--accent-amber);
    }

    .status-generating {
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    .status-done {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
    }

    .status-error {
      background: rgba(185, 66, 59, 0.1);
      color: var(--accent-red);
    }

    /* 轨道 1：文档列表 */
    .sources-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }

    .source-card {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .source-card:hover {
      border-color: var(--accent-blue);
      background: color-mix(in srgb, var(--accent-blue-soft) 40%, var(--card-bg-soft));
      transform: translateY(-1px);
    }

    .source-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .score-badge {
      font-family: ui-monospace, monospace;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
      padding: 36px 12px;
      gap: 8px;
    }

    /* 轨道 2：AI 智能流式总结 */
    .answer-content {
      min-height: 220px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cursor {
      display: inline-block;
      width: 6px;
      height: 15px;
      background-color: var(--accent-blue);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Markdown 元素轻量美化 */
    .answer-content h1, 
    .answer-content h2, 
    .answer-content h3 {
      margin-top: 14px;
      margin-bottom: 6px;
      color: var(--accent-blue);
      font-size: 15px;
      font-weight: 650;
    }

    .answer-content strong {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .answer-content code {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: var(--accent-blue);
    }

    .answer-content ul, .answer-content ol {
      padding-left: 20px;
      margin: 8px 0;
    }

    .answer-content .ai-math-display {
      margin: 12px 0;
      padding: 10px 14px;
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow-x: auto;
      text-align: center;
    }

    .answer-content .ai-math-inline {
      display: inline-block;
      vertical-align: baseline;
      margin: 0 2px;
    }

    .answer-content .ai-code-block {
      margin: 10px 0;
      padding: 10px 12px;
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      font-family: ui-monospace, monospace;
    }

    .answer-content .katex {
      font-size: 1.05em;
      color: var(--text-main);
    }

    /* 错误提示框 */
    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      align-items: center;
      gap: 10px;
    }

    /* 旋转等待动画 */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-badge">
        <span>边缘双轨并行检索</span>
        <span>•</span>
        <span>Cloudflare Workers &amp; Vectorize</span>
      </div>
      <h1>高中物理知识库 · 智能搜索与问答</h1>
      <p class="subtitle">毫秒级文档召回 (≤300ms) + 边缘流式 AI 解答 (TTFT ≤600ms)</p>
    </header>

    <!-- API 与模型设置栏 -->
    <div class="config-box">
      <div class="config-toggle-bar" id="configToggle">
        <div class="config-status-label">
          <span>接口配置:</span>
          <span id="configCurrentBadge" class="config-badge">Cloudflare 边缘默认</span>
        </div>
        <span class="config-arrow" id="configArrow">▼</span>
      </div>
      <div class="config-content" id="configContent">
        <!-- 预设提供商快速选择 -->
        <div class="config-presets">
          <span style="color: var(--text-muted); font-size: 11.5px;">快速预设:</span>
          <button type="button" class="config-preset-btn active" data-preset="worker">Cloudflare 边缘 (默认)</button>
          <button type="button" class="config-preset-btn" data-preset="openai">OpenAI 兼容通用 (OAI)</button>
          <button type="button" class="config-preset-btn" data-preset="deepseek">DeepSeek (深度求索)</button>
          <button type="button" class="config-preset-btn" data-preset="anthropic">Anthropic (Claude)</button>
          <button type="button" class="config-preset-btn" data-preset="ollama">Ollama (本地)</button>
        </div>

        <div class="config-grid">
          <div class="config-field">
            <label for="apiProtocol">请求协议</label>
            <select id="apiProtocol">
              <option value="worker">Cloudflare 边缘 Worker SSE</option>
              <option value="openai">OpenAI 兼容通用协议 (OAI / NVIDIA NIM / OneAPI / 官方)</option>
              <option value="anthropic">Anthropic 协议 (Claude 3.5)</option>
            </select>
          </div>
          <div class="config-field">
            <label for="apiEndpoint">接口端点 (URL)</label>
            <input type="text" id="apiEndpoint" value="https://physics-knowledge-search.harlan0804.workers.dev/api/search" placeholder="支持 Base URL (如 https://.../v1) 或完整端点" />
          </div>
          <div class="config-field">
            <label for="apiKey">API 密钥 (Key)</label>
            <input type="password" id="apiKey" placeholder="输入私有 API Key (例如 sk-... 或 nvapi-...)" />
          </div>
          <div class="config-field">
            <label for="apiModel">模型名称 (Model)</label>
            <input type="text" id="apiModel" value="deepseek-chat" placeholder="例如: gpt-4o-mini, meta/llama-3.3-70b-instruct, deepseek-chat" />
          </div>
        </div>
      </div>
    </div>

    <!-- 搜索输入框 -->
    <div class="search-box">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="输入物理问题（例如：电池电动势内阻的测量相关实验的原理是什么）..." 
        autocomplete="off" 
      />
      <div class="btn-group">
        <button id="clearBtn" class="btn-action" title="清空 (Esc)" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <button id="searchBtn" class="btn-submit">
          <span id="btnText">搜索</span>
        </button>
      </div>
    </div>

    <!-- 预设快捷提问 -->
    <div class="preset-tags">
      <span class="preset-label">示例提问:</span>
      <button class="preset-btn" data-q="电池电动势内阻的测量相关实验的原理是什么">电池电动势与内阻测定原理</button>
      <button class="preset-btn" data-q="小灯泡伏安特性曲线为什么会向下弯曲">小灯泡伏安特性曲线机制</button>
      <button class="preset-btn" data-q="动生电动势与感生电动势的区别是什么">动生电动势 vs 感生电动势</button>
      <button class="preset-btn" data-q="测定金属电阻率时为什么要用电流表外接法">金属丝电阻率外接法误差分析</button>
    </div>

    <!-- 错误横幅 -->
    <div id="errorBanner" class="error-banner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="errorMessage">出现错误</span>
    </div>

    <!-- 双轨内容呈现看板 -->
    <div class="dashboard-grid">
      <!-- 轨道 1：相关文档推荐 -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>相关文档推荐</span>
          </div>
          <span id="sourcesBadge" class="status-badge status-ready">待检索</span>
        </div>

        <div id="sourcesList" class="sources-list">
          <div class="empty-state">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>输入问题即可实时召回知识库文档</span>
          </div>
        </div>
      </section>

      <!-- 轨道 2：AI 智能总结 -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>AI 智能总结</span>
          </div>
          <span id="aiBadge" class="status-badge status-ready">等待就绪</span>
        </div>

        <div id="answerContainer" class="answer-content">
          <span style="color: #64748b;">检索完成后，大模型将在此实时流式生成客观解答...</span>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const searchInput = document.getElementById('searchInput');

      /**
       * KaTeX 单公式渲染
       */
      function renderLatex(tex, displayMode) {
        if (!tex || !tex.trim()) return '';
        if (typeof window !== 'undefined' && window.katex) {
          try {
            return window.katex.renderToString(tex.trim(), {
              displayMode: displayMode,
              throwOnError: false,
              strict: false
            });
          } catch (e) {}
        }
        const esc = tex.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return displayMode ? `<pre class="katex-fallback">$$${esc}$$</pre>` : `<code>$${esc}$</code>`;
      }

      /**
       * 深度支持 KaTeX 数学公式、代码块保护与 Markdown 排版
       */
      function formatMarkdown(text) {
        if (!text) return '';
        const mathBlocks = [];
        const mathInlines = [];
        const codeBlocks = [];
        const codeInlines = [];

        let s = text.replace(/\r\n/g, '\n');

        // 1. 保护代码块
        s = s.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
          const idx = codeBlocks.length;
          const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          codeBlocks.push(`<pre class="ai-code-block"><code class="language-${lang || 'text'}">${escaped}</code></pre>`);
          return `___AI_CODE_BLOCK_${idx}___`;
        });

        // 2. 保护行内代码
        s = s.replace(/`([^`\n]+)`/g, (_, code) => {
          const idx = codeInlines.length;
          const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          codeInlines.push(`<code class="ai-code">${escaped}</code>`);
          return `___AI_CODE_INLINE_${idx}___`;
        });

        // 3. 解析块级独立公式 ($$...$$ 与 \\[...\\])
        s = s.replace(/\$\$([\s\S]*?)\$\$/g, (_, tex) => {
          const idx = mathBlocks.length;
          const rendered = renderLatex(tex, true);
          mathBlocks.push(`<div class="ai-math-display">${rendered}</div>`);
          return `___AI_MATH_BLOCK_${idx}___`;
        });
        s = s.replace(/\\\[([\s\S]*?)\\\]/g, (_, tex) => {
          const idx = mathBlocks.length;
          const rendered = renderLatex(tex, true);
          mathBlocks.push(`<div class="ai-math-display">${rendered}</div>`);
          return `___AI_MATH_BLOCK_${idx}___`;
        });

        // 4. 解析行内公式 ($...$、带内侧空格的 $ ... $ 与 \\(...\\))
        const inlineMathRegex =
          /\$(?!\$)(?:([^\$\n\s](?:[^\$\n]*?[^\$\n\s])?)|[ \t]+([a-zA-Z\\+\\-](?:[^\$\n]*?[a-zA-Z0-9\}\)\\_\\+\\-])?)[ \t]+)\$/g;

        s = s.replace(inlineMathRegex, (_, texA, texB) => {
          const tex = texA || texB || '';
          const idx = mathInlines.length;
          const rendered = renderLatex(tex, false);
          mathInlines.push(`<span class="ai-math-inline">${rendered}</span>`);
          return `___AI_MATH_INLINE_${idx}___`;
        });
        s = s.replace(/\\\((.+?)\\\)/g, (_, tex) => {
          const idx = mathInlines.length;
          const rendered = renderLatex(tex, false);
          mathInlines.push(`<span class="ai-math-inline">${rendered}</span>`);
          return `___AI_MATH_INLINE_${idx}___`;
        });

        // 5. 正文普通文本 HTML 转义
        s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        // 6. Markdown 标题、加粗、斜体
        s = s.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
        s = s.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
        s = s.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^\*\n]+?)\*/g, '<em>$1</em>');

        // 7. 解析列表 (非贪婪，按连续行聚合)
        s = s.replace(/(?:^[ \t]*[-*][ \t]+.+(?:\n|$))+/gm, (match) => {
          const items = match
            .trim()
            .split('\n')
            .map((line) => line.replace(/^[ \t]*[-*][ \t]+/, '').trim())
            .filter(Boolean)
            .map((item) => `<li>${item}</li>`)
            .join('\n');
          return `<ul>\n${items}\n</ul>\n`;
        });

        s = s.replace(/(?:^[ \t]*\d+\.[ \t]+.+(?:\n|$))+/gm, (match) => {
          const items = match
            .trim()
            .split('\n')
            .map((line) => line.replace(/^[ \t]*\d+\.[ \t]+/, '').trim())
            .filter(Boolean)
            .map((item) => `<li>${item}</li>`)
            .join('\n');
          return `<ol>\n${items}\n</ol>\n`;
        });

        // 8. 确保块级公式与代码块前后有独立换行，避免被包裹进 <p>
        s = s.replace(/(\n?___AI_MATH_BLOCK_\d+___\n?)/g, '\n\n$1\n\n');
        s = s.replace(/(\n?___AI_CODE_BLOCK_\d+___\n?)/g, '\n\n$1\n\n');

        // 9. 段落换行
        const paragraphs = s.split(/\n{2,}/).map(p => {
          p = p.trim();
          if (!p) return '';
          if (p.startsWith('<h') || p.startsWith('<ul>') || p.startsWith('<ol>') || p.startsWith('___AI_CODE_BLOCK_') || p.startsWith('___AI_MATH_BLOCK_')) {
            return p;
          }
          return `<p>${p.replace(/\n/g, '<br>')}</p>`;
        });
        s = paragraphs.filter(Boolean).join('\n');

        // 10. 回填公式与代码
        s = s.replace(/___AI_MATH_BLOCK_(\d+)___/g, (_, i) => mathBlocks[Number(i)] || '');
        s = s.replace(/___AI_MATH_INLINE_(\d+)___/g, (_, i) => mathInlines[Number(i)] || '');
        s = s.replace(/___AI_CODE_BLOCK_(\d+)___/g, (_, i) => codeBlocks[Number(i)] || '');
        s = s.replace(/___AI_CODE_INLINE_(\d+)___/g, (_, i) => codeInlines[Number(i)] || '');

        return s;
      }

      const SYSTEM_PROMPT = `你是高中物理知识库与高考备考辅导专家。你的职责是依据物理学科核心素养，为用户提供概念严谨、推导规范、客观无废话的高考物理权威解答。
请严格遵守以下物理与数学排版规范：
1. 物理公式与数学符号规范 (强制 LaTeX 输出)：
   - 所有物理量符号、变量、数值单位、物理公式、定理定律及推导过程（例如 $E = U + Ir$、$F = ma$ 等），必须且只能使用规范的标准 LaTeX 语法输出。
   - 【行内公式】：必须统一使用单美元符号包围，格式为 $公式内容$。严禁使用 \\( \\)。
   - 【块级/独立推导公式】：重要核心公式或推导步骤必须独立成行，统一使用双美元符号包围：
$$
公式内容
$$
     严禁使用 \\[ \\]。
2. 语言客观精炼，使用 Markdown 格式排版。`;

      /**
       * 核心搜索执行逻辑（支持 Worker SSE / OpenAI / Anthropic）
       */
      async function executeSearch() {
        const query = searchInput.value.trim();
        if (!query) {
          searchInput.focus();
          return;
        }

        const protocol = apiProtocolInput.value || 'worker';
        const endpoint = apiEndpointInput.value.trim() || 'https://physics-knowledge-search.harlan0804.workers.dev/api/search';
        const apiKey = apiKeyInput.value.trim();
        const model = apiModelInput.value.trim() || 'deepseek-chat';

        startSearchState();
        currentAbortController = new AbortController();
        const signal = currentAbortController.signal;

        try {
          if (protocol === 'worker') {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query }),
              signal,
            });

            if (!response.ok) {
              let errMsg = `请求失败 (HTTP ${response.status})`;
              try {
                const errJson = await response.json();
                if (errJson.error) errMsg = errJson.error;
              } catch {}
              throw new Error(errMsg);
            }

            if (!response.body) throw new Error('响应未包含流式内容 (ReadableStream)');

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const eventBlocks = buffer.split('\n\n');
              buffer = eventBlocks.pop() || '';

              for (const block of eventBlocks) {
                const trimmed = block.trim();
                if (!trimmed) continue;

                const lines = trimmed.split('\n');
                let eventType = 'message';
                let dataText = '';

                for (const line of lines) {
                  if (line.startsWith('event:')) {
                    eventType = line.replace(/^event:\s*/, '').trim();
                  } else if (line.startsWith('data:')) {
                    dataText += line.replace(/^data:\s*/, '').trim();
                  }
                }

                if (!dataText) continue;

                let dataObj = {};
                try {
                  dataObj = JSON.parse(dataText);
                } catch {
                  dataObj = { raw: dataText };
                }

                handleServerEvent(eventType, dataObj);
              }
            }
          } else if (protocol === 'openai' || protocol === 'anthropic') {
            // 自定义协议：先尝试从 Worker 获取知识切片 (超时 2.5s)
            let contextSnippet = '';
            try {
              const ragController = new AbortController();
              const timer = setTimeout(() => ragController.abort(), 2500);
              if (signal) signal.addEventListener('abort', () => ragController.abort(), { once: true });

              const ragRes = await fetch(PRESETS.worker.endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, searchOnly: true }),
                signal: ragController.signal
              });
              clearTimeout(timer);

              if (ragRes.ok && ragRes.body) {
                const reader = ragRes.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const blocks = buffer.split('\n\n');
                  buffer = blocks.pop() || '';
                  for (const b of blocks) {
                    if (b.includes('event: sources')) {
                      const m = b.match(/data:\s*(.+)/);
                      if (m && m[1]) {
                        try {
                          const sData = JSON.parse(m[1]);
                          if (sData.sources?.length) {
                            renderSources(sData.sources);
                            contextSnippet = `【高考物理知识库参考文档资料】：\n${sData.sources
                              .map((s, idx) => `[${idx + 1}] 《${s.title}》 (${s.url}):\n${s.snippet || '相关物理考点与公式'}`)
                              .join('\n\n')}\n\n`;
                          }
                        } catch (e) {}
                      }
                    }
                  }
                  if (contextSnippet) {
                    reader.cancel();
                    break;
                  }
                }
              }
            } catch (e) {}

            if (!contextSnippet) {
              sourcesBadge.className = 'status-badge status-ready';
              sourcesBadge.textContent = '直连模式';
              sourcesList.innerHTML = `
                <div class="empty-state">
                  <span>已启用 ${protocol.toUpperCase()} 自定义模型直连推导</span>
                </div>
              `;
            }

            const userContent = `${contextSnippet}【用户问题】：\n${query}`;

            if (protocol === 'openai') {
              const targetEndpoint = normalizeOpenAiEndpoint(endpoint);
              const headers = { 'Content-Type': 'application/json' };
              if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;

              const response = await fetch(targetEndpoint, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  model,
                  messages: [
                    { role: 'system', content: SYSTEM_PROMPT },
                    { role: 'user', content: userContent }
                  ],
                  temperature: 0.3,
                  stream: true
                }),
                signal
              });

              if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err?.error?.message || `HTTP ${response.status}`);
              }

              aiBadge.className = 'status-badge status-generating';
              aiBadge.textContent = `${model} 生成中...`;

              const reader = response.body.getReader();
              const decoder = new TextDecoder('utf-8');
              let buffer = '';

              // <think>...</think> 标签过滤状态机（Qwen3 / mimo / DeepSeek-R1 等推理模型）
              let inThinkTag = false;
              let thinkBuf = '';

              while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                  const trimmed = line.trim();
                  if (!trimmed || !trimmed.startsWith('data:')) continue;
                  const dataStr = trimmed.replace(/^data:\s*/, '').trim();
                  if (dataStr === '[DONE]') {
                    handleServerEvent('done', {});
                    return;
                  }
                  try {
                    const parsed = JSON.parse(dataStr);
                    let chunk = parsed.choices?.[0]?.delta?.content;
                    // 注意：忽略 reasoning_content，避免思维链内容泄露给用户
                    if (!chunk) continue;

                    // 状态机：过滤 <think>...</think> 标签内容
                    thinkBuf += chunk;
                    let output = '';

                    while (thinkBuf.length > 0) {
                      if (inThinkTag) {
                        const endIdx = thinkBuf.indexOf('</think>');
                        if (endIdx !== -1) {
                          thinkBuf = thinkBuf.slice(endIdx + '</think>'.length);
                          inThinkTag = false;
                        } else {
                          break;
                        }
                      } else {
                        const startIdx = thinkBuf.indexOf('<think>');
                        if (startIdx !== -1) {
                          output += thinkBuf.slice(0, startIdx);
                          thinkBuf = thinkBuf.slice(startIdx + '<think>'.length);
                          inThinkTag = true;
                        } else {
                          const partialTagLen = '<think>'.length - 1;
                          if (thinkBuf.length > partialTagLen) {
                            output += thinkBuf.slice(0, thinkBuf.length - partialTagLen);
                            thinkBuf = thinkBuf.slice(thinkBuf.length - partialTagLen);
                          }
                          break;
                        }
                      }
                    }

                    if (output) {
                      handleServerEvent('delta', { text: output });
                    }
                  } catch {}
                }
              }
              handleServerEvent('done', {});
            } else if (protocol === 'anthropic') {
              const targetEndpoint = normalizeAnthropicEndpoint(endpoint);
              const headers = {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
              };

              const response = await fetch(targetEndpoint, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  model,
                  system: SYSTEM_PROMPT,
                  messages: [{ role: 'user', content: userContent }],
                  max_tokens: 2048,
                  temperature: 0.3,
                  stream: true
                }),
                signal
              });

              if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err?.error?.message || `HTTP ${response.status}`);
              }

              aiBadge.className = 'status-badge status-generating';
              aiBadge.textContent = `${model} 生成中...`;

              const reader = response.body.getReader();
              const decoder = new TextDecoder('utf-8');
              let buffer = '';

              while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                  const trimmed = line.trim();
                  if (!trimmed || !trimmed.startsWith('data:')) continue;
                  const dataStr = trimmed.replace(/^data:\s*/, '').trim();
                  try {
                    const parsed = JSON.parse(dataStr);
                    if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
                      handleServerEvent('delta', { text: parsed.delta.text });
                    } else if (parsed.type === 'message_stop') {
                      handleServerEvent('done', {});
                      return;
                    } else if (parsed.type === 'error') {
                      showError(parsed.error?.message || 'Anthropic 接口调用异常');
                      return;
                    }
                  } catch {}
                }
              }
              handleServerEvent('done', {});
            }
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            console.log('搜索已取消');
          } else {
            showError(err.message || '网络连接或服务异常');
            sourcesBadge.className = 'status-badge status-error';
            sourcesBadge.textContent = '异常中断';
            aiBadge.className = 'status-badge status-error';
            aiBadge.textContent = '服务异常';
          }
        } finally {
          finishSearchState();
        }
      }

      /**
       * SSE 事件处理器
       */
      function handleServerEvent(eventType, data) {
        switch (eventType) {
          case 'sources':
            renderSources(data.sources || []);
            aiBadge.className = 'status-badge status-generating';
            aiBadge.textContent = 'AI 思考生成中...';
            break;

          case 'delta':
            if (data.text) {
              rawAiText += data.text;
              answerContainer.innerHTML = formatMarkdown(rawAiText) + '<span class="cursor"></span>';
            }
            break;

          case 'done':
            aiBadge.className = 'status-badge status-done';
            aiBadge.textContent = '解答生成完毕';
            const cursor = answerContainer.querySelector('.cursor');
            if (cursor) cursor.remove();
            break;

          case 'error':
            showError(data.message || '服务端处理出错');
            aiBadge.className = 'status-badge status-error';
            aiBadge.textContent = '服务异常';
            break;
        }
      }
    })();
  </script>
</body>
</html>
