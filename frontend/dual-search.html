<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库双轨检索与流式 AI 问答</title>
  <style>
    :root {
      --bg: #FAF9F5;
      --card-bg: #FFFFFF;
      --card-bg-soft: #F3F1EC;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover-border: #4C67B9;
      --text-main: #1F2328;
      --text-muted: #57606A;
      --text-faint: #6E7781;
      --accent-blue: #4C67B9;
      --accent-blue-soft: rgba(76, 103, 185, 0.1);
      --accent-purple: #7C3AED;
      --accent-green: #10B981;
      --accent-amber: #C27803;
      --accent-red: #B9423B;
      --input-bg: #F3F1EC;
      --shadow-lg: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151718;
        --card-bg: #1C1F21;
        --card-bg-soft: #23272A;
        --card-border: rgba(255, 255, 255, 0.09);
        --card-hover-border: #758EE6;
        --text-main: #E3E5E8;
        --text-muted: #9BA1A6;
        --text-faint: #687076;
        --accent-blue: #758EE6;
        --accent-blue-soft: rgba(117, 142, 230, 0.16);
        --input-bg: #1C1F21;
        --shadow-lg: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 36px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* 头部 */
    header {
      text-align: center;
      margin-bottom: 4px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-blue);
      background: var(--accent-blue-soft);
      border: 1px solid color-mix(in srgb, var(--accent-blue) 30%, transparent);
      padding: 3px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
      font-family: ui-monospace, monospace;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* 设置与端点配置 */
    .endpoint-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--card-bg-soft);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      width: fit-content;
      margin: 0 auto;
    }

    .endpoint-bar input {
      background: transparent;
      border: none;
      color: var(--accent-blue);
      font-size: 12px;
      font-family: ui-monospace, monospace;
      outline: none;
      width: 260px;
    }

    /* 搜索框区域 */
    .search-box {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 6px 8px 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-blue-soft), var(--shadow-lg);
    }

    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      padding: 8px 0;
    }

    .search-input::placeholder {
      color: var(--text-faint);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background-color 0.15s;
    }

    .btn-action:hover {
      color: var(--text-main);
      background: var(--card-bg-soft);
    }

    .btn-submit {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-submit:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent-blue) 85%, #000);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 快捷推荐提问标签 */
    .preset-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
    }

    .preset-label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .preset-btn {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      background: var(--accent-blue-soft);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* 主视区：双轨看板 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 800px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 卡片通用样式 */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .panel-title {
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-ready {
      background: var(--card-bg-soft);
      color: var(--text-muted);
    }

    .status-searching {
      background: rgba(194, 120, 3, 0.1);
      color: var(--accent-amber);
    }

    .status-generating {
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    .status-done {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
    }

    .status-error {
      background: rgba(185, 66, 59, 0.1);
      color: var(--accent-red);
    }

    /* 轨道 1：文档列表 */
    .sources-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }

    .source-card {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .source-card:hover {
      border-color: var(--accent-blue);
      background: color-mix(in srgb, var(--accent-blue-soft) 40%, var(--card-bg-soft));
      transform: translateY(-1px);
    }

    .source-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .score-badge {
      font-family: ui-monospace, monospace;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
      padding: 36px 12px;
      gap: 8px;
    }

    /* 轨道 2：AI 智能流式总结 */
    .answer-content {
      min-height: 220px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cursor {
      display: inline-block;
      width: 6px;
      height: 15px;
      background-color: var(--accent-blue);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Markdown 元素轻量美化 */
    .answer-content h1, 
    .answer-content h2, 
    .answer-content h3 {
      margin-top: 14px;
      margin-bottom: 6px;
      color: var(--accent-blue);
      font-size: 15px;
      font-weight: 650;
    }

    .answer-content strong {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .answer-content code {
      background: var(--card-bg-soft);
      border: 1px solid var(--card-border);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: var(--accent-blue);
    }

    .answer-content ul, .answer-content ol {
      padding-left: 20px;
      margin: 8px 0;
    }

    /* 错误提示框 */
    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      align-items: center;
      gap: 10px;
    }

    /* 旋转等待动画 */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-badge">
        <span>⚡ 边缘双轨并行检索</span>
        <span>•</span>
        <span>Cloudflare Workers & Vectorize</span>
      </div>
      <h1>高中物理知识库 · 智能搜索与问答</h1>
      <p class="subtitle">毫秒级文档召回 (≤300ms) + 边缘流式 AI 解答 (TTFT ≤600ms)</p>
    </header>

    <!-- 端点配置栏 -->
    <div class="endpoint-bar">
      <span>API Endpoint:</span>
      <input type="text" id="apiEndpoint" value="https://physics-knowledge-search.harlan0804.workers.dev/api/search" placeholder="如: /api/search 或完整 Worker URL" />
    </div>

    <!-- 搜索输入框 -->
    <div class="search-box">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="输入物理问题（例如：电池电动势内阻的测量相关实验的原理是什么）..." 
        autocomplete="off" 
      />
      <div class="btn-group">
        <button id="clearBtn" class="btn-action" title="清空 (Esc)" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <button id="searchBtn" class="btn-submit">
          <span id="btnText">搜索</span>
        </button>
      </div>
    </div>

    <!-- 预设快捷提问 -->
    <div class="preset-tags">
      <span class="preset-label">🔥 示例提问:</span>
      <button class="preset-btn" data-q="电池电动势内阻的测量相关实验的原理是什么">⚡ 电池电动势与内阻测定原理</button>
      <button class="preset-btn" data-q="小灯泡伏安特性曲线为什么会向下弯曲">💡 小灯泡伏安特性曲线机制</button>
      <button class="preset-btn" data-q="动生电动势与感生电动势的区别是什么">🧲 动生电动势 vs 感生电动势</button>
      <button class="preset-btn" data-q="测定金属电阻率时为什么要用电流表外接法">📏 金属丝电阻率外接法误差分析</button>
    </div>

    <!-- 错误横幅 -->
    <div id="errorBanner" class="error-banner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="errorMessage">出现错误</span>
    </div>

    <!-- 双轨内容呈现看板 -->
    <div class="dashboard-grid">
      <!-- 轨道 1：相关文档推荐 -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>⚡ 相关文档推荐</span>
          </div>
          <span id="sourcesBadge" class="status-badge status-ready">待检索</span>
        </div>

        <div id="sourcesList" class="sources-list">
          <div class="empty-state">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>输入问题即可实时召回知识库文档</span>
          </div>
        </div>
      </section>

      <!-- 轨道 2：AI 智能总结 -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>🤖 AI 智能总结</span>
          </div>
          <span id="aiBadge" class="status-badge status-ready">等待就绪</span>
        </div>

        <div id="answerContainer" class="answer-content">
          <span style="color: #64748b;">检索完成后，大模型将在此实时流式生成客观解答...</span>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const btnText = document.getElementById('btnText');
      const clearBtn = document.getElementById('clearBtn');
      const apiEndpointInput = document.getElementById('apiEndpoint');
      const sourcesList = document.getElementById('sourcesList');
      const sourcesBadge = document.getElementById('sourcesBadge');
      const answerContainer = document.getElementById('answerContainer');
      const aiBadge = document.getElementById('aiBadge');
      const errorBanner = document.getElementById('errorBanner');
      const errorMessage = document.getElementById('errorMessage');

      let currentAbortController = null;
      let isSearching = false;
      let rawAiText = '';

      // 清空按钮显隐
      searchInput.addEventListener('input', () => {
        clearBtn.style.display = searchInput.value ? 'flex' : 'none';
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        searchInput.focus();
      });

      // 预设问题点击触发
      document.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (isSearching) return;
          searchInput.value = btn.getAttribute('data-q');
          clearBtn.style.display = 'flex';
          executeSearch();
        });
      });

      // 回车触发
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !isSearching) {
          e.preventDefault();
          executeSearch();
        } else if (e.key === 'Escape') {
          searchInput.value = '';
          clearBtn.style.display = 'none';
        }
      });

      searchBtn.addEventListener('click', () => {
        if (isSearching) {
          // 如果正在搜索，点击按钮可取消
          if (currentAbortController) {
            currentAbortController.abort();
          }
          finishSearchState();
        } else {
          executeSearch();
        }
      });

      function showError(msg) {
        errorMessage.textContent = msg;
        errorBanner.style.display = 'flex';
      }

      function hideError() {
        errorBanner.style.display = 'none';
      }

      function startSearchState() {
        isSearching = true;
        hideError();
        searchInput.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> 停止';
        searchBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';

        // 重置状态徽章
        sourcesBadge.className = 'status-badge status-searching';
        sourcesBadge.textContent = '检索中...';
        aiBadge.className = 'status-badge status-searching';
        aiBadge.textContent = '等待文档...';

        // 骨架屏清空
        sourcesList.innerHTML = `
          <div class="empty-state">
            <span class="spinner" style="width: 24px; height: 24px; border-width: 3px; color: var(--accent-blue);"></span>
            <span style="margin-top: 8px;">正在 Vectorize 向量检索中...</span>
          </div>
        `;
        rawAiText = '';
        answerContainer.innerHTML = '<span class="cursor"></span>';
      }

      function finishSearchState() {
        isSearching = false;
        searchInput.disabled = false;
        btnText.textContent = '搜索';
        searchBtn.style.background = 'linear-gradient(135deg, #0284c7, #2563eb)';
        currentAbortController = null;

        // 移除光标
        const cursor = answerContainer.querySelector('.cursor');
        if (cursor) cursor.remove();
      }

      /**
       * 渲染相关文档卡片
       */
      function renderSources(sources) {
        if (!sources || sources.length === 0) {
          sourcesBadge.className = 'status-badge status-error';
          sourcesBadge.textContent = '未召回文档';
          sourcesList.innerHTML = `
            <div class="empty-state">
              <span style="color: var(--accent-amber);">未检索到高于阈值 (0.65) 的相关文档</span>
            </div>
          `;
          return;
        }

        sourcesBadge.className = 'status-badge status-done';
        sourcesBadge.textContent = `已召回 ${sources.length} 篇`;

        sourcesList.innerHTML = sources
          .map((doc, idx) => {
            const pct = Math.round((doc.score || 0) * 100);
            return `
              <a href="${doc.url || '#'}" target="_blank" class="source-card">
                <div class="source-title">${doc.title || '未命名文档'}</div>
                <div class="source-meta">
                  <span>参考 #${idx + 1}</span>
                  <span class="score-badge">${pct}% 相似度</span>
                </div>
              </a>
            `;
          })
          .join('');
      }

      /**
       * 简单的 Markdown 格式渲染 (保留换行、加粗与行内代码)
       */
      function formatMarkdown(text) {
        let html = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // 加粗 **text**
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        // 行内代码 `code`
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        // 标题 ###
        html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');

        return html;
      }

      /**
       * 核心搜索执行逻辑
       */
      async function executeSearch() {
        const query = searchInput.value.trim();
        if (!query) {
          searchInput.focus();
          return;
        }

        const endpoint = apiEndpointInput.value.trim() || '/api/search';

        startSearchState();
        currentAbortController = new AbortController();

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ query }),
            signal: currentAbortController.signal,
          });

          if (!response.ok) {
            let errMsg = `请求失败 (HTTP ${response.status})`;
            try {
              const errJson = await response.json();
              if (errJson.error) errMsg = errJson.error;
            } catch {}
            throw new Error(errMsg);
          }

          if (!response.body) {
            throw new Error('响应未包含流式内容 (ReadableStream)');
          }

          // 处理 ReadableStream SSE 流式数据
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            // SSE 协议事件块之间以双换行 \n\n 分隔
            const eventBlocks = buffer.split('\n\n');
            // 保留最后一个可能未完整的事件片段
            buffer = eventBlocks.pop() || '';

            for (const block of eventBlocks) {
              const trimmed = block.trim();
              if (!trimmed) continue;

              const lines = trimmed.split('\n');
              let eventType = 'message';
              let dataText = '';

              for (const line of lines) {
                if (line.startsWith('event:')) {
                  eventType = line.replace(/^event:\s*/, '').trim();
                } else if (line.startsWith('data:')) {
                  dataText += line.replace(/^data:\s*/, '').trim();
                }
              }

              if (!dataText) continue;

              let dataObj = {};
              try {
                dataObj = JSON.parse(dataText);
              } catch {
                dataObj = { raw: dataText };
              }

              // 分发 SSE 事件
              handleServerEvent(eventType, dataObj);
            }
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            console.log('搜索已取消');
          } else {
            showError(err.message || '网络连接或服务异常');
            sourcesBadge.className = 'status-badge status-error';
            sourcesBadge.textContent = '异常中断';
            aiBadge.className = 'status-badge status-error';
            aiBadge.textContent = '异常中断';
          }
        } finally {
          finishSearchState();
        }
      }

      /**
       * SSE 事件处理器
       */
      function handleServerEvent(eventType, data) {
        switch (eventType) {
          case 'sources':
            renderSources(data.sources || []);
            aiBadge.className = 'status-badge status-generating';
            aiBadge.textContent = 'AI 思考生成中...';
            break;

          case 'delta':
            if (data.text) {
              rawAiText += data.text;
              answerContainer.innerHTML = formatMarkdown(rawAiText) + '<span class="cursor"></span>';
            }
            break;

          case 'done':
            aiBadge.className = 'status-badge status-done';
            aiBadge.textContent = '生成完成';
            const cursor = answerContainer.querySelector('.cursor');
            if (cursor) cursor.remove();
            break;

          case 'error':
            showError(data.message || '服务端处理出错');
            aiBadge.className = 'status-badge status-error';
            aiBadge.textContent = '服务异常';
            break;
        }
      }
    })();
  </script>
</body>
</html>
