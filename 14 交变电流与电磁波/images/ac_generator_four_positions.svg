<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">正弦交变电流产生机制、中性面特征与“四值”全景</text>

  <!-- 左侧：线圈转动中性面模型 -->
  <g transform="translate(30, 48)">
    <rect width="335" height="235" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="167" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">中性面 (Neutral Plane) 临界对比</text>

    <!-- 中性面位置 -->
    <rect x="15" y="40" width="305" height="75" rx="5" fill="#0f172a"/>
    <text x="25" y="58" fill="#4ade80" font-size="12" font-weight="bold">● 线圈处于中性面位置 (与磁感线垂直)：</text>
    <text x="25" y="78" fill="#cbd5e1" font-size="11.5">• 磁通量最大：Φ_max = BS</text>
    <text x="25" y="98" fill="#cbd5e1" font-size="11.5">• 切割速度平行B ⇒ 感应电动势 e = 0；电流变向点</text>

    <!-- 垂直中性面位置 -->
    <rect x="15" y="125" width="305" height="75" rx="5" fill="#0f172a"/>
    <text x="25" y="143" fill="#f43f5e" font-size="12" font-weight="bold">● 线圈处于平行磁场位置 (垂直中性面)：</text>
    <text x="25" y="163" fill="#cbd5e1" font-size="11.5">• 磁通量为零：Φ = 0</text>
    <text x="25" y="183" fill="#cbd5e1" font-size="11.5">• 导线垂直切割速度最大 ⇒ 峰值 E_m = NBSω</text>
  </g>

  <!-- 右侧：交流电波形与四值 -->
  <g transform="translate(395, 48)">
    <rect width="335" height="235" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="167" y="24" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">交流电波形图与高考“四值”法宝</text>

    <!-- 正弦波形示意 -->
    <path d="M 30 75 Q 90 35 150 75 T 270 75" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="30" y1="75" x2="290" y2="75" stroke="#64748b" stroke-width="1"/>
    <line x1="30" y1="35" x2="30" y2="115" stroke="#64748b" stroke-width="1"/>
    <text x="295" y="78" fill="#94a3b8" font-size="10">t</text>
    <text x="25" y="32" fill="#94a3b8" font-size="10">u</text>
    <text x="90" y="30" fill="#fbbf24" font-size="11" font-weight="bold">U_m</text>

    <!-- 四值说明 -->
    <rect x="15" y="115" width="305" height="105" rx="6" fill="#0f172a"/>
    <text x="25" y="133" fill="#38bdf8" font-size="11.5">• 瞬时值：e = E_m sin(ωt)，描述某一瞬间状态</text>
    <text x="25" y="153" fill="#fb923c" font-size="11.5">• 峰值：E_m = NBSω，决定电容器耐压击穿值</text>
    <text x="25" y="173" fill="#4ade80" font-size="11.5" font-weight="bold">• 有效值：U = U_m / √2，仪表读数、发热、标称值</text>
    <text x="25" y="195" fill="#f472b6" font-size="11.5">• 平均值：E_平 = N(ΔΦ/Δt)，唯一用于求电荷量 q</text>
  </g>
</svg>