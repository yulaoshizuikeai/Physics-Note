<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">远距离高压输电物理模型与功率损耗机理</text>

  <!-- 输电流程图 -->
  <g transform="translate(30, 50)">
    <!-- 发电机 -->
    <rect x="10" y="60" width="80" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="85" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">发电厂</text>
    <text x="50" y="105" fill="#cbd5e1" font-size="10" text-anchor="middle">P₁, U₁</text>

    <!-- 升压变压器 T1 -->
    <rect x="130" y="50" width="80" height="80" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="170" y="82" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">升压变压器</text>
    <text x="170" y="102" fill="#cbd5e1" font-size="10" text-anchor="middle">T₁ (n₁ &lt; n₂)</text>

    <!-- 输电线 -->
    <line x1="210" y1="70" x2="490" y2="70" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="210" y1="110" x2="490" y2="110" stroke="#ef4444" stroke-width="2.5"/>
    <text x="350" y="62" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">输电导线电阻 R_线</text>
    <text x="350" y="100" fill="#f87171" font-size="10" text-anchor="middle">电流 I_线 = P₂ / U₂</text>

    <!-- 降压变压器 T2 -->
    <rect x="490" y="50" width="80" height="80" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="530" y="82" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">降压变压器</text>
    <text x="530" y="102" fill="#cbd5e1" font-size="10" text-anchor="middle">T₂ (n₃ &gt; n₄)</text>

    <!-- 用户 -->
    <rect x="610" y="60" width="80" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="650" y="85" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">用户负载</text>
    <text x="650" y="105" fill="#cbd5e1" font-size="10" text-anchor="middle">P_用, U_用</text>

    <!-- 底部核心公式 -->
    <rect x="10" y="150" width="680" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="350" y="173" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">输电线功率损耗：ΔP = I_线² · R_线 = (P / U_输)² · R_线</text>
    <text x="350" y="198" fill="#4ade80" font-size="12" text-anchor="middle">★ 高压输电核心逻辑：输电电压 U 提升 n 倍 ⇒ 线电流降为 1/n ⇒ 线路热损耗 ΔP 骤降为 1/n²！</text>
  </g>
</svg>