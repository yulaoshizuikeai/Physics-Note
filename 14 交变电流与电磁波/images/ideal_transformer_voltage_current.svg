<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">理想变压器基本原理与三大物理制约因果律</text>

  <!-- 变压器结构示意 -->
  <g transform="translate(40, 50)">
    <rect width="280" height="205" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">闭合闭环铁芯与线圈</text>

    <!-- 铁芯框 -->
    <rect x="60" y="45" width="160" height="110" rx="6" fill="none" stroke="#64748b" stroke-width="14"/>
    <rect x="80" y="65" width="120" height="70" rx="3" fill="#0f172a"/>

    <!-- 原线圈 -->
    <path d="M 50 60 L 68 60 M 50 80 L 68 80 M 50 100 L 68 100 M 50 120 L 68 120" stroke="#fbbf24" stroke-width="3"/>
    <text x="35" y="95" fill="#fbbf24" font-size="12" font-weight="bold">n₁</text>
    <text x="30" y="145" fill="#38bdf8" font-size="11">U₁ (原端)</text>

    <!-- 副线圈 -->
    <path d="M 212 70 L 230 70 M 212 90 L 230 90 M 212 110 L 230 110" stroke="#4ade80" stroke-width="3"/>
    <text x="245" y="95" fill="#4ade80" font-size="12" font-weight="bold">n₂</text>
    <text x="220" y="145" fill="#4ade80" font-size="11">U₂ (副端)</text>

    <text x="140" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle">无磁通漏泄 (无漏磁) + 无铁损铜损</text>
  </g>

  <!-- 三大制约关系 -->
  <g transform="translate(350, 50)">
    <rect width="370" height="205" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="185" y="24" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">高考三大铁律制约因果链</text>

    <rect x="15" y="40" width="340" height="42" rx="5" fill="#0f172a"/>
    <text x="25" y="58" fill="#38bdf8" font-size="12" font-weight="bold">1. 电压因果律：原端决定副端！</text>
    <text x="25" y="74" fill="#cbd5e1" font-size="11">U₂ = (n₂ / n₁) · U₁ （U₂ 纯由 U₁ 和匝数比决定）</text>

    <rect x="15" y="90" width="340" height="42" rx="5" fill="#0f172a"/>
    <text x="25" y="108" fill="#fb923c" font-size="12" font-weight="bold">2. 功率因果律：副端决定原端！</text>
    <text x="25" y="124" fill="#cbd5e1" font-size="11">P_入 = P_出 （副线圈要多少功率，原线圈才供给多少）</text>

    <rect x="15" y="140" width="340" height="50" rx="5" fill="#0f172a"/>
    <text x="25" y="158" fill="#f472b6" font-size="12" font-weight="bold">3. 电流因果律：副端决定原端！</text>
    <text x="25" y="174" fill="#cbd5e1" font-size="11">I₁ = (n₂ / n₁) · I₂ （单副线圈）；n₁I₁ = n₂I₂ + n₃I₃ （多副线圈）</text>
  </g>
</svg>