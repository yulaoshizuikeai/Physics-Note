<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    机械能守恒定律三大充要判据与求解方程表述矩阵
  </text>

  <!-- ==================== 左侧：守恒三大判据 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 守恒充要条件判据（看“做功”而非看“受力”）
    </text>

    <!-- 判据 1 -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="330" height="65" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">① 纯净受力：只有重力或弹簧弹力作用</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">• 典型情境：自由落体、平抛运动、斜抛运动</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 无其它外力介入，动能与重力势能纯粹互换</text>
    </g>

    <!-- 判据 2 -->
    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="330" height="65" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">② 受其他力，但其他力全程做功恒为零</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#1e3a8a">• 典型情境：光滑曲面支持力、轻绳单摆张力</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 弹力/张力时刻垂直于瞬时速度方向（F ⟂ v）</text>
    </g>

    <!-- 判据 3 -->
    <g transform="translate(15, 184)">
      <rect x="0" y="0" width="330" height="68" rx="5" fill="#fef2f2" stroke="#fecaca"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">③ 多物体系：内部非保守力做功代数和为零</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">• 典型情境：不可伸长轻绳、轻杆连接双物体系统</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">• 内力做功仅仅在系统内部物体间等量转移机械能</text>
    </g>
  </g>

  <!-- ==================== 右侧：三大数学表述矩阵 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 解题方程三大表述矩阵对比
    </text>

    <!-- 表述 1: 状态式 -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="330" height="65" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">✦ 状态式：E₁ = E₂ （E_k1 + E_p1 = E_k2 + E_p2）</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• 视角：初末两个状态的总机械能数值严格守恒</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#ea580c">⚠️ 适用单物体，必须预先指定零势能参考平面！</text>
    </g>

    <!-- 表述 2: 转化式 -->
    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="330" height="65" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">✦ 转化式：ΔE_k = -ΔE_p （ΔE_k增 = ΔE_p减）</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• 视角：动能的增加量等于势能的减少量</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#059669">✦ 优势：含弹簧系统神技！完全无需选零势能参考面！</text>
    </g>

    <!-- 表述 3: 转移式 -->
    <g transform="translate(15, 184)">
      <rect x="0" y="0" width="330" height="68" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">✦ 转移式：ΔE_A增 = ΔE_B减</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• 视角：物体 A 机械能增量等于物体 B 机械能减量</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#7c3aed">✦ 优势：连接体多物体系统，直接避开内力做功计算</text>
    </g>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    机械能守恒铁则：做功看重力与弹簧，其它力做功必破坏；单体选状态式，弹簧选增减转化式！
  </text>
</svg>
