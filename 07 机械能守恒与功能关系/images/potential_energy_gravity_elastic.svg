<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-pe" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    势能做功本质：重力做功与路径无关 · 弹性势能 F-x 图像积分
  </text>

  <!-- ==================== 左侧：重力做功路径无关性 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 重力做功与路径无关性（保守力特征）
    </text>

    <!-- 几何示意图 -->
    <g transform="translate(15, 34)">
      <!-- 高度 h1 水平虚线 -->
      <line x1="10" y1="20" x2="230" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="235" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">高度 h₁ (E_p1)</text>

      <!-- 高度 h2 水平虚线 (参考面) -->
      <line x1="10" y1="110" x2="230" y2="110" stroke="#334155" stroke-width="2"/>
      <text x="235" y="114" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">高度 h₂ (E_p2)</text>

      <!-- 路径 1: 竖直落体 (红色直线) -->
      <line x1="45" y1="20" x2="45" y2="105" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-b-pe)"/>
      <circle cx="45" cy="20" r="4.5" fill="#dc2626"/>
      <text x="50" y="65" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#dc2626">①自由落体</text>

      <!-- 路径 2: 沿斜面下滑 (绿色折线) -->
      <line x1="115" y1="20" x2="160" y2="105" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-b-pe)"/>
      <circle cx="115" cy="20" r="4.5" fill="#059669"/>
      <text x="140" y="65" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#059669">②斜面</text>

      <!-- 路径 3: 任意曲折蜿蜒曲线 (蓝色曲线) -->
      <path d="M 190,20 Q 220,50 195,75 T 205,105" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <circle cx="190" cy="20" r="4.5" fill="#2563eb"/>
      <text x="195" y="55" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb">③任意曲线</text>
    </g>

    <!-- 结论卡片 -->
    <rect x="12" y="165" width="336" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">✦ 重力做功铁律：W_G = mg(h₁ - h₂) = -ΔE_p</text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 重力做功仅取决于始末位置高度差，与路径曲直完全无关！</text>
    <text x="20" y="225" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 重力做正功 ⇒ 重力势能减少；克服重力做功 ⇒ 势能增加</text>
    <text x="20" y="243" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">• 零势能面选取具有相对性，但势能差 ΔE_p 具有绝对确定性</text>
  </g>

  <!-- ==================== 右侧：弹性势能 F-x 面积积分 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 弹簧胡克定律与弹性势能微积分图像
    </text>

    <!-- F-x 坐标系与三角形面积 -->
    <g transform="translate(30, 35)">
      <!-- 坐标轴 -->
      <line x1="20" y1="95" x2="280" y2="95" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b-pe)"/>
      <line x1="30" y1="105" x2="30" y2="15" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b-pe)"/>
      <text x="285" y="99" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">x (形变量)</text>
      <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">F</text>

      <!-- 三角形阴影积分面积 -->
      <polygon points="30,95 210,95 210,30" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
      <text x="135" y="80" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#9a3412" text-anchor="middle">
        面积 = ½ k x²
      </text>

      <!-- F = kx 直线 -->
      <line x1="30" y1="95" x2="225" y2="25" stroke="#ea580c" stroke-width="2.5"/>
      <text x="230" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ea580c">F = kx</text>

      <!-- 形变量标注 x -->
      <line x1="210" y1="95" x2="210" y2="105" stroke="#334155" stroke-width="1.5"/>
      <text x="208" y="118" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">x</text>

      <!-- 最大弹力 kx -->
      <line x1="30" y1="30" x2="210" y2="30" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="5" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ea580c">kx</text>
    </g>

    <!-- 公式结论卡片 -->
    <rect x="12" y="165" width="336" height="92" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ea580c">
      ✦ 弹性势能微积分推导：E_p = ∫₀ˣ kx dx = ½ k x²
    </text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 弹力做功与弹性势能转化：W_弹 = - ΔE_p</text>
    <text x="20" y="225" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 弹簧压缩或拉伸形变量相同时，储存的弹性势能严格相同！</text>
    <text x="20" y="243" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">• 势能只取决于形变量 x 与劲度系数 k，原长位置势能为零</text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    势能核心真谛：保守内力做功等于势能减少量；重力做功看高差，弹力做功看 F-x 图像面积 ½kx²！
  </text>
</svg>
