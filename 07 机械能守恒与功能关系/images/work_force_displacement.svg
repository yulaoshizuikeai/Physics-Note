<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="360">
  <defs>
    <marker id="w-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="w-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">功的几何定义与 F-x 图像面积积分物理意义</text>

  <!-- Left: Work Definition W = F s cos theta -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="280" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="140" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">恒力做功 W = F · s · cosθ</text>
    
    <!-- Displacement vector s -->
    <line x1="40" y1="160" x2="240" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#w-arr)"/>
    <text x="245" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">位移 s</text>
    
    <!-- Force vector F -->
    <line x1="40" y1="160" x2="180" y2="80" stroke="#2563eb" stroke-width="3" marker-end="url(#w-arr)"/>
    <text x="185" y="78" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">恒力 F</text>
    
    <!-- Angle theta -->
    <path d="M 90 160 A 50 50 0 0 0 82 136" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="96" y="148" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">θ</text>
    
    <text x="140" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">θ &lt; 90°: 做正功 (动力) | θ &gt; 90°: 做负功 (阻力)</text>
  </g>

  <!-- Right: F-x Area Integration -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="300" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="150" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">F-x 图像面积 = 功 W (积分微元法)</text>
    
    <!-- Axes -->
    <line x1="40" y1="180" x2="270" y2="180" stroke="#334155" stroke-width="2"/>
    <text x="275" y="185" font-family="system-ui, sans-serif" font-size="12" fill="#334155">x</text>
    <line x1="40" y1="180" x2="40" y2="50" stroke="#334155" stroke-width="2"/>
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#334155">F</text>
    
    <!-- Shaded area under curve -->
    <path d="M 70 180 L 70 90 Q 150 70 230 130 L 230 180 Z" fill="#bfdbfe" opacity="0.6"/>
    <path d="M 70 90 Q 150 70 230 130" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    
    <text x="140" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">面积 = ∫ F dx = W</text>
    <text x="70" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">x_1</text>
    <text x="230" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">x_2</text>
  </g>

  <!-- Bottom Tip -->
  <rect x="60" y="310" width="640" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="333" font-family="system-ui, sans-serif" font-size="12.5" fill="#1e40af">功是标量但有正负：正功表示为质点注入动能，负功（克服阻力做功）表示从质点夺走能量。</text>
</svg>