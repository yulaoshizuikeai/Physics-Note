<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="360">
  <defs>
    <marker id="f-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="f-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">摩擦力做功与相对位移生热机制 (Q = f · Δx_相对)</text>

  <!-- Left: Static Friction (No heat) -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">静摩擦力做功 (机械能内部转移)</text>
    
    <!-- Block on board -->
    <rect x="40" y="110" width="180" height="30" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <rect x="90" y="70" width="80" height="40" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <text x="130" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">m</text>
    <text x="130" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">M</text>

    <text x="145" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">相对静止：Δx_相对 = 0</text>
    <text x="145" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">一对静摩擦力总功 W_总 = 0</text>
    <text x="145" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">绝无机械能损失，绝不产生内能！</text>
  </g>

  <!-- Right: Kinetic Friction (Heat Q = f · delta x) -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">滑动摩擦力做功 (机械能耗散生热)</text>

    <!-- Block slipping on board -->
    <rect x="30" y="110" width="210" height="30" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <rect x="140" y="70" width="70" height="40" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
    <text x="175" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">m</text>
    <text x="90" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">M</text>

    <!-- Relative slip delta x -->
    <line x1="50" y1="160" x2="140" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#f-arr)"/>
    <text x="95" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#dc2626">划痕 Δx_相对</text>

    <text x="145" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">系统损失机械能 = 摩擦生热 Q</text>
    <text x="145" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Q = F_f · Δx_相对 = F_f · (x_滑块 - x_木板)</text>
  </g>

  <rect x="60" y="310" width="640" height="35" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="75" y="333" font-family="system-ui, sans-serif" font-size="12.5" fill="#c2410c">对地功计算：求单个物块位移用对地位移 s_地；求系统摩擦生热 Q 必须用两者相对位移（相对划痕长度）！</text>
</svg>