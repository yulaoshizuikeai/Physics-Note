<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="380">
  <defs>
    <marker id="c-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">机车启动的两大动力学过程对比 (P-t 与 v-t 图像全解)</text>

  <!-- Left: Constant Acceleration Start -->
  <g transform="translate(50, 55)">
    <rect x="0" y="0" width="310" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="155" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">模式一：恒定加速度启动 (a 恒定)</text>
    
    <!-- v-t axes -->
    <line x1="40" y1="180" x2="280" y2="180" stroke="#334155" stroke-width="1.5"/>
    <text x="285" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#334155">t</text>
    <line x1="40" y1="180" x2="40" y2="40" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#334155">v</text>

    <!-- Stage 1: Straight line up to t1, v1 -->
    <line x1="40" y1="180" x2="130" y2="100" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Stage 2: Curved to vm -->
    <path d="M 130 100 Q 180 70 260 65" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    
    <!-- Dashes -->
    <line x1="130" y1="180" x2="130" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="130" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">t_1 (P=P_额)</text>
    <line x1="40" y1="100" x2="130" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="25" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">v_1</text>
    <line x1="40" y1="65" x2="260" y2="65" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">v_m</text>

    <text x="155" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">① 0~t1: F - f = ma, P = F·at 线性增大</text>
    <text x="155" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">② t&gt;t1: P恒定, a渐小; 最终 v_m = P_额 / f</text>
  </g>

  <!-- Right: Constant Power Start -->
  <g transform="translate(400, 55)">
    <rect x="0" y="0" width="310" height="260" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="155" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">模式二：恒定额定功率启动 (P=P_额 恒定)</text>

    <!-- v-t axes -->
    <line x1="40" y1="180" x2="280" y2="180" stroke="#334155" stroke-width="1.5"/>
    <text x="285" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#334155">t</text>
    <line x1="40" y1="180" x2="40" y2="40" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#334155">v</text>

    <!-- Single smooth curve from origin to vm -->
    <path d="M 40 180 Q 90 85 260 65" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="40" y1="65" x2="260" y2="65" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">v_m</text>

    <text x="155" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">全程 P = P_额 恒定，牵引力 F = P/v 随速度增大而减小</text>
    <text x="155" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">a = (P/v - f)/m 做减速度运动，最终 v_m = P_额 / f</text>
  </g>

  <rect x="50" y="330" width="660" height="36" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="65" y="353" font-family="system-ui, sans-serif" font-size="12.5" fill="#b91c1c">变加速阶段求位移或时间核心：动能定理 P·t - f·x = ½mv_m² - ½mv_0²，严禁套用匀变速公式！</text>
</svg>