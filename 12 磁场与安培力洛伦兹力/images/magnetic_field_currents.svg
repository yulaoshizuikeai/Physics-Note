<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">常见电流的磁场与右手螺旋安培定则</text>

  <!-- 直导线电流 -->
  <g transform="translate(40, 50)">
    <rect width="200" height="200" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">直线电流的磁场</text>
    <line x1="100" y1="40" x2="100" y2="180" stroke="#fbbf24" stroke-width="6"/>
    <text x="115" y="55" fill="#fbbf24" font-size="12" font-weight="bold">I (电流向上)</text>
    <ellipse cx="100" cy="110" rx="60" ry="25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
    <ellipse cx="100" cy="110" rx="35" ry="15" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="100,85 108,82 108,88" fill="#38bdf8"/>
    <text x="100" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle">大拇指指电流 I</text>
    <text x="100" y="175" fill="#cbd5e1" font-size="11" text-anchor="middle">四指弯曲环绕指磁感线 B</text>
  </g>

  <!-- 环形电流 -->
  <g transform="translate(280, 50)">
    <rect width="200" height="200" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="25" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">环形电流的磁场</text>
    <ellipse cx="100" cy="110" rx="60" ry="25" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <text x="100" y="90" fill="#fbbf24" font-size="11" text-anchor="middle">环形电流 I</text>
    <line x1="100" y1="180" x2="100" y2="40" stroke="#4ade80" stroke-width="2.5"/>
    <polygon points="100,35 95,47 105,47" fill="#4ade80"/>
    <text x="115" y="45" fill="#4ade80" font-size="12" font-weight="bold">B (中心轴)</text>
    <text x="100" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle">四指弯曲指电流 I 环向</text>
    <text x="100" y="175" fill="#cbd5e1" font-size="11" text-anchor="middle">大拇指指向中心磁感线 B</text>
  </g>

  <!-- 通电螺线管 -->
  <g transform="translate(520, 50)">
    <rect width="200" height="200" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="25" fill="#f472b6" font-size="13" font-weight="bold" text-anchor="middle">通电螺线管 (等效条形磁铁)</text>
    <!-- 内部穿过 -->
    <line x1="20" y1="110" x2="180" y2="110" stroke="#f472b6" stroke-width="2.5"/>
    <polygon points="185,110 173,105 173,115" fill="#f472b6"/>
    <rect x="40" y="80" width="120" height="60" rx="6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="25" y="130" fill="#94a3b8" font-size="12" font-weight="bold">S极</text>
    <text x="165" y="130" fill="#f43f5e" font-size="12" font-weight="bold">N极</text>
    <text x="100" y="160" fill="#cbd5e1" font-size="11" text-anchor="middle">内部磁感线从 S 指向 N</text>
    <text x="100" y="180" fill="#cbd5e1" font-size="11" text-anchor="middle">四指弯曲握螺线管指电流</text>
  </g>
</svg>