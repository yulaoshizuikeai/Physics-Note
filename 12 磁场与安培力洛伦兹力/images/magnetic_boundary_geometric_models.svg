<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">带电粒子穿过磁场三大几何临界模型</text>

  <!-- 1. 直线单边界对称模型 -->
  <g transform="translate(30, 45)">
    <rect width="215" height="215" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="107" y="22" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">直线单边界（进出对称）</text>
    <!-- 边界线 -->
    <line x1="20" y1="130" x2="195" y2="130" stroke="#64748b" stroke-width="2"/>
    <text x="160" y="125" fill="#94a3b8" font-size="10">边界线</text>
    <!-- 磁场区域 (下方) -->
    <g fill="#475569" font-size="11"><text x="40" y="160">×</text><text x="90" y="160">×</text><text x="140" y="160">×</text></g>
    <!-- 轨迹圆弧 -->
    <path d="M 60 130 A 50 50 0 0 0 160 130" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <polygon points="62,130 55,140 68,140" fill="#4ade80"/>
    <polygon points="160,130 152,118 165,118" fill="#4ade80"/>
    <text x="107" y="185" fill="#cbd5e1" font-size="10.5" text-anchor="middle">入射角 α = 出射角 α</text>
    <text x="107" y="202" fill="#f472b6" font-size="11" font-weight="bold" text-anchor="middle">偏转角 θ = 2α</text>
  </g>

  <!-- 2. 平行双边界（穿越临界） -->
  <g transform="translate(270, 45)">
    <rect width="220" height="215" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.2"/>
    <text x="110" y="22" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">平行双边界 (厚度 d)</text>
    <line x1="20" y1="80" x2="200" y2="80" stroke="#64748b" stroke-width="1.5"/>
    <line x1="20" y1="150" x2="200" y2="150" stroke="#64748b" stroke-width="1.5"/>
    <text x="175" y="118" fill="#94a3b8" font-size="10">宽度 d</text>
    <!-- 临界不穿出轨迹 -->
    <path d="M 40 150 A 65 65 0 0 1 105 85" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
    <polygon points="105,85 93,82 100,92" fill="#f43f5e"/>
    <text x="110" y="185" fill="#cbd5e1" font-size="10.5" text-anchor="middle">临界恰不穿出：</text>
    <text x="110" y="202" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">R(1 - cosθ) ≤ d</text>
  </g>

  <!-- 3. 圆形磁场（径向对称） -->
  <g transform="translate(515, 45)">
    <rect width="215" height="215" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="107" y="22" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">圆形磁场区域 (半径 r)</text>
    <!-- 磁场圆 -->
    <circle cx="107" cy="110" r="45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="107" cy="110" r="2" fill="#38bdf8"/>
    <!-- 沿半径射入 -->
    <line x1="30" y1="110" x2="62" y2="110" stroke="#4ade80" stroke-width="2"/>
    <polygon points="62,110 52,106 52,114" fill="#4ade80"/>
    <!-- 偏转圆弧并在沿出射半径射出 -->
    <path d="M 62 110 A 55 55 0 0 1 115 65" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="115" y1="65" x2="145" y2="40" stroke="#4ade80" stroke-width="2"/>
    <polygon points="145,40 134,44 140,52" fill="#4ade80"/>
    <text x="107" y="185" fill="#cbd5e1" font-size="10.5" text-anchor="middle">沿半径射入必然沿半径射出！</text>
    <text x="107" y="202" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">偏转角 tan(θ/2) = r / R</text>
  </g>
</svg>