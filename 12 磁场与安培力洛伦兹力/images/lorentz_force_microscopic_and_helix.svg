<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-lf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r-lf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g-lf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    洛伦兹力微观推导本质与空间运动模型（左手定则 · 螺旋线轨迹）
  </text>

  <!-- ==================== 左侧：微观导出宏观安培力 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 安培力的微观本质：F_安 = N · f_洛
    </text>

    <!-- 导线截面模型 -->
    <g transform="translate(25, 34)">
      <!-- 导线柱体 -->
      <rect x="20" y="20" width="260" height="60" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
      <ellipse cx="20" cy="50" rx="12" ry="30" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <ellipse cx="280" cy="50" rx="12" ry="30" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <text x="20" y="54" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#475569" text-anchor="middle">S</text>
      <text x="150" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">长度 L，体积 V = SL</text>

      <!-- 磁场方向 (垂直纸面向里 ⊗) -->
      <text x="50" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">⊗</text>
      <text x="150" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">⊗</text>
      <text x="250" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">⊗ B</text>

      <!-- 内部定向移动电荷与受力 -->
      <g transform="translate(90, 50)">
        <circle cx="0" cy="0" r="7" fill="#ef4444"/>
        <text x="0" y="3" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">q</text>
        <line x1="7" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b-lf)"/>
        <text x="35" y="4" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb">v</text>
        <line x1="0" y1="-7" x2="0" y2="-26" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r-lf)"/>
        <text x="5" y="-18" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">f_洛</text>
      </g>

      <g transform="translate(190, 50)">
        <circle cx="0" cy="0" r="7" fill="#ef4444"/>
        <text x="0" y="3" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">q</text>
        <line x1="7" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b-lf)"/>
        <line x1="0" y1="-7" x2="0" y2="-26" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r-lf)"/>
      </g>
    </g>

    <!-- 推导卡片 -->
    <rect x="12" y="145" width="336" height="112" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">• 宏观电流强度：I = n q S v</text>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">• 安培力总和：F_安 = B I L = B (n q S v) L = (nSL) · (qvB)</text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">✦ 单个粒子洛伦兹力：f = F_安 / N = q v B  (v ⟂ B)</text>
    <text x="20" y="225" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#059669">✦ 洛伦兹力做功公理：f ⟂ v 恒成立  ⇒  W_洛 ≡ 0 永不做功！</text>
    <text x="20" y="244" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">洛伦兹力只改变粒子速度方向，绝不改变动能大小！</text>
  </g>

  <!-- ==================== 右侧：左手定则与螺旋运动 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 左手定则正负电荷规范与螺旋线运动
    </text>

    <!-- 螺旋线轨迹示意 -->
    <g transform="translate(25, 36)">
      <!-- 磁场方向 (水平向右) -->
      <line x1="10" y1="20" x2="300" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-b-lf)"/>
      <line x1="10" y1="95" x2="300" y2="95" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-b-lf)"/>
      <text x="305" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748b">B</text>

      <!-- 螺旋线 -->
      <path d="M 40,55 C 40,25 70,25 70,55 C 70,85 100,85 100,55 C 100,25 130,25 130,55 C 130,85 160,85 160,55 C 160,25 190,25 190,55 C 190,85 220,85 220,55" fill="none" stroke="#2563eb" stroke-width="2.2"/>

      <!-- 粒子斜射速度分解 -->
      <circle cx="40" cy="55" r="5.5" fill="#f59e0b"/>
      <line x1="40" y1="55" x2="70" y2="35" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r-lf)"/>
      <text x="75" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">v</text>

      <!-- 螺距 h 标注 -->
      <line x1="100" y1="55" x2="160" y2="55" stroke="#059669" stroke-width="1.8"/>
      <line x1="100" y1="50" x2="100" y2="60" stroke="#059669" stroke-width="1.8"/>
      <line x1="160" y1="50" x2="160" y2="60" stroke="#059669" stroke-width="1.8"/>
      <text x="130" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">螺距 h</text>
    </g>

    <!-- 卡片说明 -->
    <rect x="12" y="145" width="336" height="112" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">✦ 左手定则核心陷阱：</text>
    <text x="20" y="183" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold" fill="#2563eb">正电荷</tspan>：四指直接指向运动方向 v</text>
    <text x="20" y="201" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">• <tspan font-weight="bold">负电荷</tspan>：四指必须指向运动<tspan font-weight="bold">反方向</tspan>（或判出后反向）！</text>
    <text x="20" y="221" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#059669">✦ 斜向射入分解运动模型：</text>
    <text x="20" y="240" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">平行分量 v_∥ 匀速直线 + 垂直分量 v_⊥ 匀速圆周 ⇒ 空间螺旋线！</text>
    <text x="20" y="252" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">螺距：h = v_∥ · T = (v cos α) · (2πm / qB)</text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    洛伦兹力终极法则：永不做功动能恒定；左手定则负电反指，斜射正交分解化作螺旋线！
  </text>
</svg>
