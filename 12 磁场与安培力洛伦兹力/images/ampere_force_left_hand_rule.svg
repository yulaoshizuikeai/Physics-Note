<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">安培力左手定则与导线弯曲“等效长度”物理模型</text>

  <!-- 左手定则示意 -->
  <g transform="translate(40, 50)">
    <rect width="320" height="225" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="160" y="25" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">左手定则空间几何方位</text>
    
    <!-- 磁场 -->
    <g fill="#94a3b8" font-size="16">
      <text x="50" y="60">⊗ B</text><text x="120" y="60">⊗ B</text><text x="190" y="60">⊗ B</text><text x="260" y="60">⊗ B</text>
      <text x="50" y="110">⊗ B</text><text x="120" y="110">⊗ B</text><text x="190" y="110">⊗ B</text><text x="260" y="110">⊗ B</text>
    </g>

    <!-- 导线 -->
    <line x1="50" y1="130" x2="270" y2="130" stroke="#fbbf24" stroke-width="5"/>
    <polygon points="275,130 263,124 263,136" fill="#fbbf24"/>
    <text x="230" y="150" fill="#fbbf24" font-size="12" font-weight="bold">电流 I</text>

    <!-- 安培力 -->
    <line x1="160" y1="130" x2="160" y2="65" stroke="#f43f5e" stroke-width="3.5"/>
    <polygon points="160,58 154,70 166,70" fill="#f43f5e"/>
    <text x="175" y="75" fill="#f43f5e" font-size="14" font-weight="bold">F_安</text>

    <text x="20" y="180" fill="#cbd5e1" font-size="11.5">• 磁感线垂直穿入手心 (B 垂直纸面向里)</text>
    <text x="20" y="198" fill="#cbd5e1" font-size="11.5">• 四指指向电流流动方向 I</text>
    <text x="20" y="216" fill="#38bdf8" font-size="11.5" font-weight="bold">• 大拇指垂直指向安培力方向 F_安 = BIL</text>
  </g>

  <!-- 等效长度模型 -->
  <g transform="translate(400, 50)">
    <rect width="320" height="225" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="160" y="25" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">任意弯曲导线安培力：等效直线法</text>

    <!-- 弯曲导线 -->
    <path d="M 40 130 C 80 70, 120 180, 170 90 S 240 160, 270 130" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
    <circle cx="40" cy="130" r="4" fill="#38bdf8"/>
    <text x="30" y="150" fill="#38bdf8" font-size="12" font-weight="bold">始端 a</text>
    <circle cx="270" cy="130" r="4" fill="#38bdf8"/>
    <text x="260" y="150" fill="#38bdf8" font-size="12" font-weight="bold">末端 b</text>

    <!-- 等效直线 (弦) -->
    <line x1="40" y1="130" x2="270" y2="130" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="155" y="148" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">等效直导线 L_有效 = |ab|</text>

    <text x="20" y="180" fill="#cbd5e1" font-size="11.5">• 匀强磁场中，任意弯曲导线受到的安培力，</text>
    <text x="20" y="198" fill="#cbd5e1" font-size="11.5">  等效于连接两端点的直导线所受安培力：</text>
    <text x="160" y="218" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">F = B · I · L_有效</text>
  </g>
</svg>