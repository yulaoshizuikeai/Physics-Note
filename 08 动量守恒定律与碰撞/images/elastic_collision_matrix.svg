<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="380">
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">一维弹性碰撞速度解与三大极限特例 (恢复系数 e = 1)</text>

  <!-- Formula Box -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="640" height="75" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="320" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">完全弹性碰撞解析解矩阵 (联立动量守恒与动能守恒推导)</text>
    <text x="320" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1d4ed8">v_1' = [(m1 - m2)v1 + 2m2 v2] / (m1 + m2)</text>
    <text x="320" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1d4ed8">v_2' = [(m2 - m1)v2 + 2m1 v1] / (m1 + m2)    (相对接近速度 = 相对分离速度: v1 - v2 = v2' - v1')</text>
  </g>

  <!-- 3 Cases -->
  <!-- Case 1: m1 = m2 (Velocity swap) -->
  <g transform="translate(60, 135)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">特例一：质量相等</text>
    <text x="100" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb">m_1 = m_2</text>
    
    <rect x="30" y="60" width="140" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">v_1' = v_2</text>
    <text x="100" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">v_2' = v_1</text>

    <text x="100" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">“速度完全对调”</text>
    <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">如桌球对心相碰、牛顿摆</text>
  </g>

  <!-- Case 2: m1 >> m2 (Heavy hits light) -->
  <g transform="translate(280, 135)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">特例二：大球撞静止小球</text>
    <text x="100" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb">m_1 ≫ m_2, v_2 = 0</text>
    
    <rect x="30" y="60" width="140" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">v_1' ≈ v_1</text>
    <text x="100" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">v_2' ≈ 2 v_1</text>

    <text x="100" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">“大球速度几乎不变”</text>
    <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">小球以 2 倍速度飞出</text>
  </g>

  <!-- Case 3: m1 << m2 (Light hits heavy) -->
  <g transform="translate(500, 135)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">特例三：小球撞静止大球</text>
    <text x="100" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb">m_1 ≪ m_2, v_2 = 0</text>
    
    <rect x="30" y="60" width="140" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="100" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">v_1' ≈ - v_1</text>
    <text x="100" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">v_2' ≈ 0</text>

    <text x="100" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">“小球原速反弹”</text>
    <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">如皮球撞击坚硬水泥地面</text>
  </g>

  <!-- Bottom rule -->
  <rect x="60" y="330" width="640" height="35" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
  <text x="75" y="353" font-family="system-ui, sans-serif" font-size="12" fill="#854d0e">碰撞三原则判据：① 动量必须守恒；② 动能不可自发增加 (E_k末 ≤ E_k初)；③ 运动合理性 (碰撞后后面物体速度不能大于前面)。</text>
</svg>