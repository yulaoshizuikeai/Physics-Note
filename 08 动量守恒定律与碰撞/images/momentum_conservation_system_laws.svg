<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    系统动量守恒定律三大适用层级与条件判定体系
  </text>

  <!-- 3 列卡片布局 -->
  <!-- 第 1 列: 严格守恒 -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="235" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="235" height="26" rx="6" fill="#eff6ff"/>
    <text x="117" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      层级一：理想绝对守恒
    </text>

    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="205" height="42" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">判据：∑ F_外 = 0</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="9.5" fill="#3b82f6">系统不受外力或合外力为零</text>
    </g>

    <!-- 图解 -->
    <g transform="translate(20, 88)">
      <circle cx="50" cy="35" r="16" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
      <text x="50" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">m₁</text>
      <circle cx="130" cy="35" r="16" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="130" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9a3412" text-anchor="middle">m₂</text>
      <!-- 光滑底面 -->
      <line x1="15" y1="55" x2="165" y2="55" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- 描述 -->
    <rect x="12" y="160" width="211" height="96" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="10" y="180" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">• 冰面互推、光滑面弹簧</text>
    <text x="10" y="198" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 外力重力与支持力严格抵消</text>
    <text x="10" y="216" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 内力冲量代数和为零：</text>
    <text x="10" y="234" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#dc2626">  ∑ p_初 = ∑ p_末</text>
  </g>

  <!-- 第 2 列: 近似守恒 -->
  <g transform="translate(272, 54)">
    <rect x="0" y="0" width="235" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="235" height="26" rx="6" fill="#fef2f2"/>
    <text x="117" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      层级二：内力远大于外力
    </text>

    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="205" height="42" rx="4" fill="#fef2f2" stroke="#fecaca"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">判据：F_内 ≫ F_外</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="9.5" fill="#dc2626">相互作用时间极短 Δt → 0</text>
    </g>

    <!-- 图解: 碰撞/爆炸 -->
    <g transform="translate(20, 88)">
      <circle cx="90" cy="35" r="18" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
      <text x="90" y="39" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">💥 碰撞</text>
      <!-- 极短冲量箭头 -->
      <line x1="30" y1="35" x2="65" y2="35" stroke="#2563eb" stroke-width="2"/>
      <line x1="150" y1="35" x2="115" y2="35" stroke="#ea580c" stroke-width="2"/>
    </g>

    <!-- 描述 -->
    <rect x="12" y="160" width="211" height="96" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="10" y="180" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">• 子弹射木块、空中爆炸</text>
    <text x="10" y="198" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 碰撞瞬间内力冲量起支配地位</text>
    <text x="10" y="216" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 外力重力冲量 I_G = mgΔt 极小</text>
    <text x="10" y="234" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">• 瞬间动量近似严格守恒！</text>
  </g>

  <!-- 第 3 列: 分方向守恒 -->
  <g transform="translate(525, 54)">
    <rect x="0" y="0" width="235" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="235" height="26" rx="6" fill="#f0fdf4"/>
    <text x="117" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">
      层级三：分方向分动量守恒
    </text>

    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="205" height="42" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#166534">判据：∑ F_外x = 0</text>
      <text x="10" y="34" font-family="system-ui, sans-serif" font-size="9.5" fill="#059669">单方向无外力，该方向守恒</text>
    </g>

    <!-- 图解: 曲面小车 -->
    <g transform="translate(20, 88)">
      <!-- 小车 -->
      <rect x="40" y="25" width="110" height="30" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="95" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#9a3412" text-anchor="middle">小车 M</text>
      <!-- 小球沿曲面滑下 -->
      <path d="M 40,25 Q 40,55 70,55" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="40" cy="25" r="5" fill="#2563eb"/>
      <!-- 地面 -->
      <line x1="20" y1="58" x2="165" y2="58" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- 描述 -->
    <rect x="12" y="160" width="211" height="96" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="10" y="180" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#15803d">• 竖直方向动量不守恒</text>
    <text x="10" y="198" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• 水平方向合外力恒为零</text>
    <text x="10" y="216" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#059669">✦ 水平动量恒守恒：</text>
    <text x="10" y="234" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">  m v_x - M V_x = 0</text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    动量守恒三大判据：合外力零全守恒，碰撞瞬间内力冲量极速称霸，分向无外力单轴独立守恒！
  </text>
</svg>
