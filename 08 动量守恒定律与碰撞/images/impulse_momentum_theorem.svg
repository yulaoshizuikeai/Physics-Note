<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="360">
  <defs>
    <marker id="i-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">冲量概念、动量定理与缓冲物理机制 (F_平均 · Δt = Δp)</text>

  <!-- Left: F-t graph area = Impulse I -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">F-t 图像面积 = 冲量 I (力对时间的积分)</text>
    
    <!-- Axes -->
    <line x1="40" y1="180" x2="260" y2="180" stroke="#334155" stroke-width="1.5"/>
    <text x="265" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#334155">t</text>
    <line x1="40" y1="180" x2="40" y2="40" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#334155">F</text>

    <!-- Bell curve for collision force -->
    <path d="M 60 180 Q 140 30 220 180 Z" fill="#bfdbfe" opacity="0.6"/>
    <path d="M 60 180 Q 140 30 220 180" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    
    <text x="140" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">面积 = ∫ F dt = I = Δp</text>
    <text x="60" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">t_1</text>
    <text x="220" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">t_2</text>
    
    <text x="145" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">碰撞中最大瞬时冲力远大于平均冲力</text>
  </g>

  <!-- Right: Buffer mechanism comparison -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="290" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="145" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">动量变化量相同时的缓冲机制</text>

    <!-- Case A: Hard ground (short dt, large F) -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="250" height="65" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">硬地面 / 刚性碰撞：</text>
      <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">作用时间 Δt 极短 ──> 冲击力 F_平均 极大 (粉碎性破坏)</text>
    </g>

    <!-- Case B: Sponge / Airbag (long dt, small F) -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="250" height="75" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803d">气囊 / 海绵垫 / 屈膝缓冲：</text>
      <text x="10" y="42" font-family="system-ui, sans-serif" font-size="11.5" fill="#14532d">显著拉长作用时间 Δt ──> 冲击力 F_平均 骤降</text>
      <text x="10" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">F = Δp / Δt (保护人体与精密仪器)</text>
    </g>
  </g>

  <!-- Bottom alert -->
  <rect x="60" y="310" width="640" height="35" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="333" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">矢量性铁律：列动量定理方程 I_合 = m v_末 - m v_初 前，必须先规定一维正方向！</text>
</svg>