<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="100%">
  <defs>
    <marker id="arr-blue-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-emerald-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 背景底板 -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="14" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    生活中的圆周运动三大经典物理模型与动力学判据
  </text>

  <!-- ==================== 左列：铁路弯道倾角补偿 ==================== -->
  <g transform="translate(20, 58)">
    <rect x="0" y="0" width="240" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="26" rx="6" fill="#eff6ff"/>
    <text x="120" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      1. 铁路/公路倾斜弯道
    </text>

    <!-- 倾斜路基与钢轨 (倾角约 18 度) -->
    <!-- 地基三角形 -->
    <polygon points="20,135 220,75 220,135" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="15" y1="135" x2="225" y2="135" stroke="#334155" stroke-width="2"/>
    <!-- 倾角 θ -->
    <path d="M 60,135 A 40,40 0 0,1 56,123" fill="none" stroke="#d97706" stroke-width="1.8"/>
    <text x="65" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">θ</text>

    <!-- 车体倾斜矩形 -->
    <g transform="translate(100, 100) rotate(-16.7)">
      <rect x="-35" y="-30" width="70" height="30" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.8"/>
      <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">火车 m</text>
    </g>

    <!-- 受力分析点 (质心位于 105, 88) -->
    <circle cx="105" cy="85" r="3.5" fill="#1e293b"/>
    <!-- 重力 mg -->
    <line x1="105" y1="85" x2="105" y2="132" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red-2)"/>
    <text x="110" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">mg</text>
    <!-- 支持力 FN (垂直斜面) -->
    <line x1="105" y1="85" x2="85" y2="35" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue-2)"/>
    <text x="65" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">F_N</text>
    <!-- 水平向心合力 Fn -->
    <line x1="105" y1="85" x2="45" y2="85" stroke="#059669" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arr-emerald-2)"/>
    <text x="48" y="77" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#059669">F_合 = mg tan θ</text>

    <!-- 结论便签 -->
    <rect x="8" y="148" width="224" height="78" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="14" y="166" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">安全无挤压速度：v₀ = √(gR tan θ)</text>
    <text x="14" y="186" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">• v &gt; v₀：离心倾向，外轨受向内侧压</text>
    <text x="14" y="206" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">• v &lt; v₀：近心倾向，内轨受向外侧压</text>
  </g>

  <!-- ==================== 中列：凸拱桥与凹形路面 ==================== -->
  <g transform="translate(270, 58)">
    <rect x="0" y="0" width="240" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="26" rx="6" fill="#fef2f2"/>
    <text x="120" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      2. 拱桥与凹形路面（超重/失重）
    </text>

    <!-- 上半部分：凸拱桥 -->
    <g transform="translate(0, 30)">
      <!-- 拱桥弧线 -->
      <path d="M 15,45 Q 120,5 225,45" fill="none" stroke="#64748b" stroke-width="3"/>
      <!-- 顶点小车 -->
      <rect x="105" y="15" width="30" height="14" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <circle cx="112" cy="30" r="3" fill="#334155"/>
      <circle cx="128" cy="30" r="3" fill="#334155"/>
      <!-- 最高点受力 -->
      <line x1="120" y1="20" x2="120" y2="46" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red-2)"/>
      <line x1="120" y1="20" x2="120" y2="-5" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue-2)"/>
      <text x="125" y="3" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb">F_N</text>
      <text x="125" y="44" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#dc2626">mg</text>
      <!-- 公式 -->
      <text x="15" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ea580c">凸拱桥（最高点）</text>
      <text x="15" y="60" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">F_N = mg - m(v²/R) &lt; mg <tspan font-weight="bold" fill="#ea580c">失重</tspan></text>
      <text x="15" y="74" font-family="system-ui, sans-serif" font-size="9.5" fill="#b91c1c">飞离临界速度：v_飞 = √(gR)</text>
    </g>

    <!-- 分割线 -->
    <line x1="15" y1="128" x2="225" y2="128" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 下半部分：凹形路面 -->
    <g transform="translate(0, 132)">
      <!-- 凹桥弧线 -->
      <path d="M 15,10 Q 120,50 225,10" fill="none" stroke="#64748b" stroke-width="3"/>
      <!-- 最低点小车 -->
      <rect x="105" y="32" width="30" height="14" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
      <circle cx="112" cy="47" r="3" fill="#334155"/>
      <circle cx="128" cy="47" r="3" fill="#334155"/>
      <!-- 最低点受力 -->
      <line x1="120" y1="36" x2="120" y2="60" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red-2)"/>
      <line x1="120" y1="36" x2="120" y2="5" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue-2)"/>
      <text x="125" y="12" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb">F_N</text>
      <text x="125" y="60" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#dc2626">mg</text>
      <!-- 公式 -->
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">凹形路面（最低点）</text>
      <text x="15" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">F_N = mg + m(v²/R) &gt; mg <tspan font-weight="bold" fill="#2563eb">超重</tspan></text>
      <text x="15" y="93" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">对桥面压力大，易爆胎受损</text>
    </g>
  </g>

  <!-- ==================== 右列：圆锥摆等高截面等时性 ==================== -->
  <g transform="translate(520, 58)">
    <rect x="0" y="0" width="240" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="26" rx="6" fill="#f0fdf4"/>
    <text x="120" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#15803d" text-anchor="middle">
      3. 圆锥摆模型与等时性
    </text>

    <!-- 悬点 O 与天花板 -->
    <line x1="80" y1="38" x2="160" y2="38" stroke="#334155" stroke-width="2.5"/>
    <circle cx="120" cy="38" r="3.5" fill="#334155"/>
    <text x="125" y="35" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">O</text>

    <!-- 竖直中心线 (高度 h) -->
    <line x1="120" y1="38" x2="120" y2="125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="105" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748b">h</text>

    <!-- 摆绳 L (悬挂小球) -->
    <line x1="120" y1="38" x2="185" y2="125" stroke="#475569" stroke-width="1.8"/>
    <text x="160" y="75" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">L</text>

    <!-- 夹角 θ -->
    <path d="M 120,60 A 25,25 0 0,1 129,57" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <text x="126" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309">θ</text>

    <!-- 水平圆轨迹椭圆 -->
    <ellipse cx="120" cy="125" rx="65" ry="15" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3"/>

    <!-- 小球位置 (185, 125) -->
    <circle cx="185" cy="125" r="7" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="195" y="128" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857">m</text>

    <!-- 小球受力：拉力 T 与重力 mg -->
    <line x1="185" y1="125" x2="152" y2="81" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue-2)"/>
    <text x="160" y="98" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">T</text>
    <line x1="185" y1="125" x2="185" y2="158" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red-2)"/>
    <text x="190" y="152" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">mg</text>
    <!-- 向心力虚线水平指向圆心 (120, 125) -->
    <line x1="185" y1="125" x2="125" y2="125" stroke="#059669" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arr-emerald-2)"/>
    <text x="145" y="120" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#059669">F_n</text>

    <!-- 结论便签 -->
    <rect x="8" y="165" width="224" height="60" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="14" y="183" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#15803d">运动周期：T₀ = 2π √(h / g)</text>
    <text x="14" y="201" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">• h = L cos θ（悬点到转动平面高度）</text>
    <text x="14" y="216" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#b45309">✦ 核心考点：同一水平面内转动周期严格相等</text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="298" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="318" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    向心力核心纲领：向心力不是独立性质的力，而是由重力、支持力、拉力等具体性质力合成或提供的效果力！
  </text>
</svg>
