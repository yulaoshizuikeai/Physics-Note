<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>
  
  <!-- 椭圆轨道 -->
  <ellipse cx="310" cy="140" rx="250" ry="110" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 4"/>
  
  <!-- 焦点 1: 太阳 -->
  <circle cx="210" cy="140" r="18" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="195" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">太阳</text>
  <text x="180" y="175" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">焦点 F₁</text>

  <!-- 焦点 2 -->
  <circle cx="410" cy="140" r="5" fill="#94a3b8"/>
  <text x="395" y="165" font-family="sans-serif" font-size="12" fill="#64748b">焦点 F₂</text>

  <!-- 近日点扫过扇形 S1 -->
  <path d="M 210 140 L 60 140 A 250 110 0 0 1 75 100 Z" fill="#fbbf24" opacity="0.5"/>
  <text x="95" y="130" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">面积 S₁</text>
  <circle cx="60" cy="140" r="10" fill="#3b82f6"/>
  <text x="25" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">近日点 A</text>
  <text x="25" y="155" font-family="sans-serif" font-size="12" fill="#1d4ed8">(速度最大)</text>

  <!-- 远日点扫过扇形 S2 -->
  <path d="M 210 140 L 560 140 A 250 110 0 0 0 545 180 Z" fill="#fbbf24" opacity="0.5"/>
  <text x="470" y="165" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">面积 S₂</text>
  <circle cx="560" cy="140" r="10" fill="#3b82f6"/>
  <text x="500" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">远日点 B</text>
  <text x="500" y="145" font-family="sans-serif" font-size="12" fill="#1d4ed8">(速度最小)</text>

  <!-- 定律标注框 -->
  <rect x="180" y="15" width="260" height="35" rx="6" fill="#1e293b"/>
  <text x="195" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">开普勒第二定律：相等时间 S₁ = S₂</text>
</svg>