<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-gr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    天体质量与密度测算两大黄金模型（重力代换法 · 卫星环绕动力学法）
  </text>

  <!-- ==================== 左侧：地表重力黄金代换法 ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      模型一：星球表面重力“黄金代换”法
    </text>

    <!-- 星球图形 -->
    <g transform="translate(30, 36)">
      <!-- 中心天体 (半径 R) -->
      <circle cx="100" cy="70" r="50" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
      <circle cx="100" cy="70" r="3" fill="#1e40af"/>
      <line x1="100" y1="70" x2="145" y2="95" stroke="#1e40af" stroke-width="1.5"/>
      <text x="125" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">R</text>
      <text x="100" y="54" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">天体 M</text>

      <!-- 地表物体 m (重力近似等于万有引力) -->
      <circle cx="148" cy="98" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
      <text x="160" y="102" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">m</text>

      <!-- 引力箭头 -->
      <line x1="148" y1="98" x2="120" y2="82" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-b-gr)"/>
    </g>

    <!-- 公式推导卡片 -->
    <rect x="12" y="150" width="336" height="105" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">✦ 核心物理方程与黄金代换：</text>
    <text x="20" y="193" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 地表重力近似万有引力：G Mm / R² = mg</text>
    <text x="20" y="213" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#d97706">✦ 黄金代换公式：GM = g R²</text>
    <text x="20" y="233" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 天体质量直接解：M = g R² / G</text>
    <text x="20" y="248" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">（只需已知星球半径 R 与地表重力加速度 g）</text>
  </g>

  <!-- ==================== 右侧：卫星环绕动力学法 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      模型二：卫星环绕“天球称重”法
    </text>

    <!-- 卫星环绕轨道示意 -->
    <g transform="translate(30, 36)">
      <!-- 环绕圆轨道 (半径 r) -->
      <circle cx="100" cy="65" r="68" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- 中心天体 M -->
      <circle cx="100" cy="65" r="32" fill="#93c5fd" stroke="#2563eb" stroke-width="1.8"/>
      <circle cx="100" cy="65" r="2.5" fill="#1e40af"/>
      <text x="100" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">天体 M</text>

      <!-- 卫星 m -->
      <circle cx="168" cy="65" r="5.5" fill="#dc2626"/>
      <text x="176" y="68" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">卫星 m (T)</text>

      <!-- 轨道半径标注 (从中心天体表面延伸至卫星) -->
      <line x1="132" y1="65" x2="168" y2="65" stroke="#334155" stroke-width="1.2"/>
      <text x="150" y="56" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">r</text>
    </g>

    <!-- 公式推导卡片 -->
    <rect x="12" y="145" width="336" height="112" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">✦ 万有引力提供向心力：G Mm / r² = m (2π/T)² r</text>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 天体质量：M = 4π² r³ / (G T²)</text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">• 天体平均密度：ρ = M / (4/3 π R³) = 3π r³ / (G T² R³)</text>
    <text x="20" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">
      ✦ 近地卫星极限（r ≈ R）：ρ = 3π / (G T²_近) ！
    </text>
    <text x="20" y="244" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">
      （高频压轴口诀：贴地环绕只需测周期，无需知半径即可求密度！）
    </text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    天体称重记忆铁律：地表代换看 gR²；环绕测算消去卫星质量；贴地近飞测周期，密度直达 3π/(GT²)！
  </text>
</svg>
