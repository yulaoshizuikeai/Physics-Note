<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="100%" height="100%">
  <defs>
    <marker id="arr-light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>

  <!-- 左侧：静止参考系（原时 Δτ） -->
  <rect x="30" y="25" width="250" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">1. 飞船内静止参考系 (原时 Δτ)</text>
  
  <!-- 上下反射镜 -->
  <rect x="90" y="75" width="120" height="10" fill="#94a3b8" rx="2"/>
  <rect x="90" y="205" width="120" height="10" fill="#94a3b8" rx="2"/>
  <text x="70" y="145" font-family="sans-serif" font-size="14" fill="#64748b">L</text>
  <line x1="85" y1="85" x2="85" y2="205" stroke="#94a3b8" stroke-dasharray="3 3"/>

  <!-- 光往返直线 (垂直) -->
  <line x1="150" y1="205" x2="150" y2="92" stroke="#f59e0b" stroke-width="4" marker-end="url(#arr-light)"/>
  <text x="160" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706">垂直光程 2L</text>
  <text x="65" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">原时 Δτ = 2L / c</text>

  <!-- 右侧：地面观察者（运动参考系 Δt） -->
  <rect x="305" y="25" width="285" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">2. 地面观察者看飞船 (历时 Δt)</text>

  <!-- 上下镜移动 -->
  <rect x="330" y="205" width="60" height="8" fill="#94a3b8" rx="2"/>
  <rect x="415" y="75" width="60" height="8" fill="#94a3b8" rx="2"/>
  <rect x="500" y="205" width="60" height="8" fill="#94a3b8" rx="2"/>

  <!-- 光走斜边 (几何直角三角形) -->
  <line x1="360" y1="205" x2="442" y2="87" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr-light)"/>
  <line x1="445" y1="83" x2="527" y2="201" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr-light)"/>
  <text x="365" y="130" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d97706">斜边光程 c·Δt/2</text>

  <!-- 勾股定理标注 -->
  <line x1="360" y1="205" x2="445" y2="205" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="222" font-family="sans-serif" font-size="12" fill="#2563eb">v·Δt/2</text>
  <line x1="445" y1="85" x2="445" y2="205" stroke="#64748b" stroke-dasharray="3 3"/>
  <text x="450" y="150" font-family="sans-serif" font-size="12" fill="#64748b">L</text>

  <text x="335" y="245" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Δt = Δτ / √(1 - v²/c²) &gt; Δτ (钟慢)</text>
</svg>
