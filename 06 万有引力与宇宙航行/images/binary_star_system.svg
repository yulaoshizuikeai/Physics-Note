<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>

  <!-- 质心 O -->
  <circle cx="280" cy="120" r="5" fill="#ef4444"/>
  <text x="270" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">公共质心 O</text>

  <!-- 星体 1 (m1, r1) -->
  <circle cx="160" cy="120" r="22" fill="#3b82f6"/>
  <text x="145" y="125" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">m₁</text>
  <circle cx="280" cy="120" r="120" fill="none" stroke="#93c5fd" stroke-dasharray="4 4"/>
  <line x1="160" y1="120" x2="280" y2="120" stroke="#3b82f6" stroke-width="2"/>
  <text x="205" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">r₁</text>

  <!-- 星体 2 (m2, r2) -->
  <circle cx="440" cy="120" r="14" fill="#10b981"/>
  <text x="430" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">m₂</text>
  <circle cx="280" cy="120" r="160" fill="none" stroke="#a7f3d0" stroke-dasharray="4 4"/>
  <line x1="280" y1="120" x2="440" y2="120" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669">r₂</text>

  <!-- 核心等式框 -->
  <rect x="130" y="175" width="340" height="50" rx="8" fill="#1e293b"/>
  <text x="145" y="198" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">双星特征：周期 T 相同、角速度 ω 相同</text>
  <text x="145" y="216" font-family="sans-serif" font-size="12" fill="#94a3b8">m₁ r₁ = m₂ r₂ (质量与半径成反比，质心偏向大质量星)</text>
</svg>