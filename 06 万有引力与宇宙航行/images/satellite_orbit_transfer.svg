<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>

  <!-- 地球 -->
  <circle cx="280" cy="150" r="30" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="265" y="155" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">地球</text>

  <!-- 轨道 1: 低圆轨道 -->
  <circle cx="280" cy="150" r="70" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <text x="355" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">轨道 1 (低圆轨道)</text>

  <!-- 轨道 3: 高圆轨道 -->
  <circle cx="280" cy="150" r="130" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="415" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4338ca">轨道 3 (高圆轨道)</text>

  <!-- 轨道 2: 椭圆转移轨道 -->
  <ellipse cx="280" cy="150" rx="100" ry="85" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4" transform="rotate(-30 280 150)"/>
  <text x="140" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">轨道 2 (椭圆转移轨道)</text>

  <!-- P 点变轨 (近地点点火加速) -->
  <circle cx="210" cy="150" r="7" fill="#ef4444"/>
  <text x="140" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">P 点加速点火</text>
  <text x="140" y="175" font-family="sans-serif" font-size="12" fill="#b91c1c">v₂ₚ &gt; v₁ (离心做离心运动)</text>

  <!-- Q 点变轨 (远地点点火加速) -->
  <circle cx="410" cy="150" r="7" fill="#ef4444"/>
  <text x="420" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">Q 点再次加速</text>
  <text x="420" y="190" font-family="sans-serif" font-size="12" fill="#b91c1c">v₃ &gt; v₂_Q (进入高圆轨道)</text>

  <!-- 速度大小关系全矩阵 -->
  <rect x="140" y="240" width="340" height="40" rx="6" fill="#1e293b"/>
  <text x="160" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">速度对比：v₂ₚ &gt; v₁ &gt; v₃ &gt; v₂_Q</text>
</svg>