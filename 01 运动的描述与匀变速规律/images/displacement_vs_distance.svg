<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  
  <!-- 起点与终点 -->
  <circle cx="80" cy="180" r="8" fill="#1e293b"/>
  <text x="60" y="210" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">A (初位置)</text>
  
  <circle cx="500" cy="100" r="8" fill="#1e293b"/>
  <text x="490" y="80" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">B (末位置)</text>

  <!-- 实际运动路径 (路程 s) -->
  <path d="M 80 180 C 140 40, 240 260, 360 80 S 440 180, 500 100" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="240" y="60" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ea580c">实际运动轨迹：路程 s (标量，标示路径总长度)</text>
  
  <!-- 位移矢量有向线段 (Δx) -->
  <line x1="80" y1="180" x2="494" y2="101" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="240" y="170" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">位移矢量 Δx (有向线段，由初位置 A 指向末位置 B)</text>

  <!-- 关系提示框 -->
  <rect x="140" y="225" width="320" height="38" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="160" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">大小关系：路程 s ≥ |位移 Δx|</text>
</svg>