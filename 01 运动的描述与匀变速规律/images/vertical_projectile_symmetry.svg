<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <marker id="arr-up" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-down" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- 地面 -->
  <line x1="60" y1="280" x2="540" y2="280" stroke="#334155" stroke-width="4"/>
  <text x="50" y="305" font-family="sans-serif" font-size="15" font-weight="bold" fill="#475569">地面 (h = 0)</text>

  <!-- 最高点 -->
  <circle cx="300" cy="60" r="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <text x="240" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a16207">最高点：v = 0, a = g</text>
  <line x1="120" y1="60" x2="480" y2="60" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- 上升轨迹 (左侧) -->
  <path d="M 180 280 L 180 60" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="180" y1="270" x2="180" y2="200" stroke="#2563eb" stroke-width="4" marker-end="url(#arr-up)"/>
  <text x="100" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">初速度 v₀ ↑</text>
  
  <!-- 下降轨迹 (右侧) -->
  <path d="M 420 60 L 420 280" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="420" y1="210" x2="420" y2="280" stroke="#dc2626" stroke-width="4" marker-end="url(#arr-down)"/>
  <text x="440" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">落地速度 v₀ ↓</text>

  <!-- 对称横线：中途某高度 h -->
  <line x1="140" y1="160" x2="460" y2="160" stroke="#64748b" stroke-dasharray="4 4" stroke-width="1.5"/>
  <circle cx="180" cy="160" r="6" fill="#2563eb"/>
  <circle cx="420" cy="160" r="6" fill="#dc2626"/>
  <line x1="180" y1="160" x2="180" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-up)"/>
  <text x="130" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">v₁ ↑</text>
  <line x1="420" y1="160" x2="420" y2="200" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-down)"/>
  <text x="440" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">v₁ ↓</text>

  <!-- 对称性核心总结框 -->
  <rect x="210" y="110" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="225" y="135" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">物理对称性：</text>
  <text x="225" y="160" font-family="sans-serif" font-size="13" fill="#334155">1. t(上) = t(下) = v₀/g</text>
  <text x="225" y="185" font-family="sans-serif" font-size="13" fill="#334155">2. 同一高度速率相等</text>
</svg>