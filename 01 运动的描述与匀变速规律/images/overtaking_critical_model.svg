<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="100%" height="100%">
  <defs>
    <marker id="arr-axis2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="270" x2="570" y2="270" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-axis2)"/>
  <text x="550" y="295" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">时间 t</text>
  <line x1="70" y1="270" x2="70" y2="40" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-axis2)"/>
  <text x="35" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">速度 v</text>

  <!-- 后车 A 减速线 (蓝线) -->
  <line x1="70" y1="90" x2="490" y2="250" stroke="#2563eb" stroke-width="3.5"/>
  <text x="80" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">后车 A (初速 v_A，匀减速)</text>

  <!-- 前车 B 匀速线 (橙线) -->
  <line x1="70" y1="170" x2="520" y2="170" stroke="#ea580c" stroke-width="3.5"/>
  <text x="410" y="155" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ea580c">前车 B (初速 v_B，匀速)</text>

  <!-- 速度相等交点 P (临界点) -->
  <circle cx="280" cy="170" r="7" fill="#dc2626"/>
  <text x="270" y="155" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">P (v_A = v_B 临界时刻)</text>
  <line x1="280" y1="170" x2="280" y2="270" stroke="#dc2626" stroke-dasharray="4 4" stroke-width="2"/>
  <text x="275" y="295" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">t₀</text>

  <!-- 速度差阴影面积 (相对位移) -->
  <polygon points="70,90 280,170 70,170" fill="#93c5fd" opacity="0.6"/>
  <text x="100" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">面积差 = Δx (后车相对前车追赶位移)</text>

  <!-- 临界判定总结 -->
  <rect x="330" y="60" width="260" height="75" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="345" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">临界判断：</text>
  <text x="345" y="105" font-family="sans-serif" font-size="13" fill="#b91c1c">· 若 Δx &lt; x₀：相距最近，不相撞</text>
  <text x="345" y="125" font-family="sans-serif" font-size="13" fill="#b91c1c">· 若 Δx = x₀：恰好不撞 / 恰好追上</text>
</svg>