<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="100%" height="100%">
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>
  
  <!-- 坐标轴 -->
  <line x1="60" y1="280" x2="580" y2="280" stroke="#475569" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="560" y="305" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">时间 t</text>
  
  <line x1="60" y1="280" x2="60" y2="30" stroke="#475569" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="25" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">位置 x</text>
  
  <!-- x-t 曲线 -->
  <path d="M 60 260 Q 220 250, 320 180 T 540 60" fill="none" stroke="#0284c7" stroke-width="4"/>
  <text x="470" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0284c7">x(t) 运动图线</text>

  <!-- P 点与 Q 点 -->
  <circle cx="260" cy="216" r="6" fill="#1e293b"/>
  <text x="245" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">P (t₁)</text>
  
  <circle cx="440" cy="110" r="6" fill="#1e293b"/>
  <text x="445" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Q (t₂)</text>

  <!-- 割线 PQ (平均速度) -->
  <line x1="160" y1="275" x2="520" y2="63" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="350" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">割线斜率 = 平均速度 v̄ = Δx/Δt</text>

  <!-- 切线 (瞬时速度极限) -->
  <line x1="130" y1="270" x2="400" y2="159" stroke="#dc2626" stroke-width="3"/>
  <text x="110" y="200" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">切线斜率 = 瞬时速度 v = lim(Δx/Δt)</text>
</svg>