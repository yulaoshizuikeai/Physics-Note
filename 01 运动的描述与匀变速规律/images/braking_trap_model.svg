<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <defs>
    <marker id="arr-axis3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="200" x2="540" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-axis3)"/>
  <text x="520" y="225" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">时间 t</text>
  <line x1="70" y1="200" x2="70" y2="30" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-axis3)"/>
  <text x="35" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">速度 v</text>

  <!-- 真实刹车图线 (绿色) -->
  <line x1="70" y1="70" x2="300" y2="200" stroke="#16a34a" stroke-width="4"/>
  <line x1="300" y1="200" x2="500" y2="200" stroke="#16a34a" stroke-width="5"/>
  <text x="320" y="190" font-family="sans-serif" font-size="15" font-weight="bold" fill="#16a34a">真实物理过程：速度归零后静止</text>

  <!-- 错误盲套公式虚线 (红色) -->
  <line x1="300" y1="200" x2="420" y2="265" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="380" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">盲套公式错误延伸 (倒车)</text>

  <!-- 停靠时刻 t_停 -->
  <circle cx="300" cy="200" r="6" fill="#16a34a"/>
  <text x="285" y="225" font-family="sans-serif" font-size="15" font-weight="bold" fill="#16a34a">t_停 = v₀/a</text>

  <!-- 警示框 -->
  <rect x="250" y="40" width="310" height="70" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="265" y="65" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">避坑准则：遇到刹车问题</text>
  <text x="265" y="90" font-family="sans-serif" font-size="14" fill="#991b1b">先求停靠时间！当 t &gt; t_停 时位移恒为 v₀²/(2a)</text>
</svg>