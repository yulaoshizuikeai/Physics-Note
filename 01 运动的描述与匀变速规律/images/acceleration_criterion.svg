<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- 左侧：加速运动 -->
  <rect x="25" y="20" width="260" height="200" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="45" y="55" font-family="sans-serif" font-size="18" font-weight="bold" fill="#166534">1. 加速运动 (a 与 v 同向)</text>
  
  <circle cx="70" cy="115" r="14" fill="#64748b"/>
  <!-- v 箭头 -->
  <line x1="90" y1="105" x2="200" y2="105" stroke="#2563eb" stroke-width="5" marker-end="url(#arr-blue2)"/>
  <text x="210" y="110" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">速度 v</text>
  <!-- a 箭头 -->
  <line x1="90" y1="140" x2="170" y2="140" stroke="#16a34a" stroke-width="5" marker-end="url(#arr-green)"/>
  <text x="180" y="145" font-family="sans-serif" font-size="15" font-weight="bold" fill="#16a34a">加速度 a</text>
  <text x="45" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">结论：速率增大 (无论 a 变大或变小)</text>

  <!-- 右侧：减速运动 -->
  <rect x="315" y="20" width="260" height="200" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="335" y="55" font-family="sans-serif" font-size="18" font-weight="bold" fill="#991b1b">2. 减速运动 (a 与 v 反向)</text>
  
  <circle cx="445" cy="115" r="14" fill="#64748b"/>
  <!-- v 箭头 (向右) -->
  <line x1="465" y1="105" x2="550" y2="105" stroke="#2563eb" stroke-width="5" marker-end="url(#arr-blue2)"/>
  <text x="475" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">速度 v</text>
  <!-- a 箭头 (向左) -->
  <line x1="425" y1="140" x2="355" y2="140" stroke="#dc2626" stroke-width="5" marker-end="url(#arr-red)"/>
  <text x="350" y="165" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">加速度 a</text>
  <text x="335" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">结论：速率减小 (无论 a 变大或变小)</text>
</svg>