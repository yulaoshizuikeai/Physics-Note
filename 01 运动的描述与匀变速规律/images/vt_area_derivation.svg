<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="100%" height="100%">
  <defs>
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="280" x2="560" y2="280" stroke="#475569" stroke-width="2.5" marker-end="url(#axis-arr)"/>
  <text x="540" y="305" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">时间 t</text>
  
  <line x1="80" y1="280" x2="80" y2="40" stroke="#475569" stroke-width="2.5" marker-end="url(#axis-arr)"/>
  <text x="45" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">速度 v</text>
  
  <!-- 下方矩形 S1 (v0 * t) -->
  <polygon points="80,280 80,180 440,180 440,280" fill="#bfdbfe" opacity="0.8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="235" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">矩形面积 S₁ = v₀ t</text>
  
  <!-- 上方直角三角形 S2 (1/2 * at^2) -->
  <polygon points="80,180 440,80 440,180" fill="#ddd6fe" opacity="0.85" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="220" y="150" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6d28d9">三角形面积 S₂ = ½ a t²</text>

  <!-- 速度斜线 -->
  <line x1="80" y1="180" x2="440" y2="80" stroke="#1e293b" stroke-width="4"/>
  
  <!-- 辅助虚线与标注 -->
  <line x1="80" y1="180" x2="440" y2="180" stroke="#64748b" stroke-dasharray="4 4" stroke-width="2"/>
  <line x1="440" y1="80" x2="440" y2="280" stroke="#64748b" stroke-dasharray="4 4" stroke-width="2"/>

  <!-- 关键数值标注 -->
  <text x="45" y="185" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">v₀</text>
  <text x="45" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">v</text>
  <text x="435" y="305" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">t</text>
  
  <!-- 三角形右侧高标注 -->
  <line x1="455" y1="80" x2="455" y2="180" stroke="#7c3aed" stroke-width="2"/>
  <text x="465" y="135" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">Δv = at</text>

  <!-- 核心公式框 -->
  <rect x="140" y="10" width="340" height="42" rx="8" fill="#1e293b"/>
  <text x="160" y="37" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">总位移 x = S₁ + S₂ = v₀t + ½ at²</text>
</svg>