<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" height="100%">
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="10"/>

  <!-- 光滑木制斜面 -->
  <polygon points="60,200 480,200 480,70" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <text x="320" y="225" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7c2d12">倾斜铜槽斜面（小倾角 θ）</text>

  <!-- 小球沿斜面滚下 -->
  <circle cx="430" cy="85" r="16" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <line x1="415" y1="90" x2="355" y2="108" stroke="#2563eb" stroke-width="4" marker-end="url(#arr-g)"/>
  <text x="290" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">a = g sin θ</text>

  <!-- 水钟滴水计时概念 -->
  <rect x="510" y="70" width="80" height="130" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="525" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1">水钟</text>
  <text x="520" y="125" font-family="sans-serif" font-size="12" fill="#0284c7">称量水重</text>
  <text x="520" y="145" font-family="sans-serif" font-size="12" fill="#0284c7">测定时间 t</text>

  <!-- 科学推理框 -->
  <rect x="70" y="30" width="360" height="60" rx="8" fill="#1e293b"/>
  <text x="85" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">伽利略的科学方法：</text>
  <text x="85" y="75" font-family="sans-serif" font-size="13" fill="#f8fafc">斜面冲淡重力 → 证明 x ∝ t² → 外推至 θ=90° 自由落体</text>
</svg>