<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">电学实验核心：伏安法内接/外接与控制电路设计判据</text>

  <!-- 左区：伏安法内接 vs 外接系统误差对比 -->
  <g transform="translate(40, 55)">
    <rect width="445" height="440" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="222" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">1. 伏安法测电阻：内接法 vs 外接法</text>

    <!-- 外接法原理图 (Amperemeter Outside) -->
    <g transform="translate(25, 45)">
      <rect width="395" height="165" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">【电流表外接法】（测小电阻：Rx ≪ Rv）</text>
      
      <!-- 电路符号 -->
      <!-- 电流表 A -->
      <circle cx="90" cy="65" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="90" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
      
      <!-- 待测电阻 Rx -->
      <rect x="180" y="55" width="50" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
      <text x="205" y="69" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Rx</text>

      <!-- 并联电压表 V -->
      <circle cx="205" cy="120" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="205" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">V</text>

      <!-- 导线连接 -->
      <line x1="30" y1="65" x2="74" y2="65" stroke="#1e293b" stroke-width="2"/>
      <line x1="106" y1="65" x2="180" y2="65" stroke="#1e293b" stroke-width="2"/>
      <line x1="230" y1="65" x2="350" y2="65" stroke="#1e293b" stroke-width="2"/>
      <path d="M 140 65 L 140 120 L 189 120" fill="none" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M 221 120 L 290 120 L 290 65" fill="none" stroke="#1e293b" stroke-width="1.5"/>

      <!-- 误差分析 -->
      <text x="15" y="152" font-family="sans-serif" font-size="11" fill="#334155">误差来源：电压表分流 (I_测 = I_x + I_V) ⟹ <tspan font-weight="bold" fill="#dc2626">R_测 &lt; R_真</tspan>（偏小）</text>
    </g>

    <!-- 内接法原理图 (Amperemeter Inside) -->
    <g transform="translate(25, 225)">
      <rect width="395" height="165" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ea580c">【电流表内接法】（测大电阻：Rx ≫ Ra）</text>
      
      <!-- 电流表 A 与待测电阻 Rx 串联在电压表内部 -->
      <circle cx="150" cy="65" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="150" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>

      <rect x="220" y="55" width="50" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
      <text x="245" y="69" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Rx</text>

      <!-- 并联外侧电压表 V -->
      <circle cx="195" cy="120" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="195" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">V</text>

      <!-- 导线 -->
      <line x1="30" y1="65" x2="134" y2="65" stroke="#1e293b" stroke-width="2"/>
      <line x1="166" y1="65" x2="220" y2="65" stroke="#1e293b" stroke-width="2"/>
      <line x1="270" y1="65" x2="350" y2="65" stroke="#1e293b" stroke-width="2"/>
      <path d="M 80 65 L 80 120 L 179 120" fill="none" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M 211 120 L 310 120 L 310 65" fill="none" stroke="#1e293b" stroke-width="1.5"/>

      <!-- 误差分析 -->
      <text x="15" y="152" font-family="sans-serif" font-size="11" fill="#334155">误差来源：电流表分压 (U_测 = U_x + U_A) ⟹ <tspan font-weight="bold" fill="#dc2626">R_测 &gt; R_真</tspan>（偏大）</text>
    </g>

    <!-- 临界判据总结 -->
    <text x="35" y="415" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">判据法则：临界电阻 R₀ = √(Ra · Rv)。</text>
    <text x="35" y="430" font-family="sans-serif" font-size="11" fill="#64748b">若 Rx &lt; R₀ 选外接法；若 Rx &gt; R₀ 选内接法（“大内偏大，小外偏小”）。</text>
  </g>

  <!-- 右区：分压式 vs 限流式控制电路选择 -->
  <g transform="translate(515, 55)">
    <rect width="445" height="440" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="222" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">2. 控制电路：分压式 vs 限流式接法</text>

    <!-- 分压式接法 (Voltage Divider) -->
    <g transform="translate(25, 45)">
      <rect width="395" height="155" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">【分压式接法】（调压范围：0 ～ E）</text>
      
      <!-- 变阻器与滑片 -->
      <rect x="70" y="45" width="130" height="16" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
      <line x1="30" y1="53" x2="70" y2="53" stroke="#1e293b" stroke-width="2"/>
      <line x1="200" y1="53" x2="240" y2="53" stroke="#1e293b" stroke-width="2"/>
      
      <!-- 滑片 P -->
      <polygon points="135,35 140,45 130,45" fill="#dc2626"/>
      <line x1="135" y1="35" x2="135" y2="15" stroke="#dc2626" stroke-width="2"/>
      <path d="M 135 15 L 290 15 L 290 50" fill="none" stroke="#dc2626" stroke-width="2"/>

      <!-- 负载 Rx -->
      <rect x="275" y="50" width="30" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="290" y="74" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Rx</text>
      <path d="M 290 90 L 290 110 L 30 110 L 30 53" fill="none" stroke="#1e293b" stroke-width="2"/>

      <!-- 特点文字 -->
      <text x="15" y="132" font-family="sans-serif" font-size="11" fill="#334155">【优势】：电压可从 <tspan font-weight="bold" fill="#dc2626">0 连续调节到 E</tspan>；能有效控制大阻值负载。</text>
      <text x="15" y="146" font-family="sans-serif" font-size="10" fill="#64748b">【能耗】：滑片两端持续消耗电能，整体回路功耗较大。</text>
    </g>

    <!-- 四大必须选分压式原则 -->
    <g transform="translate(25, 215)">
      <rect width="395" height="205" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">必须采用【分压式】接法的四大命题铁律：</text>
      
      <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#334155">① <tspan font-weight="bold" fill="#dc2626">要求电压从 0 开始连续调节</tspan>（如测伏安特性曲线）；</text>
      <text x="15" y="76" font-family="sans-serif" font-size="12" fill="#334155">② <tspan font-weight="bold" fill="#dc2626">负载电阻远大于滑动变阻器阻值</tspan>（Rx ≫ R_滑）；</text>
      <text x="35" y="94" font-family="sans-serif" font-size="11" fill="#64748b">若用限流式，调节滑片时电压/电流几乎毫无变化！</text>
      
      <text x="15" y="120" font-family="sans-serif" font-size="12" fill="#334155">③ <tspan font-weight="bold" fill="#dc2626">限流电路中无论如何调节，电流均超过电表量程</tspan>；</text>
      <text x="35" y="138" font-family="sans-serif" font-size="11" fill="#64748b">即 I_min = E / (R_滑 + Rx) &gt; I_满偏 时必须分压保护！</text>

      <text x="15" y="166" font-family="sans-serif" font-size="12" fill="#334155">④ <tspan font-weight="bold" fill="#dc2626">需要获取多组大范围离散数据</tspan>以绘制高精度拟合线。</text>
      <text x="15" y="192" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">除上述情况外，为了节能与保护电路，优先选用【限流式】接法。</text>
    </g>
  </g>
</svg>
