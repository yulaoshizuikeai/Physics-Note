<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-dark2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="390" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">力学规律实验：平抛运动连续三点模型与单摆测重力加速度</text>

  <!-- 左卡片：平抛运动无原点三点逐差模型 -->
  <g transform="translate(20, 48)">
    <rect width="365" height="308" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="182" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1. 平抛运动无原点三点逐差模型</text>

    <!-- 坐标系与轨迹 -->
    <g transform="translate(25, 45)">
      <!-- 方格背景 -->
      <path d="M 20 20 h 140 M 20 50 h 140 M 20 90 h 140 M 20 140 h 140
               M 20 20 v 130 M 60 20 v 130 M 100 20 v 130 M 140 20 v 130"
            fill="none" stroke="#e2e8f0" stroke-width="1"/>

      <!-- 抛体轨迹抛物线 -->
      <path d="M 10 10 Q 50 20 80 50 T 145 145" fill="none" stroke="#2563eb" stroke-width="2.5"/>

      <!-- 点 A (60, 40) -->
      <circle cx="50" cy="30" r="4.5" fill="#dc2626"/>
      <text x="42" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">A</text>

      <!-- 点 B (90, 70) -->
      <circle cx="90" cy="65" r="4.5" fill="#dc2626"/>
      <text x="82" y="62" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">B</text>

      <!-- 点 C (130, 120) -->
      <circle cx="130" cy="120" r="4.5" fill="#dc2626"/>
      <text x="122" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">C</text>

      <!-- 水平相等位移标注 Δx -->
      <line x1="50" y1="160" x2="90" y2="160" stroke="#059669" stroke-width="1.5"/>
      <line x1="50" y1="155" x2="50" y2="165" stroke="#059669" stroke-width="1.5"/>
      <line x1="90" y1="155" x2="90" y2="165" stroke="#059669" stroke-width="1.5"/>
      <text x="70" y="174" font-family="sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">Δx</text>

      <line x1="90" y1="160" x2="130" y2="160" stroke="#059669" stroke-width="1.5"/>
      <line x1="130" y1="155" x2="130" y2="165" stroke="#059669" stroke-width="1.5"/>
      <text x="110" y="174" font-family="sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">Δx</text>

      <!-- 竖直位移标注 y1 与 y2 -->
      <line x1="170" y1="30" x2="170" y2="65" stroke="#ea580c" stroke-width="1.5"/>
      <line x1="165" y1="30" x2="175" y2="30" stroke="#ea580c" stroke-width="1.5"/>
      <line x1="165" y1="65" x2="175" y2="65" stroke="#ea580c" stroke-width="1.5"/>
      <text x="180" y="52" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c">y₁</text>

      <line x1="170" y1="65" x2="170" y2="120" stroke="#ea580c" stroke-width="1.5"/>
      <line x1="165" y1="120" x2="175" y2="120" stroke="#ea580c" stroke-width="1.5"/>
      <text x="180" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c">y₂</text>

      <!-- 数学推导框 -->
      <g transform="translate(200, 25)">
        <rect width="125" height="135" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">模型推导：</text>
        <text x="10" y="40" font-family="sans-serif" font-size="11" fill="#334155">水平恒速：<tspan font-weight="bold" fill="#059669">t = T</tspan></text>
        <text x="10" y="60" font-family="sans-serif" font-size="11" fill="#334155">竖直匀加速：</text>
        <text x="10" y="78" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c">Δy = y₂ - y₁ = g T²</text>
        <text x="10" y="100" font-family="sans-serif" font-size="11" fill="#334155">初速度求解：</text>
        <text x="10" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">v₀ = Δx √(g / Δy)</text>
      </g>
    </g>

    <!-- 底部结论 -->
    <g transform="translate(15, 230)">
      <rect width="335" height="66" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="20" font-family="sans-serif" font-size="11.5" fill="#334155">【无原点技巧】取水平等距三点，利用 <tspan font-weight="bold" fill="#ea580c">Δy = gT²</tspan> 算出时间 T。</text>
      <text x="12" y="40" font-family="sans-serif" font-size="11.5" fill="#334155">【顶点反推】<tspan font-weight="bold" fill="#2563eb">vyB = (y₁ + y₂) / (2T)</tspan>，由 <tspan font-weight="bold" fill="#059669">tB = vyB / g</tspan> 反推抛出点！</text>
      <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#64748b">【注意】斜槽末端必须严格切线水平，每次从同一高度由静止释放。</text>
    </g>
  </g>

  <!-- 右卡片：单摆测重力加速度 -->
  <g transform="translate(395, 48)">
    <rect width="365" height="308" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="182" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">2. 用单摆测重力加速度（周期累积与图像法）</text>

    <!-- 单摆示意图 -->
    <g transform="translate(30, 45)">
      <!-- 悬挂支点 -->
      <line x1="20" y1="10" x2="80" y2="10" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="10" r="3" fill="#dc2626"/>

      <!-- 细线 -->
      <line x1="50" y1="10" x2="50" y2="120" stroke="#64748b" stroke-width="1.5"/>
      <line x1="50" y1="10" x2="85" y2="110" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- 小球 -->
      <circle cx="50" cy="130" r="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
      <circle cx="85" cy="118" r="10" fill="#93c5fd" stroke="#60a5fa" stroke-width="1"/>

      <!-- 摆长标注 -->
      <line x1="25" y1="10" x2="25" y2="120" stroke="#475569" stroke-width="1"/>
      <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="end">线长 l</text>
      <line x1="25" y1="120" x2="25" y2="130" stroke="#dc2626" stroke-width="1.5"/>
      <text x="20" y="130" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="end">d/2</text>

      <!-- 有效摆长标注 -->
      <text x="50" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">摆长 L = l + d/2</text>
    </g>

    <!-- T² - L 图像 -->
    <g transform="translate(185, 45)">
      <!-- 坐标轴 -->
      <line x1="25" y1="130" x2="160" y2="130" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-dark2)"/>
      <text x="160" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">L (m)</text>
      <line x1="25" y1="130" x2="25" y2="15" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-dark2)"/>
      <text x="20" y="12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">T² (s²)</text>

      <!-- 真实图线 (过原点) -->
      <line x1="25" y1="130" x2="140" y2="40" stroke="#2563eb" stroke-width="2"/>
      <text x="135" y="55" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb">正常 T²-L</text>

      <!-- 漏加半径图线 (T² = 4π²/g·l + 4π²r/g，纵截距在纵轴正半轴，向上平移) -->
      <line x1="25" y1="108" x2="140" y2="18" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3 3"/>
      <circle cx="25" cy="108" r="3" fill="#ea580c"/>
      <text x="95" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ea580c">漏加球半径 (T²-l)</text>
      <text x="15" y="112" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ea580c" text-anchor="end">截距>0</text>

      <!-- 斜率标注 -->
      <text x="55" y="80" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#059669">两线平行！</text>
      <text x="55" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">斜率恒为 4π²/g</text>
    </g>

    <!-- 说明卡片 -->
    <g transform="translate(15, 230)">
      <rect width="335" height="66" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="19" font-family="sans-serif" font-size="11.5" fill="#334155">【计时铁律】必须在<tspan font-weight="bold" fill="#dc2626">平衡位置（最低点）</tspan>计时，累积 30~50 次！</text>
      <text x="12" y="38" font-family="sans-serif" font-size="11.5" fill="#334155">【避坑核心】漏加球半径图线纵轴截距为正，但<tspan font-weight="bold" fill="#059669">斜率严格不变</tspan>！</text>
      <text x="12" y="56" font-family="sans-serif" font-size="11" fill="#64748b">【条件】小角度摆动（θ &lt; 5°），保证单摆运动为标准简谐运动。</text>
    </g>
  </g>
</svg>
