<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">测电源电动势与内阻等效电源模型与光热经典实验</text>

  <!-- 左区：测电源电动势与内阻 U-I 图像及等效分析 -->
  <g transform="translate(40, 55)">
    <rect width="445" height="440" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="222" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">1. 伏安法测电源电动势与内阻（U-I 图像分析）</text>

    <!-- U-I 图坐标系 -->
    <g transform="translate(50, 45)">
      <line x1="30" y1="180" x2="330" y2="180" stroke="#1e293b" stroke-width="1.5"/>
      <text x="335" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b">I / A</text>
      <line x1="30" y1="180" x2="30" y2="20" stroke="#1e293b" stroke-width="1.5"/>
      <text x="30" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">U / V</text>

      <!-- 真实线 (True Line) -->
      <line x1="30" y1="40" x2="280" y2="180" stroke="#16a34a" stroke-width="2.5"/>
      <text x="40" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">E_真 (真实截距)</text>

      <!-- 外接法测量线 (Measured Line, 电压表分流) -->
      <!-- 截距偏小，斜率偏小 -->
      <line x1="30" y1="58" x2="280" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="40" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">E_测 (测量线，交于短路点)</text>
      
      <!-- 短路电流点 -->
      <circle cx="280" cy="180" r="4" fill="#1e293b"/>
      <text x="280" y="196" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">I_短 = E/r</text>
    </g>

    <!-- 等效电源深度解构 -->
    <g transform="translate(20, 260)">
      <rect width="405" height="165" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">【外接法系统误差】（将电压表等效并入电源内部）：</text>
      <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#334155">等效电动势：<tspan font-weight="bold" fill="#dc2626">E_测 = [Rv / (r + Rv)] E_真 &lt; E_真</tspan></text>
      <text x="15" y="66" font-family="sans-serif" font-size="12" fill="#334155">等效内阻：<tspan font-weight="bold" fill="#dc2626">r_测 = [r · Rv] / (r + Rv) &lt; r_真</tspan></text>
      <text x="15" y="88" font-family="sans-serif" font-size="11" fill="#ea580c">（短路时 U=0，电压表分流为0，故短路电流测量值严格等于真实值！）</text>
      
      <line x1="15" y1="102" x2="390" y2="102" stroke="#e2e8f0" stroke-width="1"/>
      <text x="15" y="122" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">【内接法系统误差】（电流表分压）：</text>
      <text x="15" y="142" font-family="sans-serif" font-size="12" fill="#334155"><tspan font-weight="bold">E_测 = E_真</tspan>，但 <tspan font-weight="bold" fill="#dc2626">r_测 = r_真 + Ra &gt; r_真</tspan>（内阻显著偏大！）</text>
      <text x="15" y="158" font-family="sans-serif" font-size="11" fill="#64748b">普通干电池内阻仅约 1Ω，Ra 约 0.5Ω，故内阻测量严禁选用内接法！</text>
    </g>
  </g>

  <!-- 右区：双缝干涉与插针法测折射率 -->
  <g transform="translate(515, 55)">
    <rect width="445" height="440" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="222" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">2. 光学经典实验：双缝干涉与插针法测折射率</text>

    <!-- 双缝干涉光路与条纹 -->
    <g transform="translate(20, 45)">
      <rect width="405" height="180" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">【双缝干涉测波长 λ】（公式：Δx = (l/d) λ）</text>

      <!-- 双缝与屏示意 -->
      <line x1="40" y1="45" x2="40" y2="70" stroke="#475569" stroke-width="3"/>
      <line x1="40" y1="80" x2="40" y2="100" stroke="#475569" stroke-width="3"/>
      <line x1="40" y1="110" x2="40" y2="135" stroke="#475569" stroke-width="3"/>
      <text x="20" y="93" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">双缝 d</text>

      <!-- 屏 -->
      <line x1="220" y1="40" x2="220" y2="140" stroke="#1e293b" stroke-width="3"/>
      <text x="230" y="55" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">屏 (Screen)</text>
      <!-- 距离 l 标注 -->
      <line x1="40" y1="145" x2="220" y2="145" stroke="#64748b" stroke-width="1.5"/>
      <text x="130" y="160" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">双缝到屏距离 l</text>

      <!-- 屏上的干涉条纹 -->
      <g transform="translate(265, 45)">
        <rect width="125" height="95" fill="#0f172a" rx="3"/>
        <!-- 明暗相间的红光条纹 -->
        <line x1="15" y1="0" x2="15" y2="95" stroke="#ef4444" stroke-width="8"/>
        <line x1="40" y1="0" x2="40" y2="95" stroke="#ef4444" stroke-width="8"/>
        <line x1="65" y1="0" x2="65" y2="95" stroke="#ef4444" stroke-width="8"/>
        <line x1="90" y1="0" x2="90" y2="95" stroke="#ef4444" stroke-width="8"/>
        <line x1="115" y1="0" x2="115" y2="95" stroke="#ef4444" stroke-width="8"/>
        <text x="62" y="112" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">条纹间距 Δx</text>
      </g>
    </g>

    <!-- 插针法测折射率 -->
    <g transform="translate(20, 240)">
      <rect width="405" height="185" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669">【插针法测玻璃砖折射率 n】</text>

      <!-- 玻璃砖草图 -->
      <rect x="50" y="45" width="220" height="60" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <text x="160" y="78" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">玻璃砖 (折射率 n)</text>

      <!-- 光线与大头针 P1, P2, P3, P4 -->
      <!-- 入射光线 -->
      <line x1="30" y1="20" x2="100" y2="45" stroke="#dc2626" stroke-width="2"/>
      <circle cx="50" cy="27" r="3" fill="#dc2626"/>
      <text x="45" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">P₁</text>
      <circle cx="80" cy="38" r="3" fill="#dc2626"/>
      <text x="75" y="32" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">P₂</text>

      <!-- 玻璃内部折射光线 -->
      <line x1="100" y1="45" x2="150" y2="105" stroke="#dc2626" stroke-width="2"/>

      <!-- 出射光线 -->
      <line x1="150" y1="105" x2="220" y2="130" stroke="#dc2626" stroke-width="2"/>
      <circle cx="180" cy="116" r="3" fill="#dc2626"/>
      <text x="180" y="132" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">P₃</text>
      <circle cx="210" cy="126" r="3" fill="#dc2626"/>
      <text x="210" y="142" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">P₄</text>

      <!-- 核心法则与公式 -->
      <g transform="translate(285, 45)">
        <text x="0" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">计算公式：</text>
        <text x="0" y="40" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">n = sin θ₁ / sin θ₂</text>
        <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#334155">【插针判据】：</text>
        <text x="0" y="85" font-family="sans-serif" font-size="10" fill="#64748b">视线透过玻璃，</text>
        <text x="0" y="102" font-family="sans-serif" font-size="10" fill="#64748b">P₄ 恰挡住 P₃ 及</text>
        <text x="0" y="118" font-family="sans-serif" font-size="10" fill="#64748b">P₁, P₂ 的虚像。</text>
      </g>
    </g>
  </g>
</svg>
