<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="100%" height="380">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="370" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">小船过河物理模型（运动的独立性与等时性）</text>

  <g transform="translate(30, 50)">
    <rect x="0" y="20" width="320" height="180" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1"/>
    <line x1="0" y1="20" x2="320" y2="20" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="200" x2="320" y2="200" stroke="#64748b" stroke-width="3"/>
    <text x="160" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">模型一：渡河时间最短 (t_min = d / v_船)</text>
    
    <line x1="30" y1="50" x2="100" y2="50" stroke="#38bdf8" stroke-width="2" marker-end="url(#ab)"/>
    <text x="108" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#0284c7">v_水</text>
    
    <circle cx="60" cy="200" r="5" fill="#0f172a"/>
    <text x="45" y="218" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">出发点 A</text>
    
    <line x1="60" y1="200" x2="60" y2="90" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="68" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">v_船 (船头垂直对岸)</text>
    
    <line x1="60" y1="90" x2="170" y2="90" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ab)"/>
    <text x="110" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">v_水</text>

    <line x1="60" y1="200" x2="170" y2="90" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
    <text x="125" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">v_合</text>

    <line x1="60" y1="200" x2="240" y2="20" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="240" cy="20" r="4" fill="#16a34a"/>
    <text x="248" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">到达点 B</text>

    <line x1="60" y1="20" x2="240" y2="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="150" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#b45309">下游漂移 x = v_水 · t</text>
    
    <text x="160" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">特点：只要船头垂直河岸，渡河时间恒最短，不受水流大小影响！</text>
  </g>

  <g transform="translate(390, 50)">
    <rect x="0" y="20" width="320" height="180" fill="#e0f2fe" stroke="#93c5fd" stroke-width="1"/>
    <line x1="0" y1="20" x2="320" y2="20" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="200" x2="320" y2="200" stroke="#64748b" stroke-width="3"/>
    <text x="160" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">模型二：渡河位移最短 (s_min = d, v_船 &gt; v_水)</text>

    <circle cx="60" cy="200" r="5" fill="#0f172a"/>
    <text x="45" y="218" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">出发点 A</text>

    <line x1="60" y1="200" x2="60" y2="20" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
    <circle cx="60" cy="20" r="4" fill="#16a34a"/>
    <text x="68" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">正对岸点 B (位移 d)</text>

    <line x1="60" y1="200" x2="10" y2="75" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="-25" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">v_船 (偏向上游)</text>

    <line x1="10" y1="75" x2="60" y2="75" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ab)"/>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">v_水</text>

    <path d="M 60 170 A 30 30 0 0 0 45 163" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <text x="48" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">θ</text>

    <text x="160" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">条件：sinθ = v_水 / v_船，合速度垂直河岸，v_合 = √(v_船² - v_水²)</text>
  </g>

  <rect x="30" y="325" width="680" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="45" y="349" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">若 v_船 &lt; v_水，船无法垂直到达正对岸；以 v_水 末端作圆找切线，最小位移 s_min = d · (v_水 / v_船)。</text>
</svg>