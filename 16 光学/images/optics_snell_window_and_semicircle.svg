<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="100%">
  <defs>
    <marker id="arr-b-op" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r-op" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-y-op" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 背景底板 -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部主标题条 -->
  <rect x="20" y="12" width="740" height="34" rx="6" fill="#1e293b"/>
  <text x="390" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    几何光学全反射两大经典光路模型（斯涅尔窗 · 半圆形玻璃砖）
  </text>

  <!-- ==================== 左列：水下点光源透光圆斑 (斯涅尔窗) ==================== -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#eff6ff"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      模型一：水下点光源斯涅尔透光圆斑
    </text>

    <!-- 水体背景填充 (下方) -->
    <rect x="10" y="85" width="340" height="115" fill="#f0f9ff"/>
    <!-- 水面分界面线 -->
    <line x1="10" y1="85" x2="350" y2="85" stroke="#0284c7" stroke-width="2.5"/>
    <text x="25" y="78" font-family="system-ui, sans-serif" font-size="10.5" fill="#0284c7">水面 (空气 n = 1)</text>
    <text x="25" y="102" font-family="system-ui, sans-serif" font-size="10.5" fill="#0369a1">水介质 (折射率 n)</text>

    <!-- 点光源 S 位置 (180, 180) -->
    <circle cx="180" cy="180" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="180" y="196" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">点光源 S (深 h)</text>

    <!-- 中心垂线 (法线与深度 h) -->
    <line x1="180" y1="85" x2="180" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- 中心垂直出射光线 (折射角 0) -->
    <line x1="180" y1="85" x2="180" y2="40" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-y-op)"/>
    <text x="185" y="140" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#64748b">h</text>

    <!-- 左侧临界光线 (入射角 C) -->
    <!-- 入射光 -->
    <line x1="180" y1="180" x2="95" y2="85" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- 掠射折射光线 (折射角 90°) -->
    <line x1="95" y1="85" x2="25" y2="85" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-r-op)"/>
    <!-- 左法线 -->
    <line x1="95" y1="65" x2="95" y2="105" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="135" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#d97706">C</text>

    <!-- 右侧临界光线 (入射角 C) -->
    <!-- 入射光 -->
    <line x1="180" y1="180" x2="265" y2="85" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- 掠射折射光线 -->
    <line x1="265" y1="85" x2="335" y2="85" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-r-op)"/>
    <!-- 右法线 -->
    <line x1="265" y1="65" x2="265" y2="105" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="215" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#d97706">C</text>

    <!-- 透光圆斑区域标记 -->
    <line x1="95" y1="42" x2="265" y2="42" stroke="#059669" stroke-width="2"/>
    <line x1="95" y1="36" x2="95" y2="48" stroke="#059669" stroke-width="2"/>
    <line x1="265" y1="36" x2="265" y2="48" stroke="#059669" stroke-width="2"/>
    <text x="180" y="36" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#059669" text-anchor="middle">
      水面透光圆斑直径 2R
    </text>

    <!-- 结论卡片 -->
    <rect x="10" y="205" width="340" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="223" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">
      ✦ 全反射临界角：sin C = 1 / n
    </text>
    <text x="18" y="242" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">
      ✦ 圆斑半径与面积：R = h / √(n² - 1)  |  S_透 = π h² / (n² - 1)
    </text>
  </g>

  <!-- ==================== 右列：半圆形玻璃砖经典光路 ==================== -->
  <g transform="translate(400, 54)">
    <rect x="0" y="0" width="360" height="268" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="26" rx="6" fill="#fef2f2"/>
    <text x="180" y="18" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      模型二：半圆形玻璃砖径向光路与透光孔径
    </text>

    <!-- 半圆形玻璃砖主体 (平底朝下，圆心在 180, 160) -->
    <!-- 半圆弧：从 (80, 160) 到 (280, 160)，半径 100 -->
    <path d="M 80,160 A 100,100 0 0,1 280,160 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <line x1="60" y1="160" x2="300" y2="160" stroke="#334155" stroke-width="2.2"/>
    <circle cx="180" cy="160" r="3.5" fill="#334155"/>
    <text x="180" y="176" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">圆心 O</text>

    <!-- 光路 1：沿径向射向圆心 (绿色光线) -->
    <!-- 入射圆弧点 (109, 89) 沿半径指向 (180, 160) -->
    <line x1="80" y1="60" x2="180" y2="160" stroke="#059669" stroke-width="2" marker-end="url(#arr-g-op)"/>
    <text x="70" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669">① 径向入射</text>
    <text x="110" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#059669">入射角0°无偏折</text>

    <!-- 光路 2：垂直底边平行光射向圆弧面 (蓝色光线) -->
    <!-- 垂直入射线 (x = 240, 距中心 x = 60) -->
    <line x1="240" y1="185" x2="240" y2="80" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b-op)"/>
    <text x="245" y="185" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">② 垂直底面入射</text>

    <!-- 法线为圆心连线 OP -->
    <line x1="180" y1="160" x2="260" y2="53" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="265" y="60" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">法线(半径R)</text>

    <!-- 折射出射光线 (折向界面外) -->
    <line x1="240" y1="80" x2="285" y2="40" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r-op)"/>

    <!-- 全反射透光孔径标记卡片 -->
    <rect x="10" y="205" width="340" height="55" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="223" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">
      ✦ 圆弧面法线必过圆心：径向光线入射角为 0，直达圆心不折射！
    </text>
    <text x="18" y="242" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">
      ✦ 垂直入射全反射临界孔径：sin θ = x / R ≤ 1/n  ⇒  <tspan fill="#d97706">|x| ≤ R / n</tspan>
    </text>
  </g>

  <!-- 底部全局口诀条 -->
  <rect x="20" y="328" width="740" height="30" rx="5" fill="#334155"/>
  <text x="390" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    几何光学作图铁律：圆弧界面法线必过圆心；光密入光疏必判临界角；孔径外全部发生全反射！
  </text>
</svg>
