<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">杨氏双缝干涉实验装置与条纹间距公式推导</text>

  <!-- 双缝干涉装置与几何推导 -->
  <g transform="translate(30, 48)">
    <rect width="400" height="215" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">杨氏双缝干涉空间光路几何图景</text>

    <!-- 双缝板 -->
    <line x1="60" y1="40" x2="60" y2="80" stroke="#94a3b8" stroke-width="4"/>
    <line x1="60" y1="100" x2="60" y2="120" stroke="#94a3b8" stroke-width="4"/>
    <line x1="60" y1="140" x2="60" y2="180" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="60" cy="90" r="2" fill="#fbbf24"/><text x="40" y="94" fill="#fbbf24" font-size="10">S₁</text>
    <circle cx="60" cy="130" r="2" fill="#fbbf24"/><text x="40" y="134" fill="#fbbf24" font-size="10">S₂</text>
    <text x="75" y="112" fill="#cbd5e1" font-size="10">间距 d</text>

    <!-- 屏 -->
    <line x1="320" y1="40" x2="320" y2="180" stroke="#94a3b8" stroke-width="4"/>
    <text x="330" y="110" fill="#94a3b8" font-size="11">观察屏</text>

    <!-- 光线汇聚到点 P -->
    <circle cx="320" cy="70" r="3" fill="#f43f5e"/>
    <text x="330" y="74" fill="#f43f5e" font-size="11">点 P (位置 x)</text>
    <line x1="60" y1="90" x2="320" y2="70" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="60" y1="130" x2="320" y2="70" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- 双缝到屏距离 L -->
    <line x1="60" y1="195" x2="320" y2="195" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="190" y="192" fill="#cbd5e1" font-size="10" text-anchor="middle">双缝到屏距离 L (L ≫ d)</text>
  </g>

  <!-- 右侧：核心条纹间距公式 -->
  <g transform="translate(450, 48)">
    <rect width="280" height="215" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="140" y="24" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">条纹间距与波长定量公式</text>

    <rect x="15" y="40" width="250" height="55" rx="5" fill="#0f172a"/>
    <text x="140" y="65" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">Δx = (L / d) · λ</text>
    <text x="140" y="85" fill="#cbd5e1" font-size="10.5" text-anchor="middle">条纹间距与波长成正比！红大紫小</text>

    <rect x="15" y="105" width="250" height="95" rx="5" fill="#0f172a"/>
    <text x="25" y="125" fill="#38bdf8" font-size="11.5" font-weight="bold">• 亮纹条件：δ = k · λ (k=0,1,2...)</text>
    <text x="25" y="145" fill="#f472b6" font-size="11.5" font-weight="bold">• 暗纹条件：δ = (2k+1) · (λ/2)</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="11">• 测波长公式：λ = (d / L) · Δx</text>
    <text x="25" y="185" fill="#94a3b8" font-size="10.5">• 薄膜干涉：增透膜厚度 d = λ / (4n)</text>
  </g>
</svg>