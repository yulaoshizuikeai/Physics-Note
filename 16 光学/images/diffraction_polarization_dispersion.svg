<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">单缝衍射图样、光偏振横波性与白光棱镜色散谱</text>

  <!-- 1. 单缝衍射与双缝干涉区别 -->
  <g transform="translate(30, 48)">
    <rect width="220" height="215" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="24" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">单缝衍射 (Diffraction)</text>
    <!-- 图样示意：中央宽亮，两侧窄暗 -->
    <rect x="25" y="45" width="170" height="18" fill="#fbbf24"/>
    <text x="110" y="58" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">中央极宽明亮条纹</text>
    <rect x="40" y="70" width="140" height="8" fill="#fbbf24" opacity="0.6"/>
    <rect x="55" y="85" width="110" height="5" fill="#fbbf24" opacity="0.3"/>

    <rect x="15" y="105" width="190" height="95" rx="5" fill="#0f172a"/>
    <text x="25" y="125" fill="#38bdf8" font-size="11" font-weight="bold">与双缝干涉本质区别：</text>
    <text x="25" y="145" fill="#cbd5e1" font-size="10.5">• 双缝干涉：条纹等间距、等亮度</text>
    <text x="25" y="165" fill="#fbbf24" font-size="10.5">• 单缝衍射：中央条纹最宽最亮，</text>
    <text x="25" y="185" fill="#cbd5e1" font-size="10.5">  两侧条纹急剧变窄变暗！</text>
  </g>

  <!-- 2. 光的偏振 -->
  <g transform="translate(270, 48)">
    <rect width="220" height="215" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="110" y="24" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">光的偏振 (Polarization)</text>

    <rect x="15" y="42" width="190" height="55" rx="5" fill="#0f172a"/>
    <text x="25" y="62" fill="#4ade80" font-size="11" font-weight="bold">横波特有现象！</text>
    <text x="25" y="80" fill="#cbd5e1" font-size="10.5">纵波（如声波）绝对无偏振！</text>

    <rect x="15" y="105" width="190" height="95" rx="5" fill="#0f172a"/>
    <text x="25" y="125" fill="#38bdf8" font-size="11" font-weight="bold">起偏与检偏马吕斯定律：</text>
    <text x="25" y="145" fill="#cbd5e1" font-size="10.5">• 自然光通过起偏器变偏振光</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="10.5">• 两偏振片平行：透光最强</text>
    <text x="25" y="185" fill="#f43f5e" font-size="10.5">• 两偏振片垂直：完全不透光！</text>
  </g>

  <!-- 3. 白光棱镜色散 -->
  <g transform="translate(510, 48)">
    <rect width="220" height="215" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="110" y="24" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle">棱镜色散 (Dispersion)</text>

    <rect x="15" y="42" width="190" height="158" rx="5" fill="#0f172a"/>
    <text x="25" y="62" fill="#f87171" font-size="11" font-weight="bold">红光 ────────► 紫光</text>
    <text x="25" y="82" fill="#cbd5e1" font-size="10">• 频率 f：低 ────► 高</text>
    <text x="25" y="102" fill="#cbd5e1" font-size="10">• 真空波长 λ：长 ──► 短</text>
    <text x="25" y="122" fill="#38bdf8" font-size="10.5" font-weight="bold">• 介质折射率 n：小 ─► 大</text>
    <text x="25" y="142" fill="#cbd5e1" font-size="10">• 介质波速 v=c/n：大 ─► 小</text>
    <text x="25" y="162" fill="#f472b6" font-size="10.5" font-weight="bold">• 偏折角 θ：小 ──► 大</text>
    <text x="25" y="182" fill="#fbbf24" font-size="10">• 临界角 C：大 ──► 小 (紫最易全反射)</text>
  </g>
</svg>