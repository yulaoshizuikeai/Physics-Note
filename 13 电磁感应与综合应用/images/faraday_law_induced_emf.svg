<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a" rx="10" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">法拉第电磁感应定律：动生电动势与感生电动势深度对比</text>

  <!-- 左侧：动生电动势 -->
  <g transform="translate(30, 50)">
    <rect width="335" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="167" y="25" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">动生电动势 (导体切割磁感线)</text>

    <!-- 图示 -->
    <g fill="#475569" font-size="12"><text x="30" y="55">×</text><text x="100" y="55">×</text><text x="170" y="55">×</text></g>
    <line x1="80" y1="40" x2="80" y2="105" stroke="#fbbf24" stroke-width="5"/>
    <polygon points="120,72 105,67 105,77" fill="#4ade80"/>
    <line x1="80" y1="72" x2="110" y2="72" stroke="#4ade80" stroke-width="2"/>
    <text x="125" y="76" fill="#4ade80" font-size="12" font-weight="bold">v</text>
    <text x="60" y="45" fill="#f43f5e" font-size="12" font-weight="bold">+端</text>
    <text x="60" y="115" fill="#38bdf8" font-size="12" font-weight="bold">-端</text>

    <!-- 说明文字 -->
    <rect x="15" y="115" width="305" height="100" rx="6" fill="#0f172a"/>
    <text x="25" y="135" fill="#38bdf8" font-size="13" font-weight="bold">公式：E = B L v sinθ</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="11.5">• 本质非静电力：磁场对电荷的<tspan fill="#fbbf24" font-weight="bold">洛伦兹力</tspan></text>
    <text x="25" y="175" fill="#cbd5e1" font-size="11.5">• 磁场恒定不变，导体棒空间运动切割</text>
    <text x="25" y="195" fill="#cbd5e1" font-size="11.5">• 电势高低由<tspan fill="#4ade80" font-weight="bold">右手定则</tspan>判定（掌迎B，拇指指v）</text>
  </g>

  <!-- 右侧：感生电动势 -->
  <g transform="translate(395, 50)">
    <rect width="335" height="230" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <text x="167" y="25" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">感生电动势 (磁场随时间变化)</text>

    <!-- 图示 -->
    <circle cx="167" cy="72" r="32" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="167" y="68" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">B(t) 变化</text>
    <text x="167" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">线圈静止不动</text>

    <!-- 说明文字 -->
    <rect x="15" y="115" width="305" height="100" rx="6" fill="#0f172a"/>
    <text x="25" y="135" fill="#f472b6" font-size="13" font-weight="bold">公式：E = N · S · (ΔB / Δt)</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="11.5">• 本质非静电力：变化的磁场产生的<tspan fill="#f472b6" font-weight="bold">感生涡旋电场</tspan></text>
    <text x="25" y="175" fill="#cbd5e1" font-size="11.5">• 麦克斯韦场论：电荷静止，电场力 qE_感 做功</text>
    <text x="25" y="195" fill="#cbd5e1" font-size="11.5">• 普适法拉第定律：E = N |ΔΦ / Δt|</text>
  </g>
</svg>